# 커리어 모드 구단 유니폼 소매 색·무늬 원자료 수집 — scripts/fetch_club_kits_wiki.mjs를 GitHub Actions에서 돌려(개발 환경에선 위키백과가 429로 막힌다)
# 결과(scripts/out/club_kits_wiki_raw.json)를 같은 브랜치에 커밋한다. 스크립트를 고쳐 푸시하거나 Run workflow로 실행.
name: club kits (wikipedia)

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/fetch_club_kits_wiki.mjs']

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/fetch_club_kits_wiki.mjs
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add scripts/out/club_kits_wiki_raw.json
          git commit -m "구단 유니폼 소매 색·무늬 원자료(위키백과) 수집 결과" || echo "변경 없음"
          git pull --rebase
          git push
