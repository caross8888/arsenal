<style>

tion:column;align-items:center;justify-content:center;pointer-events:none;opacity:0;text-shadow:0 3px 0 #000,0 0 26px #000}.result.show{opacity:1;animation:result-in .35s ease}.result strong{font-size:clamp(34px,9vw,52px);font-weight:900;letter-spacing:2px;color:var(--gold)}.result small{margin-top:8px;font-size:13px;color:var(--text)}@keyframes result-in{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}.kicks{position:absolute;top:8px;left:8px;z-index:2;max-width:calc(100% - 16px);display:flex;flex-direction:column;gap:4px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:color-mix(in srgb,var(--panel) 90%,transparent);color:var(--text);font-size:10px;pointer-events:none}.pk-row{display:flex;align-items:center;gap:6px;min-height:14px}.pk-team{width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}.pk-attempts{display:flex;align-items:center;gap:4px;flex-wrap:wrap;max-width:150px}.pk-row>b{min-width:12px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums}.kicks i{display:block;flex:none;width:8px;height:8px;background:none;border:1px solid var(--text-secondary);border-radius:50%}.kicks .goal{background:var(--green);border-color:var(--green)}.kicks .miss{background:#ef4444;border-color:#ef4444}.kicks .current{outline:1px solid var(--gold);outline-offset:2px}@media(max-width:360px){.kicks{top:6px;left:6px;padding:5px 6px}.pk-team{width:50px}.pk-attempts{gap:3px}.kicks i{width:7px;height:7px}}
.comment{min-height:52px;display:flex;align-items:center;gap:9px;padding:12px 14px;margin-top:10px;border:1px solid var(--line);border-radius:12px;background:#0b1018;font-size:12px;line-height:1.5}.comment span{color:var(--gold);font-weight:800;white-space:nowrap}.control{margin-top:22px}.meter-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-secondary);margin-bottom:10px}.meter-label b{color:var(--text);font-variant-numeric:tabular-nums}.meter{height:15px;position:relative;border-radius:5px;background:#27313d}.needle{position:absolute;width:3px;top:-4px;height:23px;background:var(--text);box-shadow:0 0 6px #000;left:0}.meter-notes{display:flex;justify-content:space-between;font-size:10px;color:var(--text-secondary);margin-top:9px}.actions{display:flex;gap:10px;margin-top:18px}.shoot{flex:1;border:0;border-radius:13px;background:var(--red);color:var(--text);font-weight:800;padding:16px;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 #870308}.shoot.held{transform:translateY(3px);box-shadow:0 1px 0 #870308}.shoot:disabled{opacity:.55}.reset{border:1px solid var(--line);color:var(--text);background:var(--panel);border-radius:13px;padding:14px 18px}.help{text-align:center;margin:16px 0 0;color:var(--text-secondary);font-size:11px;line-height:1.7}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#0b1018;color:var(--text-secondary);font-size:12px}.loading[hidden]{display:none}@media(prefers-reduced-motion:reduce){.result.show{animation:none}}@media(min-width:700px){body{padding:24px}main{border:1px solid var(--line);border-radius:26px;min-height:0}}@media(max-height:720px){main{padding-top:17px}.stages{margin:14px 0 12px}.control{margin-top:16px}}
</style>
<style>
.pk-final{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:center}.pk-final[hidden]{display:none}.pk-final strong{display:block;font-size:26px;color:var(--green)}.pk-final[data-result="loss"] strong{color:#EF4444}.pk-final span{display:block;margin-top:5px;font-size:15px;color:var(--text)}

<body><main>
<header><div class="eyebrow">FIFA WORLD CUP 2030</div><h1>월드컵 본선</h1><div class="sub">🇰🇷 대한민국 · 김도윤 #10</div></header>
<div class="stages"><div class="stage done"><b>조별</b>2승 1무</div><div class="stage done"><b>32강</b>2–0</div><div class="stage on"><b>16강</b>승부차기</div><div class="stage"><b>8강</b>—</div><div class="stage"><b>4강</b>—</div><div class="stage"><b>결승</b>—</div></div>
<section class="match" aria-label="승부차기 경기">
<div class="match-top"><div class="match-label"><span>ROUND OF 16 · 승부차기</span><span>120′</span></div><div class="teams"><span><span class="flag">🇰🇷</span> 대한민국</span><strong>1 : 1</strong><span>네덜란드 <span class="flag">🇳🇱</span></span></div></div>
<div class="scene"><div class="kicks" id="pkScoreboard" aria-label="승부차기 현황" aria-live="polite"><div class="pk-row"><span class="pk-team">내 킥</span><div class="pk-attempts" id="history"></div><b id="turn">0</b></div></div><canvas id="pitch" width="768" height="512" tabindex="0" aria-label="골문을 터치해 조준하세요. 방향키로도 조준할 수 있습니다."></canvas><div class="scene-hint" id="hint">골문을 터치해 슛 방향을 정하세요</div><div class="result" id="result" aria-live="polite"><strong></strong><small></small></div><div class="loading" id="loading">경기장 준비 중…</div></div>

</section>
<div class="pk-final" id="pkFinal" hidden role="group" aria-label="승부차기 최종 결과" aria-live="polite"><strong></strong><span></span></div>
<div class="comment" aria-live="polite"><span>PK</span><div id="comment">김도윤이 페널티 스폿에 섭니다.</div></div>
<section class="control" aria-label="슛 파워 조절"><div class="meter-label"><span>성공 확률</span><b id="chanceText">0%</b></div><div class="meter" id="meter" role="meter" aria-label="슛 성공 확률" aria-valuemin="0" aria-valuemax="80" aria-valuenow="0"><i class="needle" id="needle"></i></div><div class="meter-notes"><span>약하게</span><span>초록에 가까울수록 성공률 ↑</span><span>강하게</span></div><div class="actions"><button class="shoot" id="shoot" disabled>누르고 있다가 떼면 슛</button><button class="reset" id="reset" hidden>대회 계속</button></div><p class="help">골문 터치 → 슛 버튼 길게 누르기 → 초록에 가까운 파워에서 놓기<br>PC에서는 방향키로 조준 · 스페이스로 슛</p></section>
</main>
<script type="module">
import {penaltyPowerProfile,penaltyKickKind} from '/career/penalty-rules.js?v=1';
const $=id=>document.getElementById(id),canvas=$('pitch'),ctx=canvas.getContext('2d');
const W=768,H=512,G={l:160,r:603,t:145,b:321};
const bg=new Image(),poses={};let ready=false,aim={x:263,y:214},power=0,holding=false,holdAt=0,shot=null,frame=0,history=[];let serverConfig=null,serverResult=null,serverWaiting=false;
const net={x:G.l+8,y:G.t+5,w:G.r-G.l-16,h:G.b-G.t-15};let netSource,netPixels,netMotion;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function shotInput(p=power){return {x:(aim.x-G.l)/(G.r-G.l),y:(aim.y-G.t)/(G.b-G.t),power:p}}
let meterAimKey='';
function meter(){
 const key=aim.x+'|'+aim.y;
 if(key!==meterAimKey){
  const stops=Array.from({length:101},(_,p)=>{const hue=penaltyPowerProfile(shotInput(p)).chance/.8*120;return 'hsl('+hue.toFixed(2)+' 76% 48%) '+p+'%'});
  $('meter').style.background='linear-gradient(90deg,'+stops.join(',')+')';meterAimKey=key;
 }
 const chance=Math.round(penaltyPowerProfile(shotInput()).chance*100);
 $('needle').style.left=power+'%';$('chanceText').textContent=chance+'%';
 $('meter').setAttribute('aria-valuenow',chance);$('meter').setAttribute('aria-valuetext','성공 확률 '+chance+'%');
}
function paintHistory(){if(serverConfig){renderPk(serverResult?.pk||serverConfig.prefix);return;} $('history').replaceChildren();for(const h of history.slice(-5)){const i=document.createElement('i');i.className=h==='goal'?'goal':'miss';i.setAttribute('aria-label',h==='goal'?'성공':'실패');$('history').append(i)}if(!shot){const i=document.createElement('i');i.className='current';i.setAttribute('aria-label','현재 킥');$('history').append(i)}$('turn').textContent=history.filter(h=>h==='goal').length}
function keeperSize(name){const im=poses[name],scale=137/poses.ready.height;return {w:im.width*scale,h:im.height*scale}}
function sprite(name,x,y,w,h,flip=false){const im=poses[name],size=keeperSize(name);ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.drawImage(im,-size.w/2,-size.h,size.w,size.h);ctx.restore()}
function ball(x,y,size,spin=0){ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(spin);const d=size/12;ctx.scale(d,d);ctx.fillStyle='#f0f2e7';ctx.fillRect(-4,-6,8,12);ctx.fillRect(-6,-4,12,8);ctx.fillStyle='#27313d';ctx.fillRect(-2,-2,4,4);ctx.fillRect(-4,-5,3,2);ctx.fillRect(3,-3,3,3);ctx.fillRect(-5,3,3,2);ctx.fillRect(1,4,2,2);ctx.restore()}
function target(){ctx.save();ctx.strokeStyle='#f4d77e';ctx.lineWidth=3;ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.strokeRect(aim.x-10,aim.y-10,20,20);ctx.beginPath();for(const [a,b,c,d] of [[-16,0,-7,0],[7,0,16,0],[0,-16,0,-7],[0,7,0,16]]){ctx.moveTo(aim.x+a,aim.y+b);ctx.lineTo(aim.x+c,aim.y+d)}ctx.stroke();ctx.restore()}
// 골망의 가장자리는 고정하고 충격점 주변 픽셀에 연속적인 변위를 준다.
function prepareNet(){const c=document.createElement('canvas');c.width=W;c.height=H;const cx=c.getContext('2d');cx.imageSmoothingEnabled=false;cx.drawImage(bg,0,0,W,H);netSource=cx.getImageData(net.x,net.y,net.w,net.h);netPixels=cx.createImageData(net.w,net.h)}
function impactNet(point){const n=net.w*net.h;netMotion={delay:new Float32Array(n),weight:new Float32Array(n),dx:new Float32Array(n),dy:new Float32Array(n)};
 for(let y=0;y<net.h;y++)for(let x=0;x<net.w;x++){const i=y*net.w+x,dx=x+net.x-point.x,dy=y+net.y-point.y,d=Math.hypot(dx,dy),edge=Math.min(x,y,net.w-1-x,net.h-1-y),pin=Math.min(1,edge/14);netMotion.delay[i]=d/650;netMotion.weight[i]=Math.exp(-d*d/(2*65*65))*pin*pin;netMotion.dx[i]=dx/Math.max(10,d);netMotion.dy[i]=dy/Math.max(10,d)}
}
function rippleNet(elapsed){if(!netMotion)return;const src=netSource.data,out=netPixels.data;out.set(src);
 for(let y=1;y<net.h-1;y++)for(let x=1;x<net.w-1;x++){const i=y*net.w+x,age=elapsed-netMotion.delay[i];if(age<=0||netMotion.weight[i]<.005)continue;const pull=Math.sin(age*19)*Math.exp(-age*4.5)*7*netMotion.weight[i],sx=Math.max(0,Math.min(net.w-1,Math.round(x-pull*netMotion.dx[i]))),sy=Math.max(0,Math.min(net.h-1,Math.round(y-pull*netMotion.dy[i]))),a=i*4,b=(sy*net.w+sx)*4;out[a]=src[b];out[a+1]=src[b+1];out[a+2]=src[b+2];out[a+3]=src[b+3]}
 ctx.putImageData(netPixels,net.x,net.y);
}
function draw(now){ctx.clearRect(0,0,W,H);if(!ready)return;ctx.imageSmoothingEnabled=false;ctx.drawImage(bg,0,0,W,H);
 if(!shot){sprite('ready',W/2+ (reduced?0:Math.sin(now/400)*2),G.b,100,106);ball(W/2,442,21);target();return}
 const t=Math.max(0,(now-shot.start)/1000),flight=shot.duration,u=Math.min(1,t/flight),e=1-Math.pow(1-u,1.5),dir=shot.direction;
 let kx=W/2,ky=G.b,pose='ready',kw=100,kh=106;
 if(shot.kind==='goal'&&t>flight&&t<flight+1&&!reduced)rippleNet(t-flight);
 const dive=Math.min(1,Math.max(0,(t-.12)/.4));
 if(dive>0){kx+=(shot.keeperX-W/2)*dive;ky+=(shot.keeperY-G.b)*dive;pose=shot.kind==='weak'&&t<flight?'ready':shot.pose;kw=pose==='dive'?150:pose==='jump'?44:pose==='catch'?68:100;kh=pose==='dive'?66:pose==='jump'?120:85}
 if(shot.kind==='weak'&&t>flight){pose='catch';kx=shot.end.x;ky=shot.end.y+keeperSize('catch').h*.49;kw=68;kh=91}
 sprite(pose,kx,ky,kw,kh,pose==='dive'&&dir>0);
 let bx=W/2+(shot.end.x-W/2)*e,by=442+(shot.end.y-442)*e-Math.sin(Math.PI*u)*shot.arc,bs=21-11*e;
 const post=shot.kind==='post',save=shot.kind==='save';
 if(t>flight){const v=Math.min(1,(t-flight)/.7);if(post||save){bx+=dir*70*v;by+=95*v+30*v*v;bs+=5*v}else if(shot.kind==='goal'){by+=Math.sin(v*Math.PI)*5;bs=9}else if(shot.kind==='wide'){bx+=dir*60*v;by-=30*v;bs=7}}
 if(!(shot.kind==='weak'&&t>flight))ball(bx,by,bs,t*shot.power/5);

 if(t>flight+.45&&!shot.revealed){shot.revealed=true;history.push(shot.kind==='goal'?'goal':'miss');paintHistory();const texts={goal:['GOAL!','골망을 흔듭니다!'],save:['SAVED','골키퍼가 몸을 날려 쳐냈습니다.'],weak:['SAVED','힘이 부족했습니다. 골키퍼가 잡아냅니다.'],post:['POST!','너무 강한 슛! 골대를 맞고 나옵니다.'],wide:['MISS','너무 강한 슛! 골문을 벗어납니다.']};const [title,desc]=texts[shot.kind];$('result').firstElementChild.textContent=title;$('result').lastElementChild.textContent=desc;$('result').classList.add('show');$('comment').textContent=desc;$('reset').hidden=false;if(serverResult){document.querySelector('.help').hidden=true;}if(serverResult){renderPk(serverResult.pk);const final=$('pkFinal');final.dataset.result=serverResult.pk.won?'win':'loss';final.firstElementChild.textContent=serverResult.pk.won?'승부차기 승리':'승부차기 패배';final.lastElementChild.textContent='PK '+serverResult.pk.our+' – '+serverResult.pk.their;final.hidden=false;$('comment').textContent=desc+' '+(serverResult.pk.won?'승부차기 승리!':'승부차기 패배.');}}
}
function loop(now){if(holding){const n=(now-holdAt)/900,p=n%2;power=(p<=1?p:2-p)*100;meter()}draw(now);frame=requestAnimationFrame(loop)}
function aimAt(x,y){if(!ready||shot||holding)return;aim={x:Math.max(G.l+12,Math.min(G.r-12,x)),y:Math.max(G.t+12,Math.min(G.b-12,y))};meter()}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;if(x<G.l-10||x>G.r+10||y<G.t-10||y>G.b+10)return;aimAt(x,y);canvas.focus({preventScroll:true})});
function begin(){if(!ready||shot||holding||serverWaiting)return;holding=true;holdAt=performance.now();power=0;$('shoot').classList.add('held');$('hint').textContent='초록에 가까울 때 손을 떼세요';meter()}
function cancel(){holding=false;power=0;$('shoot').classList.remove('held');$('hint').textContent='골문을 터치해 슛 방향을 정하세요';meter()}
function kick(p=power,rng=Math.random,authoritative){if(!ready||shot||serverWaiting)return;if(serverConfig&&!authoritative){holding=false;$('shoot').classList.remove('held');serverWaiting=true;$('shoot').disabled=true;$('comment').textContent=(serverConfig.player||'선수')+', 슛을 준비합니다…';parent.postMessage({type:'career-penalty-kick',key:serverConfig.key,x:(aim.x-G.l)/(G.r-G.l),y:(aim.y-G.t)/(G.b-G.t),power:p},location.origin);return;}holding=false;$('shoot').classList.remove('held');power=Math.max(0,Math.min(100,p));meter();const dir=aim.x>=W/2?1:-1;let kind=authoritative||penaltyKickKind(shotInput(),rng);
 let end={...aim};if(authoritative)kind=authoritative;if(kind==='weak')end.y=Math.max(G.b-34,end.y);if(kind==='post'){if(Math.abs(aim.x-W/2)<110)end.y=G.t-5;else end.x=dir<0?G.l-4:G.r+4}if(kind==='wide'){if(Math.abs(aim.x-W/2)<110)end.y=G.t-35;else end.x=dir<0?G.l-48:G.r+48}
 const opposite=kind==='goal'||kind==='post'||kind==='wide',diveDir=opposite?-dir:dir,pose=kind==='weak'?'catch':Math.abs(end.x-W/2)<50&&!opposite?'jump':'dive',keeperX=opposite?W/2-dir*112:pose==='dive'?end.x-diveDir*keeperSize('dive').w*.4:end.x,keeperY=opposite?G.b-3:pose==='jump'?end.y+keeperSize('jump').h*.9:kind==='weak'?end.y+keeperSize('catch').h*.49:end.y+keeperSize('dive').h*.7;
 shot={start:performance.now(),duration:kind==='weak'?.95:.55,end,power,kind,direction:diveDir,keeperX,keeperY,pose,arc:kind==='weak'?9:24,revealed:false};if(kind==='goal'&&!reduced)impactNet(end);$('shoot').disabled=true;$('hint').hidden=true;$('comment').textContent=(serverConfig?.player||'김도윤')+', 골문을 향해 슛!';canvas.setAttribute('aria-label','슛 결과를 재생하고 있습니다.')}
$('shoot').addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();$('shoot').setPointerCapture(e.pointerId);begin()});$('shoot').addEventListener('pointerup',e=>{if(holding){e.preventDefault();kick()}});$('shoot').addEventListener('pointercancel',cancel);$('shoot').addEventListener('lostpointercapture',()=>{if(holding)cancel()});
function reset(){if(holding)cancel();shot=null;netMotion=null;power=0;$('shoot').disabled=!ready;$('reset').hidden=true;$('hint').hidden=false;$('hint').textContent='골문을 터치해 슛 방향을 정하세요';$('result').classList.remove('show');$('comment').textContent='김도윤이 페널티 스폿에 섭니다.';canvas.setAttribute('aria-label','골문을 터치해 조준하세요. 방향키로도 조준할 수 있습니다.');meter();paintHistory()}
$('reset').addEventListener('click',()=>{if(serverConfig){if(!shot?.revealed)return;parent.postMessage({type:'career-penalty-continue',key:serverConfig.key},location.origin);}else reset()});
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)){e.preventDefault();if(!e.repeat)aimAt(aim.x+(e.code==='ArrowLeft'?-20:e.code==='ArrowRight'?20:0),aim.y+(e.code==='ArrowUp'?-14:e.code==='ArrowDown'?14:0))}if(e.code==='Space'&&e.target!==$('reset')){e.preventDefault();if(!e.repeat)begin()}});document.addEventListener('keyup',e=>{if(e.code==='Space'&&holding){e.preventDefault();kick()}});
window.addEventListener('blur',()=>{if(holding)cancel()});document.addEventListener('visibilitychange',()=>{if(document.hidden){if(holding)cancel();cancelAnimationFrame(frame)}else{cancelAnimationFrame(frame);frame=requestAnimationFrame(loop)}});
function renderPk(pk){
 const box=$('pkScoreboard');box.replaceChildren();
 const count=Math.max(5,pk.ours.length,pk.theirs.length);
 for(const [name,kicks,ours] of [[serverConfig.ourName,pk.ours,true],[serverConfig.theirName,pk.theirs,false]]){
  const row=document.createElement('div');row.className='pk-row';
  const label=document.createElement('span');label.className='pk-team';label.textContent=name;label.title=name;row.append(label);
  const attempts=document.createElement('div');attempts.className='pk-attempts';
  for(let j=0;j<count;j++){
   const hit=kicks[j],dot=document.createElement('i'),current=hit===undefined&&ours&&!serverResult&&j===kicks.length;
   dot.className=hit===true?'goal':hit===false?'miss':current?'current':'';
   dot.setAttribute('aria-label',(j+1)+'번 킥 · '+(hit===true?'성공':hit===false?'실패':current?'현재 킥':serverResult?'미실시':'대기'));attempts.append(dot);
  }
  row.append(attempts);const score=document.createElement('b');score.textContent=kicks.filter(Boolean).length;row.append(score);box.append(row);
 }
}
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin)return;const d=e.data;if(d?.type==='career-penalty-config'){serverConfig=d.match;document.querySelector('.eyebrow').textContent=serverConfig.year+' · '+serverConfig.cup;document.querySelector('h1').textContent=serverConfig.stage+' 승부차기';document.querySelector('.sub').textContent=serverConfig.player;document.querySelector('.stages').hidden=true;document.querySelector('.match-label>span').textContent=serverConfig.stage+' · 5번 키커';const teams=document.querySelector('.teams');teams.replaceChildren();for(const text of [serverConfig.ourName,serverConfig.our+' : '+serverConfig.their,serverConfig.theirName]){const el=document.createElement(teams.children.length===1?'strong':'span');el.textContent=text;teams.append(el)}$('comment').textContent=serverConfig.player+' 선수가 페널티 스폿에 섭니다.';paintHistory();}
 if(d?.type==='career-penalty-response'&&serverConfig&&d.result.key===serverConfig.key){serverWaiting=false;serverResult=d.result;const k=d.result.kick;aimAt(G.l+k.x*(G.r-G.l),G.t+k.y*(G.b-G.t));kick(k.power,Math.random,k.kind);}
 if(d?.type==='career-penalty-error'){serverWaiting=false;$('shoot').disabled=false;$('comment').textContent=d.error||'다시 슛을 시도해 주세요.';}});
function loadImage(im,url){return new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=url})}
Promise.all([loadImage(bg,'/img/career-penalty/stadium.webp?v=2'),...['ready','dive','catch','jump'].map(p=>{poses[p]=new Image();return loadImage(poses[p],'/img/career-penalty/'+p+'.webp?v=2')})]).then(()=>{prepareNet();ready=true;$('loading').hidden=true;$('shoot').disabled=false;frame=requestAnimationFrame(loop)}).catch(()=>{$('loading').textContent='경기장을 불러오지 못했습니다. 새로고침해주세요.'});meter();paintHistory();
window.pkDemo={reset,kick,aimAt,get state(){return {ready,holding,power,aim,shot,history:[...history]}}};
