<!doctype html><html lang="ko" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PL 시즌 진행 배경 목업</title><style>
:root{color-scheme:dark;--red:#EF0107;--red-dark:#b50004;--gold:#C8A84B;--navy:#0B0D12;--surface:#111318;--surface2:#181B22;--surface3:#1F2330;--border:rgba(255,255,255,0.07);--border-bright:rgba(255,255,255,.15);--border-accent:rgba(200,168,75,0.3);--text:#F0F2F7;--text-muted:#7A8099;--text-dim:#4A5070;--text-secondary:rgba(255,255,255,.75);--green:#22C55E;--amber:#F59E0B;--loss:#EF4444;--blue:#60A5FA;--white:#fff;--overlay-10:rgba(255,255,255,.1);--overlay-18:rgba(255,255,255,.18);--overlay-30:rgba(255,255,255,.3);--overlay-35:rgba(255,255,255,.35);--overlay-50:rgba(255,255,255,.5);--overlay-60:rgba(255,255,255,.6);--overlay-black-55:rgba(0,0,0,.55);--chrome-bg:rgba(11,13,18,.96);--dday-bg:#1a0c0f;--otd-bg:#1a1917;--modal-bg:#1a1c22;--on-dark-header:#fff;--on-dark-header-secondary:rgba(255,255,255,.75);--on-dark-header-gold:#C8A84B;--modal-header-grad:linear-gradient(135deg,#c40004 0%,#3a0102 100%);--photo-ph-grad:linear-gradient(160deg,#c40004,#3a0102);--fd:'Bebas Neue',sans-serif;--fb:'Noto Sans','Noto Sans KR',sans-serif;--fm:'Fira Mono',monospace;--safe-bottom:env(safe-area-inset-bottom,0px);}
:root[data-theme="light"]{color-scheme:light;--gold:#B8923A;--navy:#ECEEF2;--surface:#FFFFFF;--surface2:#F8F9FB;--surface3:#EFF1F4;--border:rgba(0,0,0,.06);--border-bright:rgba(0,0,0,.12);--border-accent:rgba(184,146,58,.4);--text:#14161C;--text-muted:#6B7280;--text-dim:#A9AEBB;--text-secondary:rgba(20,22,28,.68);--green:#16A34A;--amber:#D97706;--loss:#DC2626;--blue:#2563EB;--overlay-10:rgba(0,0,0,.06);--overlay-18:rgba(0,0,0,.1);--overlay-30:rgba(0,0,0,.16);--overlay-35:rgba(0,0,0,.18);--overlay-50:rgba(0,0,0,.28);--overlay-60:rgba(0,0,0,.35);--overlay-black-55:rgba(0,0,0,.72);--chrome-bg:rgba(236,238,242,.92);--dday-bg:#FDECEC;--otd-bg:#FBF3E1;--modal-bg:#FFFFFF;--modal-header-grad:linear-gradient(135deg,#b50004 0%,#4a0002 100%);--photo-ph-grad:linear-gradient(160deg,#b50004,#4a0002);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* 탭 하이라이트(터치 시 깔리는 회색·파란 사각형)는 지금까지 요소마다 하나씩 껐는데,
   새로 만드는 요소마다 계속 새로 나온다(리더보드 순위표가 그랬다). 상속되는 속성이라
   html에서 한 번 끈다 — 개별 요소의 기존 선언은 그대로 둬도 결과는 같다. */
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
/* 터치로 누르는 행에서 길게 누르거나 두 번 탭하면 텍스트가 파랗게 선택된다.
   읽을 텍스트가 아니라 버튼처럼 쓰는 행에만 선택을 끈다(뉴스 본문 등은 복사 가능해야 한다). */
.std-hdr,.std-row,.lb-round-row,.lb-tab,.f-btn,.rec-subnav-btn,.nav-btn,.team-tabs>*{-webkit-user-select:none;user-select:none}
/* 모바일 크롬은 일반 텍스트를 한 번만 탭해도 단어를 선택한다("탭하여 검색"). 헤더 전체(제목·시즌 표시)·게임 화면의
   제목/라벨/버튼처럼 읽으라고 둔 게 아닌 텍스트는 선택 자체를 끈다(길게 눌러도 선택될 필요가 없다). */
.top-header,.nav-brand,.gm-h,.gm-hrow,.gm-card,.gm-back,.gm-btn,.gm-guest,.gm-hud,.gm-qno,.gm-q-t,.gm-choice,.gm-logo,.gm-best,.gm-big,
.pk-tabs,.pk-rnav,.pk-top,.pk-sum,.pk-pick,.pk-m,.gm-row,.gm-path,.gm-me-n,.gm-me-s{-webkit-user-select:none;user-select:none}
body{background:var(--navy);color:var(--text);font-family:var(--fb);font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden;padding-bottom:calc(64px + var(--safe-bottom));}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(239,1,7,.1) 0%,transparent 60%);pointer-events:none;z-index:0}
.top-header{background:var(--chrome-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.brand{display:flex;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent;}
.logo-svg{height:20px;width:auto;flex-shrink:0}
.header-tab-title{font-family:var(--fb);font-size:24px;font-weight:700;letter-spacing:.3px;color:var(--text);line-height:1;}
.header-right{display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase}
.theme-toggle-btn{background:none;border:none;padding:4px;margin:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.theme-toggle-btn svg{width:18px;height:18px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite;flex-shrink:0}
.transfer-window-btn{display:flex;align-items:center;gap:4px;background:rgba(200,168,75,.15);border:1px solid rgba(200,168,75,.4);color:var(--gold);font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.transfer-window-btn svg{width:11px;height:11px;}
/* 헤더가 좁아지면 글자가 두 줄로 찌그러지지 않게(실측: 360px에서 이적시장 버튼이 뜨면 제목·버튼·시즌 표시가
   전부 두 줄로 접혀 헤더가 두꺼워졌다 — 게임 버튼이 들어오며 더 심해짐). 줄바꿈 대신 덜 중요한 것부터 줄인다:
   430px 이하 → 이적시장 버튼은 아이콘만, 340px 이하 → 시즌 표시도 숨김. */
.header-tab-title,.transfer-window-btn,#seasonLabel{white-space:nowrap}
@media (max-width:430px){
  .header-right{gap:7px}
  .transfer-window-btn .tw-label{display:none}
  .transfer-window-btn{padding:4px 7px}
  .transfer-window-btn svg{width:14px;height:14px}
}
@media (max-width:340px){ #seasonLabel,.header-right .live-dot{display:none} }
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--chrome-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border-bright);display:flex;padding-bottom:var(--safe-bottom);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 4px 8px;gap:4px;background:none;border:none;border-right:1px solid var(--border-bright);color:var(--text-dim);font-family:var(--fb);font-size:9px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .2s;position:relative;-webkit-tap-highlight-color:transparent;}
.nav-btn:last-child{border-right:none;}
.nav-brand{display:none;}
.nav-btn.active{background:var(--red-dark);color:var(--white)}.nav-btn.active .nav-icon{color:var(--gold)}
.nav-icon{width:20px;height:20px;color:var(--text-dim);}
.nav-live-dot{position:absolute;top:8px;right:calc(50% - 16px);width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 5px var(--green);animation:pulse 2s infinite}
.page{position:relative;z-index:1}
.section{display:none;padding:16px;max-width:none;margin:0 auto}
.section.active{display:block;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--surface);border:1px solid var(--border-bright);border-radius:12px;overflow:hidden}
/* 리더보드 순위표를 감싸는 .card만 세그먼트 탭들과 같은 밝은 아웃라인으로
   맞춘다 — .card는 실시간 경기 상세(buildLiveDetail)에서도 재사용해서
   전역으로 바꾸면 안 되고, 리더보드 스코프로만 좁힌다. */
#lbListCol .card{border-color:var(--border-bright);}
.card-head{padding:12px 16px;border-bottom:1px solid var(--border-bright);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-secondary);font-weight:700}
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;gap:10px;color:var(--text-muted);font-size:12px}
.spinner{display:inline-block;width:90px;height:auto;color:var(--red);vertical-align:middle;overflow:visible;}
.spinner .spinner-icon{width:100%;height:auto;display:block;overflow:visible;}
.spinner .spinner-icon path{stroke-dasharray:1;stroke-width:1.2px;vector-effect:non-scaling-stroke;animation:cannonDraw 3s ease-in-out infinite;}
@keyframes cannonDraw{0%{stroke-dashoffset:1;}55%{stroke-dashoffset:0;}70%{stroke-dashoffset:0;}100%{stroke-dashoffset:1;}}
.error-state{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:14px 16px;font-size:12px;color:#F87171;display:flex;align-items:center;gap:8px}
.dday-card{align-items:center;gap:7px;padding:6px 16px;margin-top:-16px;margin-bottom:12px;width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);background:var(--dday-bg);border-bottom:1px solid rgba(239,1,7,.25);color:var(--text);position:sticky;top:var(--header-h,49px);z-index:90;line-height:1.3;}
.dday-num{font-family:var(--fb);font-size:12px;font-weight:800;letter-spacing:.2px;color:var(--red);flex-shrink:0;}
.dday-match{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dday-time{font-size:12px;color:var(--text-secondary);margin-left:auto;flex-shrink:0;white-space:nowrap;}
/* .section이 max-width:600px로 중앙정렬되니, 좌우 -16px만으론 화면이
   600px보다 넓은 기기(태블릿 등)에서 섹션 가장자리까지만 닿고 실제
   화면 끝까지는 못 닿는다 — 뷰포트 폭 기준 계산(100vw 풀블리드 공식)으로
   기기 폭과 무관하게 항상 화면 양끝까지 닿게 한다. */
.inj-strip{display:flex;align-items:center;gap:7px;padding:6px 16px;margin-top:-16px;margin-bottom:12px;width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);background:var(--dday-bg);border-bottom:1px solid rgba(239,1,7,.25);color:var(--text);position:sticky;top:var(--header-h,49px);z-index:90;line-height:1.3;font-size:12px;font-weight:700;}
.inj-strip svg{flex-shrink:0;}
.inj-strip{cursor:pointer;-webkit-tap-highlight-color:transparent;}
.inj-strip-chevron{margin-left:auto;color:var(--text-dim);}
.fix-section-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;margin-top:6px;padding-left:2px}
.fix-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
/* 예전엔 이 안에 있는 헤더/리스트가 카드 하나로 통째로 둘러싸여 있어서,
   개별 경기 카드(.fix-card, 각자 테두리+둥근모서리 있음)까지 겹쳐서
   "카드 안에 카드"로 보였다 — 바깥 카드 배경/테두리/둥근모서리를 없애고
   D-day 카드처럼 페이지 위에 바로 놓이게 한다. */
.fix-section-card{margin-bottom:16px;}
.fix-section-card .fix-section-label{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--text);padding:0 2px 8px;margin:0;}
.fix-section-card .fix-list{padding:0;margin-bottom:0;}
.fix-layout{display:block;}
.fix-detail-panel{display:none;}
.hist-layout{display:block;}
.hist-detail-panel{display:none;}
#histFactsCard{display:none;}
.fix-detail-panel .mm-handle{display:none;}
.fix-detail-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:60px 20px;color:var(--text-secondary);font-size:12px;text-align:center;}
.fix-detail-empty svg{opacity:.4;}
.sq-layout{display:block;}
.sq-detail-panel{display:none;}
.sq-detail-panel .modal-handle{display:none;}
.lb-layout{display:block;}
.lb-round-panel{display:block;margin-top:16px;background:var(--surface);border:1px solid var(--border-bright);border-radius:16px;overflow:hidden;}
.lb-round-nav{display:flex;align-items:center;justify-content:space-between;padding:8px 8px;background:var(--surface2);border-bottom:1px solid var(--border-bright);}
.lb-round-nav .cal-nav-btn{padding:2px;}
.lb-round-label{font-size:12px;font-weight:700;color:var(--text);}
.lb-round-date{padding:8px 12px 4px;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--text);text-transform:uppercase;}
.lb-round-row{display:grid;grid-template-columns:22px 1fr 18px 40px 18px 1fr;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border-bright);font-size:12px;cursor:pointer;transition:background .15s;}
.lb-round-row:hover{background:var(--surface2);}
.lb-round-row.no-open{cursor:default;}
.lb-round-row.no-open:hover{background:none;}
.lb-round-row:last-child{border-bottom:none;}
.lb-round-status{color:var(--text-muted);font-size:10px;}
.lb-round-status.live{color:var(--green);font-weight:700;}
.lb-round-team{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lb-round-team.home{text-align:right;}
.lb-round-crest{width:18px;height:18px;object-fit:contain;justify-self:center;}
.lb-round-score{color:var(--text);font-weight:700;text-align:center;font-family:var(--fm);}
.totw-pitch-wrap{position:relative;width:100%;aspect-ratio:220/300;overflow:hidden;}
.totw-pitch-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
.totw-player{position:absolute;transform:translate(-50%,50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:1;}
.totw-photo-wrap{position:relative;width:38px;height:38px;}
.totw-photo{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--surface3);border:2px solid var(--overlay-35);display:block;}
.totw-team-crest{position:absolute;bottom:-2px;right:-2px;width:15px;height:15px;border-radius:50%;background:var(--navy);padding:1px;object-fit:contain;}
.totw-rating{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:var(--green);color:var(--white);font-size:9px;font-weight:800;padding:1px 5px;border-radius:8px;white-space:nowrap;}
.totw-name{font-size:9px;font-weight:700;color:var(--white);text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis;}
.totw-player.top .totw-photo{border-color:var(--gold);}
.totw-player.top .totw-rating{background:var(--gold);color:#1a1400;}
/* 카드 여백. 좌우는 --fix-px 하나로 관리한다 — 라이브 인라인 펼침(.fix-live-expand)이 이 값만큼
   음수 마진으로 카드 끝까지 넓히고 그 자식들이 같은 값으로 다시 안쪽 여백을 주기 때문에,
   숫자를 따로 적어두면 한쪽만 고쳤을 때 탭 바가 카드 밖으로 삐져나온다. */
.fix-card{--fix-px:14px;background:var(--surface);border:1px solid var(--border-bright);border-radius:12px;padding:9px var(--fix-px);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;}
.fix-card.live-match{border-color:var(--green);}
/* 예정 경기(home/away/neutral-fixture)는 홈/원정/중립을 색으로 구분하지
   않고(카드 하단 텍스트 라벨이 담당 — 종료 경기 승/무/패 테두리 색과 겹쳐서
   "종료됐나 예정이나" 구분이 안 되는 문제가 있었음) 기본 테두리보다 살짝
   밝은 무채색만 줘서, 색은 없어도 카드 경계는 또렷하게 보이게 한다. */
.fix-card.upcoming{border-color:var(--overlay-18);}
.fix-card.result-win{border-color:var(--green);}
.fix-card.result-draw{border-color:var(--gold);}
.fix-card.result-loss{border-color:var(--red);}
.fix-grid{display:grid;grid-template-columns:1fr 58px 1fr;grid-template-rows:auto auto auto;gap:2px 4px;align-items:center;padding:2px 0}
.fix-z3label{grid-column:2;grid-row:3;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.fix-z1{grid-column:1;grid-row:1;display:flex;align-items:center;}
.fix-z2{grid-column:1;grid-row:2;display:flex;align-items:center;}
.fix-z3top{grid-column:2;grid-row:1;display:flex;align-items:center;justify-content:center;}
.fix-z3bot{grid-column:2;grid-row:2;display:flex;align-items:stretch;justify-content:center;}
.fix-z4{grid-column:3;grid-row:1;display:flex;align-items:center;justify-content:flex-end;}
.fix-z5{grid-column:3;grid-row:2;display:flex;align-items:center;justify-content:flex-end;}
.fix-live-clock{text-align:center;font-size:10px;font-weight:700;letter-spacing:1px;}
/* 라이브 카드의 주심/시계/경기장 한 줄 — 가운데 시계는 항상 정중앙에
   고정되도록 grid(1fr auto 1fr)로 좌우 텍스트 길이와 무관하게 정렬한다. */
.fix-live-meta-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:4px var(--fix-px) 0;}
.fix-meta-side{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--text-secondary);min-width:0;}
.fix-live-commentary{padding:6px var(--fix-px) 2px;font-size:10px;color:var(--text-secondary);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.fix-meta-side svg{flex-shrink:0;}
.fix-meta-side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fix-meta-referee{justify-content:flex-start;}
.fix-meta-venue{justify-content:flex-end;text-align:right;}
/* .fix-card의 좌우 14px 패딩만큼 미리 음수 마진으로 넓혀둔다 — 안의
   자식들(meta-row/progress-bar/commentary 미리보기 등)은 이미 각자
   14px 좌우 패딩을 갖고 있어서 시각적으로는 그대로고, 패딩이 없는
   buildLiveDetail의 탭 바만 카드 끝까지 자연스럽게 닿는다. overflow는
   양쪽 다 hidden으로 둬도(세로 접기 애니메이션용) 이 넓어진 폭 자체가
   .fix-card의 padding:hidden 클리핑 경계(=카드 테두리 안쪽)와 정확히
   맞아떨어져서 가로로 잘릴 일이 없다 — overflow-x만 visible/auto로
   풀었을 때는 스크롤바가 생길 위험이 있어 이 방식으로 바꿈. */
.fix-live-expand{overflow:hidden;max-height:0;transition:max-height 0.35s ease;margin:0 calc(-1 * var(--fix-px));}

.live-progress-bar-bg{flex:1;height:3px;background:var(--overlay-10);border-radius:2px;overflow:hidden;}

.fix-expand-btn{width:100%;background:none;border:none;border-top:1px solid rgba(255,255,255,0.06);color:var(--text-secondary);font-size:10px;padding:6px;cursor:pointer;letter-spacing:1px;margin-top:6px;}

.tag-ec{background:rgba(74,222,128,.15);color:#4ADE80;border:1px solid rgba(74,222,128,.25)}
.tag-cs{background:rgba(203,213,225,.15);color:#CBD5E1;border:1px solid rgba(203,213,225,.25)}
.tag-oth{background:rgba(100,100,100,.15);color:var(--text-muted);border:1px solid var(--border)}
/* AI 해설이 최신 정보 반영 전일 때 본문 위에 붙는 알림 줄. 앰버는 이 앱에서 "출전 의심"

.pred-stale{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:var(--amber);
  background:color-mix(in srgb,var(--amber) 10%,transparent);border-radius:8px;padding:7px 10px;margin:0 0 10px}

:root[data-theme="light"] .pred-seg{background:var(--pc-l)}
.pred-tile{background:rgba(255,255,255,.05);border:1px solid transparent;border-radius:10px}
.pred-tile.top{background:rgba(200,168,75,.14);border-color:var(--gold)}
.pred-ic{background:rgba(255,255,255,.08)}
:root[data-theme="light"] .pred-tile{background:rgba(0,0,0,.035)}
:root[data-theme="light"] .pred-tile.top{background:rgba(200,168,75,.16)}

:root[data-theme="light"] .tag-pl{background:rgba(250,204,21,.4);color:#92400E;border-color:rgba(250,204,21,.6)}
:root[data-theme="light"] .tag-fa{background:rgba(248,113,113,.35);color:#B91C1C;border-color:rgba(248,113,113,.55)}
:root[data-theme="light"] .tag-ec{background:rgba(74,222,128,.4);color:#15803D;border-color:rgba(74,222,128,.6)}
:root[data-theme="light"] .tag-cs{background:rgba(100,116,139,.3);color:#334155;border-color:rgba(100,116,139,.5)}
:root[data-theme="light"] .tag-cl{background:rgba(0,80,200,.3);border-color:rgba(96,165,250,.4)}
.fix-date{font-size:10px;color:var(--text-secondary);font-family:var(--fm);flex-shrink:0}

.t-crest-ph{width:30px;height:30px;border-radius:50%;background:none;border:none;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:9px;color:var(--text-muted);flex-shrink:0;filter:drop-shadow(0 0 1px var(--overlay-35))}

/* 팀명은 축약형/풀네임 두 벌을 다 넣어두고 CSS로 전환한다 — JS로 폭을 보고 고르면
   창 크기를 바꿨을 때 순위표를 다시 그려야 해서. PC 전환은 아래 900px 블록. */
.std-team-full{display:none}

.lb-tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border-bright);border-bottom:1px solid var(--border-bright);}
.lb-tab{position:relative;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:5px;padding:10px 4px;border:none;background:var(--surface2);color:var(--text-muted);cursor:pointer;font-family:var(--fb);font-size:12px;font-weight:700;-webkit-tap-highlight-color:transparent;}
/* 라벨과 폰트·크기·굵기를 전부 공유하고 색만 다르게 둔다. 테두리 있는 알약으로
   만들면 박스가 글자보다 커서 정렬이 기기·배율마다 1px씩 틀어진다(실제로 겪음).
   absolute로 빼는 건 레이아웃 시프트 방지용이다 — 플로우 안에 두면 라운드 값이
   로딩된 순간 flex가 다시 중앙정렬하면서 "팀 순위"가 왼쪽으로 밀린다.
   세로 위치는 .lb-tab의 align-items:center가 잡아주므로 top을 지정하지 않는다. */
.lb-tab-badge{position:absolute;right:16px;color:inherit;}
.lb-tab.active .lb-tab-badge{color:var(--gold);}
.lb-tab-badge:empty{display:none;}
.lb-tab svg{width:14px;height:14px;stroke:var(--text-muted);transition:stroke .15s;flex-shrink:0;}
.lb-tab.active{background:var(--red-dark);color:var(--white);}
.lb-tab.active svg{stroke:var(--gold);}
.ldr-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--border-bright);font-size:12px}
.ldr-row:last-child{border-bottom:none}
.ldr-row.afc-row{background:rgba(239,1,7,.05)}
.ldr-rank{font-family:var(--fm);font-size:11px;color:var(--text-muted);width:16px;flex-shrink:0;text-align:center}
.ldr-photo{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--surface2);flex-shrink:0}
.ldr-photo-ph{width:26px;height:26px;border-radius:50%;background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--text-muted);}
.ldr-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.ldr-name{font-weight:600;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ldr-team{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-muted)}
.ldr-team img{width:12px;height:12px;object-fit:contain}
.ldr-val{font-family:var(--fm);font-weight:700;font-size:14px;color:var(--text);flex-shrink:0;padding:0 6px;box-sizing:border-box;}
.ldr-val.top{border-radius:999px;display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;color:var(--white);background:var(--red-dark);}
.f-btns{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border-bright);border-radius:12px;overflow:hidden;margin-bottom:16px}
.f-btn{background:var(--surface2);border:none;color:var(--text-muted);font-family:var(--fb);font-size:12px;font-weight:700;padding:10px 4px;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.f-btn.active{background:var(--red-dark);color:var(--white)}
.sq-tabs-group{border-radius:12px;overflow:hidden;margin-bottom:14px;background:var(--border-bright);display:flex;flex-direction:column;gap:1px;border:1px solid var(--border-bright);}
.sq-tabs-group .f-btns{border-radius:0;margin-bottom:0;background:transparent}
.sq-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
/* PC 선수단 우측 패널 기본 콘텐츠 — 감독/부상자 현황, 완전히 독립된 두 개의
   카드로 쌓는다(히스토리 우측 칸의 .hist-detail-panel+#histFactsCard와 동일한
   원칙) — .sq-detail-panel 자신은 테두리 없는 플렉스 래퍼일 뿐이고, 각
   카드가 자기 테두리/배경을 갖는다. 선수 상세를 열었을 때만
   #sqDetailContent 자체가 하나의 카드가 된다(.showing-detail 참고). */
#sqDetailContent{display:flex;flex-direction:column;gap:16px;}
.sq-detail-panel.showing-detail #sqDetailContent{display:block;background:var(--surface);border:1px solid var(--border-bright);border-radius:16px;overflow:hidden;}
.sq-panel-card{background:var(--surface);border:1px solid var(--border-bright);border-radius:16px;overflow:hidden;}
.sq-inj-title{display:flex;align-items:center;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--border-bright);font-size:12px;font-weight:700;color:var(--text);}
.sq-inj-list{padding:0 12px;}
.sq-inj-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-bright);font-size:12px;}
.sq-inj-row:last-child{border-bottom:none;}
.sq-inj-photo{width:32px;height:32px;border-radius:50%;overflow:hidden;background:var(--surface2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--text-secondary);}
.sq-inj-photo img{width:100%;height:100%;object-fit:cover;object-position:top;}
.sq-inj-info{flex:1;min-width:0;}
.sq-inj-name{font-size:12px;font-weight:700;color:var(--text);}
.sq-inj-detail{font-size:11px;color:var(--text-secondary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sq-inj-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.sq-inj-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;}

.sq-inj-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:40px 20px;color:var(--green);font-size:12px;text-align:center;}
.sq-inj-empty span{color:var(--text-secondary);}
/* 모바일 부상자 현황 상세모달 — 시트 폭 끝까지 쓰고(PC 카드의 12px 여백 대신
   모달 공통 16px), 좁은 폭에서 부상 내용이 한 줄 말줄임으로 잘리지 않게 줄바꿈한다. */
.sq-inj-modal .sq-inj-list{padding:0 16px;}
.sq-inj-modal .sq-inj-detail{white-space:normal;}
.pl-card{background:var(--surface);border:1px solid var(--border-bright);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s;position:relative;-webkit-tap-highlight-color:transparent;}
.pl-contract-badge{position:absolute;top:6px;right:6px;z-index:2;background:rgba(239,68,68,.92);color:var(--white);font-size:8px;font-weight:800;letter-spacing:.3px;padding:2px 6px;border-radius:10px;display:flex;align-items:center;gap:2px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pl-loan-badge{background:rgba(59,130,246,.92);}   /* 임대 — 부상(빨강)·계약만료(빨강)와 구분되는 파랑 */
.pl-card:active{transform:scale(.98)}
.pl-top{display:grid;grid-template-columns:70px 1fr;height:90px}
.pl-left{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.pl-left.fw{background:rgba(239,1,7,.75)}
.pl-left.mf{background:rgba(34,197,94,.60)}
.pl-left.df{background:rgba(59,130,246,.60)}
.pl-left.gk{background:rgba(234,179,8,.65)}
:root[data-theme="light"] .pl-left.fw{background:rgba(239,1,7,.9)}
:root[data-theme="light"] .pl-left.mf{background:rgba(34,197,94,.85)}
:root[data-theme="light"] .pl-left.df{background:rgba(59,130,246,.85)}
:root[data-theme="light"] .pl-left.gk{background:rgba(234,179,8,.85)}
.pl-pos-txt{font-size:10px;font-weight:800;letter-spacing:1.5px;color:rgba(255,255,255,.95);text-transform:uppercase}
.pl-num-txt{font-family:var(--fd);font-size:32px;font-weight:900;line-height:1;color:var(--white);opacity:.95}
.pl-photo-box{width:100%;height:90px;overflow:hidden;background:var(--surface3)}
.pl-photo-box img{width:100%;height:100%;object-fit:contain;object-position:bottom center;display:block}
.pl-photo-box.no-img{display:flex;align-items:flex-end;justify-content:center}
.pl-photo-box.no-img img{width:100%;height:100%;object-fit:contain;object-position:bottom;display:block}
.pl-card-divider{height:1px;background:var(--border-bright)}
.pl-card-name{padding:7px 8px;font-size:11px;font-weight:700;letter-spacing:.5px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.news-list{display:flex;flex-direction:column;gap:10px}
.media-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border-bright);border:1px solid var(--border-bright);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.media-seg-btn{background:var(--surface2);border:none;color:var(--text-muted);font-family:var(--fb);font-size:12px;font-weight:700;padding:10px 4px;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;}
.media-seg-btn.active{background:var(--red-dark);color:var(--white);}
.media-seg-btn.active .media-seg-icon{color:var(--gold);}
.media-col{min-width:0;}
.media-col-title{display:none;font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;}
/* 미디어 피드에 새 글이 들어오고 꼬리가 빠질 때 쓰는 칸. 높이를 px로 박지 않고
   grid 행을 0fr→1fr로 늘려서, 사진이 늦게 로드되거나 웹폰트가 바뀜 카드가 커져도
   칸이 그대로 따라간다(px로 재면 다 펼쳐진 뒤 한 번 튀다). 카드 배경은 처음부터 보이고
   내용물만 늦게 뜨게 한다 — 카드까지 투명하면 열리는 자리가 그냥 빈 구멍으로 보인다. */
.feed-slot{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease, margin-bottom .28s ease;}
.feed-slot > div{overflow:hidden;min-height:0;}
.feed-slot.open{grid-template-rows:1fr;}
.feed-slot > div > * > *{opacity:0;transition:opacity .2s ease;}
.feed-slot.filled > div > * > *{opacity:1;}
@media (prefers-reduced-motion: reduce){ .feed-slot{transition:none;} .feed-slot > div > * > *{transition:none;} }
/* 목록 맨 아래 "더보기" — 목록(.news-list 등) 안이 아니라 바로 다음 형제로 붙인다.
   목록 안에 넣으면 el.children을 카드 수로 세는 applyMediaUpdate가 버튼을 카드로 친다.
   새로 붙는 카드에는 애니메이션을 주지 않는다 — 버튼이 화면 맨 아래에 있어서 실제로
   보이는 건 한두 장뿐이고, 나머지는 화면 밖에서 끝난다(사용자 확인). */
.feed-more{margin-top:12px}
.feed-more:empty{display:none}
.feed-more button{width:100%;background:var(--surface2);border:1px solid var(--border-bright);color:var(--text);
  border-radius:10px;padding:13px 10px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:background .15s}
.feed-more button:active{background:var(--surface3)}
.feed-more button:disabled{color:var(--text-dim);cursor:default}
.video-card{display:block;background:var(--surface);border:1px solid var(--border-bright);border-radius:12px;overflow:hidden;margin-bottom:12px;text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent;}
/* 탭을 넘길 때 새 패널이 밀린 방향 반대쪽에서 짧게 들어온다.
   나가는 패널은 건드리지 않는다 — 둘을 동시에 움직이려면 패널마다 독립 스크롤이 필요하고,
   지금은 세 칸이 페이지 스크롤을 공유해서 위치가 튀다. */
@keyframes tabInFromRight{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes tabInFromLeft{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.tab-in-next{animation:tabInFromRight .18s ease-out}
.tab-in-prev{animation:tabInFromLeft .18s ease-out}
@media (prefers-reduced-motion: reduce){.tab-in-next,.tab-in-prev{animation:none}}
.video-embed-wrap{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--surface2),var(--surface3));}
.video-embed-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
.video-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;pointer-events:none;}
.video-only-badge{position:absolute;top:8px;right:8px;background:var(--red);color:var(--white);font-size:10px;font-weight:700;letter-spacing:.3px;padding:3px 9px;border-radius:20px;pointer-events:none;}
.video-body{padding:12px 14px;}
.video-title{font-weight:700;font-size:13px;line-height:1.4;margin-bottom:6px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.video-time{font-size:11px;color:var(--text-secondary);display:inline-flex;align-items:center;gap:4px;}
/* ── Timeline Section ───────────────────── */
.tl-wrap{position:relative;}
.tl-wrap::before{content:'';position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--red) 0%,#ff6b35 30%,var(--gold) 60%,#4CAF50 100%);opacity:.45;}
.tl-item{display:grid;grid-template-columns:1fr 18px 1fr;margin-bottom:28px;position:relative;align-items:start;}
.tl-left{padding-right:14px;display:flex;flex-direction:column;align-items:flex-end;gap:7px;}
.tl-year{font-size:18px;font-weight:900;line-height:1;font-family:var(--fd);letter-spacing:.5px;}
.tl-photo{width:85%;aspect-ratio:4/3;border-radius:8px;background:var(--surface2);border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;color:rgba(255,255,255,.2);}
.tl-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.tl-dot-col{display:flex;justify-content:center;padding-top:4px;position:relative;z-index:2;}
.tl-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--navy);flex-shrink:0;}
.tl-right{padding-left:14px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.tl-right:active{opacity:.75;}
.tl-right-spacer{height:18px;margin-bottom:7px;}
.tl-title{font-size:13px;font-weight:800;color:var(--text);line-height:1.35;margin-bottom:6px;}
.tl-summary{font-size:11px;color:var(--text-secondary);line-height:1.65;}
.tl-more{display:inline-block;margin-top:6px;font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--red);}
/* ── History Tab ─────────────────────────── */
.hist-otd-wrap{margin-top:-16px;margin-bottom:12px;width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);position:sticky;top:var(--header-h,49px);z-index:90;}
.hist-otd-card{display:flex;align-items:center;gap:7px;padding:6px 16px;background:var(--otd-bg);border-bottom:1px solid rgba(212,175,55,.25);cursor:pointer;-webkit-tap-highlight-color:transparent;line-height:1.3;}
.hist-otd-card:active{opacity:.88;}
.hist-otd-date{font-size:12px;font-weight:800;letter-spacing:.2px;color:var(--gold);flex-shrink:0;white-space:nowrap;}
.hist-otd-title{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.hist-otd-chevron{color:var(--text-dim);flex-shrink:0;}

.hist-filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.hist-filter::-webkit-scrollbar{display:none;}
.hist-filter-btn{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:6px 13px;border:1px solid var(--border);border-radius:20px;background:none;font-size:11px;font-weight:600;color:var(--text-dim);cursor:pointer;transition:all .18s;white-space:nowrap;}
.hist-filter-btn.active{background:var(--red);color:var(--white);border-color:var(--red);}
.hist-filter-btn .hf-icon{font-size:13px;}
/* 선수단 필터(.f-btns)와 동일한 방식 — 세그먼트끼리 1px 틈으로만 구분되고
   바깥 양 끝만 둥글게, 활성 탭만 넓어지고 나머지는 아이콘만 남도록 압축 */
.hist-nav{display:flex;gap:1px;background:var(--border-bright);border:1px solid var(--border-bright);border-radius:12px;overflow:hidden;margin-bottom:14px;}
/* 비활성 탭은 폭을 40px로 고정해서 절대 움직이지 않게 하고, 활성 탭 하나만
   flex-grow로 남는 공간을 전부 차지하게 한다 — 이러면 활성 탭이 바뀔 때
   "이전 활성" ↔ "다음 활성" 두 칸만 폭이 바뀌고 나머지는 완전히 고정이라
   다른 아이콘이 쏠리거나 흔들리는 문제가 구조적으로 생기지 않는다.
   gap은 비활성 상태(라벨이 안 보임)일 땐 0으로 둔다 — flex gap은 자식의
   실제 폭이 0이어도 예약되기 때문에, 라벨이 안 보이는데 gap만 남아있으면
   아이콘이 진짜 중앙에서 gap의 절반만큼 밀려 보인다(쏠림의 실제 원인).
   높이 36.8px = 다른 상단 탭(.f-btn/.lb-tab/.media-seg-btn: 위아래 10px + 12px 글자 줄높이 16.8px)과 같은 값 —
   헤더에 붙는 스티키 탭들의 높이를 통일한다. */
.hist-nav-btn{box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:0;flex:0 0 34px;height:36.8px;padding:0;border:none;background:var(--surface2);color:var(--text-dim);cursor:pointer;transition:flex-grow .25s ease,flex-basis .25s ease,gap .2s ease,padding .25s ease,background .2s,color .2s;-webkit-tap-highlight-color:transparent;overflow:hidden;}
.hist-nav-btn svg{width:17px;height:17px;flex-shrink:0;transition:color .2s;}
/* 라벨은 등장할 때(비활성→활성)만 지연시킨다 — 박스가 넓어지는 도중에
   라벨까지 같이 나타나면 겹쳐 보이기 때문. 반대로 사라질 때(활성→비활성)는
   지연 없이 박스와 동시에 줄어들어야 한다 — 지연이 걸리면 박스는 이미
   줄어드는데 라벨 글자는 아직 그대로 남아있다가 뒤늦게 눌려 사라지면서
   프레임이 끊기는 것처럼 보인다. transition은 "전환 후" 상태의 값을 쓰므로
   기본(.hist-nav-label) 쪽은 지연 없이, .active 쪽에만 지연을 준다.
   등장할 때는 max-width를 아예 애니메이션시키지 않고 즉시 최종값으로
   둔다 — max-width가 서서히 늘어나는 도중엔 text-overflow:ellipsis가
   "...으로 잘림 → 전체 텍스트"로 갈아타는 임계점을 지나가는데, 이 전환이
   딱 잘라 발생(중간값이 없음)해서 아직 opacity가 다 안 올라온 상태(반쯤
   투명한 상태)에서 글자 수가 순간적으로 확 늘어나는 것처럼 보인다 —
   이게 "글자 들어올 때 1프레임 깜빡이는" 원인이었다. max-width를 즉시
   최종값으로 고정해두면 이 전환 자체가 opacity:0(안 보이는 상태)일 때
   이미 끝나 있으므로, 그 다음 opacity만 서서히 올라와도 잘림→전체 전환이
   보이지 않는다. */
.hist-nav-label{font-size:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0;opacity:0;transition:max-width .12s ease,opacity .08s ease;}
.hist-nav-btn.active{flex:1 1 0;gap:5px;background:var(--red-dark);color:var(--white);padding:0 10px;}
.hist-nav-btn.active .hist-nav-label{max-width:120px;opacity:1;transition:opacity .14s ease .18s;}
.hist-nav-btn.active svg{color:var(--gold);}
.hist-section{animation:fadeIn .2s ease;}
/* Stadium */
.stad-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:24px;}
.stad-card{border-radius:14px;overflow:hidden;background:var(--surface2);border:1px solid var(--border-bright);cursor:pointer;transition:transform .18s,box-shadow .18s;-webkit-tap-highlight-color:transparent;}
.stad-card:active{transform:scale(.97);}
.stad-photo{width:100%;aspect-ratio:16/9;background:var(--surface3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--border-bright);}
.stad-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.stad-info{padding:10px 12px 12px;}
.stad-name{font-size:13px;font-weight:900;color:var(--text);margin-bottom:2px;}
.stad-sub{font-size:10px;color:var(--text-secondary);margin-bottom:6px;}
.stad-years{display:inline-block;font-size:10px;font-weight:700;color:var(--red);background:rgba(239,1,7,.08);border:1px solid rgba(239,1,7,.2);border-radius:4px;padding:2px 7px;}
.stad-cap{font-size:10px;color:var(--text-muted);margin-top:5px;}
/* Records — 스크롤 대신 6개가 폭에 맞춰 비율대로 나눠 갖는 방식 */
.rec-subnav{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--border);}
/* 선수 상세모달 대회 탭만 줄바꿈 — 한 줄 4칸 고정 */
.pm-comp-subnav{flex-wrap:wrap;}
.pm-comp-subnav .rec-subnav-btn{flex:0 0 25%;max-width:25%;}
.rec-subnav-btn{flex:1 1 0;min-width:0;padding:8px 4px;font-size:10px;font-weight:700;letter-spacing:.2px;color:var(--text-dim);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .18s;}
.rec-subnav-btn.active{color:var(--red);border-bottom-color:var(--red);}
#lbStatSubnav{display:grid;grid-template-columns:repeat(5,1fr);}
.rec-group{margin-bottom:20px;}
.rec-row{display:flex;align-items:baseline;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border-bright);gap:10px;}
.rec-row:last-child{border-bottom:none;}
.rec-label{font-size:12px;color:var(--text-secondary);flex:1;line-height:1.4;}
.rec-value{font-size:12px;font-weight:800;color:var(--text);white-space:nowrap;font-family:var(--fd);}
.rec-note{font-size:10px;color:var(--text-secondary);margin-top:2px;}
.rec-highlight{background:rgba(212,175,55,.07);border-radius:8px;padding:10px 12px;margin-bottom:12px;border:1px solid rgba(212,175,55,.15);}
.rec-highlight .rec-label{color:var(--gold);font-weight:700;}
.rec-highlight .rec-value{color:var(--gold);}
/* "제목 → 이름" 구조인 그룹(선수 출전기록, 주요 득점기록)만 이름을 크게
   키운다. 제목은 위에 단독 한 줄, 그 아래 줄에 "이름 ── 경기수/골수"를
   나란히 배치 — 값이 제목 줄이 아니라 이름과 같은 줄 우측에 붙는다.
   대부분의 다른 그룹은 label이 이미 스코어라인/피험처/선수명 등 "그 자체가
   본문"이라 이 처리를 하면 오히려 안 읽힌다. 그룹별로 명확히 선택된 곳에만 적용. */
.rec-row-note-name{display:block;}
.rec-row-note-name .rec-label{font-size:10px;letter-spacing:.5px;color:var(--text-secondary);line-height:1.3;}
.rec-note-line{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:3px;}
.rec-row-note-name .rec-note{font-size:14px;font-weight:800;color:var(--text);margin-top:0;}
.rec-row-note-name .rec-value{font-size:14px;}
.rec-row-note-name.rec-highlight .rec-note{color:var(--gold);}
.rec-row-note-name.rec-highlight .rec-label{color:var(--text-secondary);font-weight:400;}
/* name-meta: 이름 줄 아래 세 번째 줄에 상대/날짜/교체·선발 여부를
   " | "로 구분해서 나열 (최연소/최고령 출전 같은 그룹) */
.rec-meta-line{font-size:11px;color:var(--text-secondary);margin-top:3px;line-height:1.5;}
.rec-meta-sep{color:var(--overlay-30);}
.rec-note-line-extra{margin-top:8px;}
/* 공동 기록: 이름 옆에 날짜·대회를 같은 줄에 작게 이어 붙인다 */
.rec-inline-meta{font-size:11px;font-weight:400;color:var(--text-secondary);margin-left:6px;}
/* label-name: note가 따로 없고 label 자체가 이름/순위인 그룹(Top 10 등) —
   선수 이름 스타일(14px bold white)과 동일하게 맞춘다 */
.rec-row-label-name .rec-label{font-size:14px;font-weight:800;color:var(--text);}
.rec-row-label-name .rec-value{font-size:14px;}
.rec-name-sub{font-size:11px;font-weight:400;color:var(--text-secondary);}
/* Moments */
.mom-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:24px;}
.mom-card{position:relative;border-radius:14px;overflow:hidden;background:var(--surface2);border:1px solid var(--border-bright);cursor:default;-webkit-tap-highlight-color:transparent;}
.mom-photo{width:100%;aspect-ratio:4/3;background:var(--surface3);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--border-bright);}
.mom-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.mom-rank-badge{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.7);color:var(--on-dark-header-gold);font-size:10px;font-weight:900;min-width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:0 5px;border:1px solid rgba(200,168,75,.4);font-family:var(--fd);letter-spacing:.5px;}
.mom-info{padding:8px 10px 10px;}
.mom-title{font-size:11px;font-weight:700;color:var(--text);line-height:1.35;margin-bottom:3px;}
.mom-year{font-size:10px;color:var(--text-secondary);}
/* Legends */
.lgd-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-bottom:24px;}
.lgd-card{background:var(--surface2);border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid var(--border-bright);transition:transform .15s,box-shadow .15s;position:relative;-webkit-tap-highlight-color:transparent;}
.lgd-card:active{transform:scale(.97);}
.lgd-card-img-wrap{position:relative;width:100%;aspect-ratio:2/3;overflow:hidden;}
.lgd-card-gradient{position:absolute;bottom:0;left:0;right:0;height:65%;background:linear-gradient(to top,rgba(0,0,0,.9) 0%,transparent 100%);}
.lgd-card-rank{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.65);color:var(--on-dark-header-gold);font-size:9px;font-weight:800;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(212,175,55,.4);}
.lgd-card-overlay{position:absolute;bottom:0;left:0;right:0;padding:8px 8px 9px;}
.lgd-card-name{font-size:11px;font-weight:800;color:var(--white);line-height:1.2;}
/* 이름·부제는 사진 위 검은 그라데이션(.lgd-card-gradient)에 얹히므로 테마와
   무관한 고정 밝은색(--white / --on-dark-header-*)을 쓴다. */
.lgd-card-sub{font-size:9px;color:var(--on-dark-header-secondary);margin-top:2px;letter-spacing:.2px;}
.lgd-section{margin-top:22px;}
.lgd-section-body{font-size:13px;color:var(--text-secondary);line-height:1.8;margin:0;}
/* 상세모달 공용 소제목 — 본문(13px)보다 작고 흐릿하면 안 되니 확실히
   더 굵고 크게, 색도 밝은 레드로 (레전드 모달 소제목 스타일이 원조) */
.detail-section-label{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--red);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(239,1,7,.2);}
.lgd-section-body strong{color:var(--gold);font-weight:800;}
/* Managers */
.mgr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-bottom:24px;}
.mgr-card{background:var(--surface2);border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid var(--border-bright);transition:transform .15s,box-shadow .15s;position:relative;-webkit-tap-highlight-color:transparent;}
.mgr-card:active{transform:scale(.97);}
.mgr-card.highlight{border-color:rgba(239,1,7,.35);box-shadow:0 0 0 1px rgba(239,1,7,.15);}
.mgr-card-img-wrap{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;}
.mgr-card-img{width:100%;height:100%;object-fit:cover;object-position:top;}
.mgr-card-img-ph{width:100%;height:100%;background:var(--photo-ph-grad);display:flex;align-items:center;justify-content:center;font-size:52px;}
.mgr-card-gradient{position:absolute;bottom:0;left:0;right:0;height:60%;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,transparent 100%);}
.mgr-card-overlay{position:absolute;bottom:0;left:0;right:0;padding:10px 10px 10px;}
.mgr-card-period-badge{display:inline-block;font-size:9px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.3px;margin-bottom:4px;}
.mgr-card-name{font-size:13px;font-weight:800;color:var(--white);line-height:1.2;}
.mgr-card-flag{font-size:10px;margin-left:2px;}
.mgr-card-trophy-dot{position:absolute;top:8px;right:8px;background:var(--red);color:var(--white);font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;}
/* Trophy Cabinet */
.trophy-cab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:24px;}
.trophy-cab-card{background:var(--surface2);border-radius:14px;padding:14px 10px;text-align:center;cursor:pointer;border:1px solid var(--border);transition:transform .15s;}
.trophy-cab-card:active{transform:scale(.97);}
.trophy-cab-icon{font-size:30px;margin-bottom:6px;}
.trophy-cab-name{font-size:11px;font-weight:700;color:var(--text);line-height:1.3;margin-bottom:4px;}
.trophy-cab-count{font-size:22px;font-weight:900;color:var(--red);font-family:var(--fd);}
/* Mgr Modal */
.mgr-modal-photo{width:100%;aspect-ratio:16/9;background:var(--photo-ph-grad);display:flex;align-items:center;justify-content:center;font-size:72px;position:relative;flex-shrink:0;}
.mgr-modal-photo img{width:100%;height:100%;object-fit:cover;object-position:top;}
.mgr-modal-photo-overlay{position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(to top,rgba(10,10,16,.95),transparent);}
.mgr-modal-name{font-size:20px;font-weight:900;color:var(--on-dark-header);}
.mgr-modal-period{font-size:12px;color:var(--on-dark-header-secondary);margin-top:2px;}
.mgr-modal-bio{padding:14px 16px;font-size:13px;color:var(--text-secondary);line-height:1.7;}
.mgr-modal-trophies{padding:0 16px 20px;}
.mgr-trophy-row{font-size:12px;color:var(--text-secondary);padding:6px 0;border-bottom:1px solid var(--border-bright);}

.hist-section-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;}
.history-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hist-card{background:var(--surface);border:1px solid var(--border-bright);border-radius:12px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .18s;}
.hist-card:active{opacity:.82;}
.hist-card-img-wrap{position:relative;height:100px;background:var(--surface2);overflow:hidden;}
.hist-card-img{width:100%;height:100%;object-fit:cover;display:block;}
.hist-card-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;}
.hist-card-cat-icon{position:absolute;bottom:5px;right:6px;font-size:14px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));}
.hist-card-body{padding:8px 9px 10px;}
.hist-card-title{font-size:11px;font-weight:700;color:var(--text);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hist-card-year{font-size:10px;color:var(--text-dim);margin-top:3px;}

/* History Detail Modal */
.hist-modal-img{width:100%;height:200px;object-fit:cover;display:block;border-radius:0;}
.hist-modal-img-ph{width:100%;height:160px;display:flex;align-items:center;justify-content:center;font-size:56px;background:linear-gradient(135deg,rgba(239,1,7,.12),rgba(212,175,55,.08));}
.hist-modal-meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.hist-modal-cat{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:rgba(239,1,7,.15);color:var(--red);border:1px solid rgba(239,1,7,.25);}
.hist-modal-date{font-size:11px;color:var(--text-dim);}
.hist-modal-title{font-size:16px;font-weight:800;color:var(--text);line-height:1.35;margin-bottom:10px;}
.hist-modal-body{font-size:13px;color:var(--text-muted);line-height:1.75;}
.hist-modal-link{display:block;margin-top:14px;font-size:12px;color:var(--gold);font-weight:600;}

/* ── Trophy Cabinet ─────────────────────── */
.trophy-cabinet{margin-bottom:16px;}
.trophy-cabinet-header{display:flex;align-items:baseline;gap:8px;margin-bottom:10px;}
.trophy-cabinet-title{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
.trophy-cabinet-total{font-size:10px;color:var(--text-secondary);}

/* 2열 그리드 */
.trophy-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.trophy-card{background:var(--surface2);border:1px solid var(--border-bright);border-radius:14px;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .18s;}
.trophy-card:active{opacity:.82;}

/* 이미지 영역 */
/* 트로피 이미지는 전부 세로형이라 contain이 항상 높이에서 걸린다 — 좌우 여백은
   어차피 남으므로 세로 패딩만 줄여야 이미지가 커진다(좌우는 그대로 18px 유지). */
.trophy-card-img-wrap{width:100%;aspect-ratio:4/3;background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:8px 18px;box-sizing:border-box;}
.trophy-card-img{width:100%;height:100%;object-fit:contain;display:block;}
.trophy-card-img-ph{font-size:36px;}
.trophy-card-record{position:absolute;top:5px;right:5px;font-size:8px;font-weight:700;padding:2px 6px;border-radius:4px;background:rgba(200,168,75,.18);border:1px solid rgba(200,168,75,.4);color:var(--gold);white-space:nowrap;}

/* 하단 정보 — 사진 영역과 구분되도록 위쪽 보더 추가 */
.trophy-card-info{padding:7px 8px 9px;text-align:center;border-top:1px solid var(--border-bright);}
.trophy-card-name{font-size:11px;font-weight:700;color:var(--text-secondary);line-height:1.3;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.trophy-card-count-wrap{display:flex;align-items:baseline;justify-content:center;gap:3px;}
.trophy-card-count{font-size:22px;font-weight:900;line-height:1;font-family:var(--fd);color:var(--text);}
.trophy-card-count.gold{color:var(--gold);}
.trophy-card-count.silver{color:#aaa;}
.trophy-card-count.bronze{color:#cd7f32;}
.trophy-card-wins{font-size:8px;color:var(--text-secondary);font-weight:600;}

/* Trophy 모달 */
.trophy-modal-top{display:flex;gap:12px;padding:16px 16px 12px;align-items:center;}
.trophy-modal-img-wrap{width:80px;height:80px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.trophy-modal-img{width:100%;height:100%;object-fit:cover;}
.trophy-modal-img-ph{font-size:36px;}
.trophy-modal-count-block{flex:1;}
.trophy-modal-count{font-size:48px;font-weight:900;line-height:1;font-family:var(--fd);color:var(--gold);}
.trophy-modal-count.silver{color:#aaa;}
.trophy-modal-count.bronze{color:#cd7f32;}
.trophy-modal-wins-label{font-size:10px;color:var(--text-dim);font-weight:600;letter-spacing:1px;text-transform:uppercase;}
.trophy-modal-title{font-size:16px;font-weight:800;color:var(--text);padding:0 16px 6px;}
.trophy-modal-summary{font-size:12px;color:var(--text-secondary);line-height:1.65;padding:0 16px 10px;}
.trophy-modal-body{font-size:13px;color:var(--text-secondary);line-height:1.75;padding:0 16px 12px;}
/* 상세모달 공용 골드 콜아웃 — 트로피 모달의 핵심 기록, 타임라인 모달의
   인물 태그 등 강조 박스를 하나의 스타일로 통일 */
.detail-callout{display:flex;align-items:flex-start;gap:8px;margin:0 16px 16px;padding:10px 12px;background:rgba(212,175,55,.1);border:1px solid rgba(212,175,55,.25);border-radius:10px;font-size:11px;color:var(--gold);font-weight:600;line-height:1.5;}
.detail-callout-icon{flex-shrink:0;font-size:13px;}
.trophy-years-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 24px;}
.trophy-year-chip{padding:5px 12px;border-radius:6px;background:rgba(239,1,7,.08);border:1px solid rgba(239,1,7,.2);font-size:12px;font-weight:700;color:var(--text);font-family:var(--fd);}
.trophy-year-chip.latest{background:var(--red);border-color:var(--red);color:var(--white);}

.news-card{background:var(--surface);border:1px solid var(--border-bright);border-radius:12px;overflow:hidden;text-decoration:none;display:block;color:inherit;-webkit-tap-highlight-color:transparent}
.news-card:active{opacity:.85}
/* 높이를 고정(160px)하면 폴더블을 펼친 가로모드처럼 카드 폭만 크게
   늘어나는 화면에서 사진이 극단적으로 납작한 띠가 되어 위아래가 잘린다 —
   폭 기준 비율로 잡아 폭이 늘면 높이도 같이 늘게 한다. 2:1은 일반 폰
   폭(카드 ~330px)에서 기존 160px과 거의 같은 높이가 나오는 값. */
.news-img{aspect-ratio:2/1;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--surface2),var(--surface3))}
.news-img img{width:100%;height:100%;object-fit:cover;display:block}
.news-img-ph{height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;color:rgba(239,1,7,.15)}
.news-src-badge{position:absolute;top:10px;left:10px;font-size:8px;letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--red);color:var(--white);font-weight:700}
.news-body{padding:12px 14px}
.news-hl{font-weight:700;font-size:13px;line-height:1.4;margin-bottom:6px;color:var(--text)}
/* 요약은 말줄임하지 않고 필요한 줄 수만큼 다 보여준다 — .news-list가 세로
   flex(그리드가 아님)라 카드마다 높이가 달라져도 옆 카드와 어긋나지 않는다.
   RSS 소스는 백엔드에서 150자로 자르지만 ESPN/Guardian 요약은 그대로 내려와
   더 길 수 있다(실측 최대 영문 251자). 다만 한글 번역문은 영문의 6할 정도
   길이라 실제로는 3~5줄 선에서 끝난다. */
.news-ex{font-size:12px;color:var(--text-secondary);line-height:1.5;margin-bottom:8px}
.news-foot{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--text-secondary)}
.live-setup{background:var(--surface);border:1px solid var(--border-accent);border-radius:12px;padding:16px;margin-bottom:16px}
.live-setup-title{font-weight:700;font-size:13px;margin-bottom:4px}
.live-setup-sub{font-size:11px;color:var(--text-muted);margin-bottom:14px}
.auto-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2);padding:4px 10px;border-radius:20px;margin-bottom:12px}
.key-row{display:flex;gap:8px}
.key-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-family:var(--fm);font-size:12px;outline:none}
.key-input:focus{border-color:var(--red)}
.key-input::placeholder{color:var(--text-dim)}
.key-btn{background:var(--red);border:none;border-radius:8px;padding:10px 16px;color:var(--white);font-family:var(--fb);font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap}
.fix-view-toggle{display:flex;gap:1px;background:var(--overlay-10);border:1px solid var(--border-bright);border-radius:8px;overflow:hidden;flex-shrink:0;}
.fix-view-btn{padding:5px 9px;border:none;background:var(--surface2);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;-webkit-tap-highlight-color:transparent;}
.fix-view-btn svg{width:14px;height:14px;}
.fix-view-btn.active{background:var(--red-dark);color:var(--white);}
.today-btn{display:flex;align-items:center;gap:5px;padding:6px 12px 6px 10px;background:var(--red-dark);color:var(--white);border:1px solid var(--border);border-radius:8px;font-family:var(--fb);font-size:11px;font-weight:700;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.today-btn svg{width:12px;height:12px;color:var(--gold);flex-shrink:0;}
.today-btn:disabled{background:var(--surface2);color:var(--text-muted);cursor:default;}
.today-btn:disabled svg{color:var(--text-muted);}
.cal-nav-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:4px;display:flex;align-items:center;-webkit-tap-highlight-color:transparent;}
.cal-nav-btn svg{width:16px;height:16px;}
.cal-nav-btn:disabled{color:var(--text-dim);cursor:default;opacity:.4;}
.results-nav{display:flex;align-items:center;justify-content:space-between;padding:4px 0 8px;}
.results-label{background:none;border:none;font-size:13px;font-weight:700;color:var(--text);cursor:pointer;padding:0 8px;height:24px;display:inline-flex;align-items:center;font-family:var(--fb);-webkit-tap-highlight-color:transparent;}
.results-picker-sheet{background:var(--modal-bg);border-radius:16px;width:100%;max-width:340px;overflow:hidden;}
.results-picker-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border);}
.results-picker-head span{font-size:15px;font-weight:700;color:var(--text);font-family:var(--fb);}
.results-picker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px;}
.results-picker-cell{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-weight:700;font-family:var(--fb);padding:10px 0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.results-picker-cell:disabled{color:var(--text-dim);opacity:.35;cursor:default;}
.results-picker-cell.current{background:var(--red-dark);color:var(--white);border-color:var(--red-dark);}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px;}
.cal-dow-row span{text-align:center;font-size:10px;font-weight:700;color:var(--text);padding:4px 0;display:block;}
.cal-dow-row span:first-child{color:#F87171;font-weight:900;}
.cal-dow-row span:last-child{color:var(--blue);font-weight:900;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;container-type:inline-size;}
.cal-day{aspect-ratio:1/1.75;border-radius:8px;border:2px solid var(--overlay-10);box-sizing:border-box;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;overflow:hidden;cursor:default;font-size:clamp(11px,2.4cqw,16px);color:var(--text-muted);-webkit-tap-highlight-color:transparent;padding:4px 2px 5px;}
/* 경기 없는 날도 옅은 테두리를 둔다(사용자 지정) — 칸 배경(--surface2)과 페이지 배경(--navy)의
   밝기 차이가 작아서 테두리가 없으면 칸 경계가 안 보였다(다크 모드 달력 뷰). 경기 있는 날은
   아래에서 더 진한 선(--overlay-18)으로 덮어써서 강약은 그대로 유지된다. */
/* 예정 경기는 홈/원정/중립 상관없이 무채색 — cal-day-win/draw/loss(종료 경기)
   색과 겹쳐서 "종료됐나 예정이나" 구분이 안 되는 걸 막는다(카드 뷰와 동일 이유). */
.cal-day.has-fixture{border-color:var(--overlay-18);cursor:pointer;}
.cal-day.away-fixture{border-color:var(--overlay-18);}
.cal-day.neutral-fixture{border-color:var(--overlay-18);}
.cal-day.cal-day-win{border-color:var(--green);background:rgba(34,197,94,.14);}
.cal-day.cal-day-draw{border-color:var(--amber);background:rgba(245,158,11,.14);}
.cal-day.cal-day-loss{border-color:var(--loss);background:rgba(239,68,68,.14);}
.cal-day.cal-day-win .cal-day-time{color:var(--green);}
.cal-day.cal-day-draw .cal-day-time{color:var(--amber);}
.cal-day.cal-day-loss .cal-day-time{color:var(--loss);}
.cal-day.today{background:rgba(200,168,75,.15);color:var(--gold);font-weight:700;}
.cal-day.selected{outline:2px solid var(--red);outline-offset:-2px;}
.cal-day-num{font-size:clamp(10px,2.2cqw,15px);color:var(--overlay-60);text-align:center;width:100%;flex-shrink:0;}
.cal-day-sun .cal-day-num{color:#F87171;font-weight:700;}
.cal-day-sat .cal-day-num{color:var(--blue);font-weight:700;}
/* 공휴일 — 날짜는 일요일과 같은 빨강 볼드, 경기가 없는 날은 엠블렄 자리에 휴일 이름을 넣는다.
   이름은 날짜보다 한 통 연하게 — 한 칸에 진한 빨강이 두 덩어리면 달력이 시끄럽다(사용자 지정).
   한국어 공휴일 이름은 띄어쓰기가 없어서 break-all이 아니면 줄바꿈 없이 잘린다(부처님오신날). */
.cal-day-holiday .cal-day-num{color:#F87171;font-weight:700;}
.cal-day-holiday-name{font-size:clamp(8px,1.9cqw,12px);line-height:1.25;font-weight:500;text-align:center;
  color:rgba(248,113,113,.75);word-break:keep-all;overflow-wrap:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cal-day.has-fixture .cal-day-num{font-weight:700;}
.cal-day-crest-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;}
.cal-day-crest-wrap .t-crest,.cal-day-crest-wrap .t-crest-ph{width:78%;height:auto;aspect-ratio:1;padding:0;box-sizing:border-box;font-size:.7em;border:none;background:none;filter:drop-shadow(0 0 1px var(--overlay-35));}
.cal-day-crest-wrap .t-crest-ph.afc{background:none;}
.cal-day-time{font-size:clamp(9px,2.2cqw,15px);color:var(--overlay-60);flex-shrink:0;}
.cal-day.has-fixture .cal-day-time{font-weight:700;}

/* PLAYER MODAL - Fotmob style */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);}
.modal-overlay.open{display:flex;}
.modal-sheet{position:relative;background:var(--modal-bg);border-radius:20px 20px 0 0;width:100%;max-width:540px;height:96vh;height:96dvh;overflow:hidden;animation:slideUp .35s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;}.modal-sheet-inner{overflow-y:auto;flex:1;padding-bottom:32px;scrollbar-width:none;-ms-overflow-style:none;}.modal-sheet-inner::-webkit-scrollbar{display:none;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes dialogPop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.modal-handle{width:36px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:10px auto 0;}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.6);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:20;}
/* 헤더 */
.pm-header{background:var(--modal-header-grad);padding:20px 16px 18px;position:sticky;top:0;z-index:10;touch-action:none;}
.pm-header-inner{display:flex;gap:14px;align-items:center;}
/* 팀 정보 모달 헤더 — 바탕은 라이트 모드에서도 다크 테마 값(#1a1c22)으로 고정하고, 그 위에 팀 색을
   인라인 style의 background-image로 얹는다. 다른 모달 헤더(--modal-header-grad)는 아스날 레드라
   상대 팀에 안 맞고, 테마를 타는 --modal-bg를 쓰면 라이트 모드에서 흰 배경에 흰 글자가 된다
   (헤더 글자색은 흰색 고정). */
.pm-header.team-header{background-color:#1a1c22;}
/* 팀 정보 모달 탭 — 다른 상세모달 탭(.live-tabs)처럼 헤더 바로 아래에 꽉 차게 붙인다(여백·둥근 모서리
   없음). 칸 사이 1px 틈과 위아래 공통 라인(--border-bright)이 아웃라인 역할을 한다. 활성 탭 배경색만
   팀 색이라 인라인으로 붙는다(teamTabStyle). */
.team-tabs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border-bright);border-top:1px solid var(--border-bright);border-bottom:1px solid var(--border-bright);}
.pm-photo{width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.3);flex-shrink:0;}
.pm-photo-ph{width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:22px;color:var(--white);flex-shrink:0;}
.pm-name{font-family:var(--fd);font-size:22px;color:var(--white);letter-spacing:1px;line-height:1.1;}
.pm-club{font-size:12px;color:var(--on-dark-header-secondary);margin-top:3px;display:flex;align-items:center;gap:5px;}
.pm-header-text{min-width:0;flex:1;padding-right:66px;}
.pm-header-text .pm-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pm-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.15);border-radius:20px;padding:2px 8px;font-size:10px;color:rgba(255,255,255,.85);margin-top:5px;}
.pm-season-chip{background:#C8A84B;color:#3a2e0f;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.pm-season-chip-arrow{font-style:normal;font-size:8px;}
.pm-season-wrap{position:relative;display:inline-block;}
.pm-season-menu{position:absolute;top:calc(100% + 4px);left:0;background:#1a1c22;border:1px solid rgba(255,255,255,.15);border-radius:10px;overflow:hidden;min-width:96px;z-index:30;display:none;box-shadow:0 4px 14px rgba(0,0,0,.45);}
.pm-season-menu.open{display:block;}
.pm-season-menu-item{padding:8px 12px;font-size:11px;font-weight:600;color:#fff;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.pm-season-menu-item:active{background:rgba(255,255,255,.1);}
.pm-season-menu-item.active{color:#C8A84B;}
/* 상세모달 공용 기본정보 그리드 — 헤더 바로 아래 표처럼 붙여서 보여주는
   방식(선수 상세모달 원조). 헤더와 분리된 별도 박스가 아니라 헤더에 바로
   이어지는 느낌을 위해 모서리/여백/음영 없이 헤어라인만으로 구분한다 —
   예정경기 상세모달의 .mm-card 표와 동일한 .06 알파 톤. 기존 pm-info-*
   이름을 모든 상세모달에서 쓰도록 일반화 */
.detail-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--border-bright);border-bottom:1px solid var(--border-bright);}
.detail-info-cell{padding:12px 16px;border-right:1px solid var(--border-bright);border-bottom:1px solid var(--border-bright);min-width:0;}
.detail-info-cell:nth-child(2n){border-right:none;}
/* 3열로 쓰는 경우(팀 정보 모달 요약) — 위 규칙은 2열 기준이라 가운데 칸의 세로줄이 지워진다.
   3의 배수 칸만 오른쪽 선을 빼고, 마지막 줄은 아래 선을 뺀다. */
.detail-info-grid.cols3 .detail-info-cell{border-right:1px solid var(--border-bright);}
.detail-info-grid.cols3 .detail-info-cell:nth-child(3n){border-right:none;}
.detail-info-grid.cols3 .detail-info-cell:nth-last-child(-n+3){border-bottom:none;}
.detail-info-val{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px;overflow-wrap:anywhere;}
.detail-info-lbl{font-size:10px;color:var(--text-secondary);}
/* 선수 특성 (레이더) */
.pm-traits{padding:16px 16px 8px;}
.shot-line{opacity:0;transition:opacity .15s;pointer-events:none;}
.shot-line.active{opacity:0.85;}
.shot-highlight{opacity:0;transition:opacity .15s;pointer-events:none;}
.shot-highlight.active{opacity:1;}
.pm-section-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px;}
.pm-section-sub{font-size:11px;color:var(--text-secondary);margin-bottom:14px;}
.pm-radar-wrap{display:flex;justify-content:center;position:relative;}
/* 대회 탭 — "기록" 탭 하위에 중첩되는 하위탭이라 리더보드 선수순위
   하위탭(.rec-subnav/.rec-subnav-btn)과 동일한 밑줄 스타일을 그대로
   재사용한다(전용 .pm-comp-tab 아이콘형 스타일은 폐기). 대회별 기록도
   더 이상 별도 카드(.pm-comp-card)로 안 감싼다 — 이미 "기록" 탭
   패널(.live-tab-panel) 자체가 하나의 구획인데, 그 안에 배경/테두리
   있는 카드를 또 두면 섹션 안에 섹션이 있는 것처럼 이중으로 보였다. */
/* 선을 안 긋고 위쪽 여백(16px)+제목 텍스트만으로 구분한다 — 기본정보
   탭의 .pm-traits(선수 특성)도 앞 표 바로 아래 선 없이 여백만으로
   구분되는 것과 같은 방식. 슈팅맵→터치 히트맵처럼 섹션이 연달아 나올
   때 선이 남아있으면 위쪽 표의 닫는 선(border-bottom)과 겹쳐 보였다. */
.pm-comp-subsection{padding:16px 14px 14px;}
.pm-comp-subtitle{font-size:12px;font-weight:700;color:var(--text);margin-bottom:10px;}
/* 스탯 섹션 */
.stat-section{padding:12px 16px;border-bottom:1px solid var(--border);}
.stat-section-title{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--overlay-35);margin-bottom:10px;font-weight:700;}
.stat-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.stat-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.stat-box{background:var(--overlay-10);border-radius:10px;padding:10px 6px;text-align:center;}
.stat-box-val{font-family:var(--fd);font-size:20px;line-height:1;color:var(--text);}
.stat-box-lbl{font-size:8px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-secondary);margin-top:3px;}
.stat-box-sub{font-size:9px;color:var(--overlay-30);margin-top:1px;}
/* 퍼센타일 바 */
.pct-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.pct-label{font-size:11px;color:var(--text-secondary);width:44px;flex-shrink:0;}
.pct-val{font-size:12px;font-weight:700;min-width:22px;flex-shrink:0;}
.pct-bar-wrap{flex:1;height:5px;background:var(--overlay-10);border-radius:3px;overflow:hidden;}
.pct-bar{height:100%;border-radius:3px;}
/* 경력 */
/* 카드 박스로 감싸지 않고(다른 탭의 .detail-info-grid/선수 스탯 표와
   동일하게) 좌우가 패널 끝까지 닿는 표 형태 — 팀/기간을 한 줄로 붙이고
   소제목 라벨(팀 / 기간 · 기록)을 얹었다. */
.pm-career-hdr{display:grid;grid-template-columns:1fr auto;padding:8px 14px 4px;}
.pm-career-hdr span{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);}
.pm-career-row{display:grid;grid-template-columns:1fr auto;align-items:center;padding:9px 14px;border-top:1px solid var(--border-bright);}
.pm-career-row:last-child{border-bottom:1px solid var(--border-bright);}
.pm-career-team{font-size:13px;color:var(--text);font-weight:600;}
.pm-career-period{font-size:10px;color:var(--text-secondary);margin-left:8px;}
.pm-career-loan{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:4px;background:rgba(59,130,246,.18);color:#60A5FA;font-size:9px;font-weight:700;vertical-align:1px;}
.pm-career-return{background:rgba(255,255,255,.08);color:var(--text-secondary);}
.pm-career-stat{font-size:11px;font-weight:700;color:var(--text);text-align:right;}
.pm-career-stat.empty{color:var(--overlay-30);font-weight:400;}
/* 시즌 성적 프로그레스바 (Fotmob "Season performance" 재현) */
/* 경기일정 리스트/달력 전환 토글(.fix-view-toggle/.fix-view-btn)과 동일한
   세그먼트 필 스타일 — 텍스트 라벨만 다를 뿐 컨테이너/활성색은 그대로. */
.perf-mode-toggle{display:flex;gap:1px;background:var(--overlay-10);border:1px solid var(--border-bright);border-radius:8px;overflow:hidden;flex-shrink:0;}
.perf-mode-btn{width:48px;padding:5px 0;border:none;background:var(--surface2);color:var(--text-muted);cursor:pointer;font-size:10px;text-align:center;-webkit-tap-highlight-color:transparent;}
.perf-mode-btn.active{background:var(--red-dark);color:var(--white);}
.perf-stat-row{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--border-bright);}
.perf-stat-label{flex:1;font-size:12px;color:var(--text-secondary);}
.perf-stat-val{font-size:12px;font-weight:700;color:var(--text);min-width:52px;text-align:right;}
.perf-stat-bar{width:70px;height:5px;border-radius:3px;background:var(--overlay-10);overflow:hidden;flex-shrink:0;}
.perf-stat-bar-fill{height:100%;border-radius:3px;}
/* Fotmob 대회별 스탯 그리드 — 예정경기 상세모달의 .mm-card 표(최근
   상대전적/최근 5경기: 카드 없이 var(--text)/--text-secondary 텍스트,
   .06 알파의 옅은 헤어라인)와 톤을 맞춘다. 선은 셀 하나하나에 직접
   그린다(grid gap+background 방식은 셀이 불투명하지 않으면 그리드
   배경이 셀 영역까지 비쳐 보이는 부작용이 있어서 안 씀). */
.fotmob-stat-grid{display:grid;grid-template-columns:repeat(4,1fr);margin:0;border-top:1px solid var(--border-bright);}
.overall-stat-grid{grid-template-columns:repeat(5,1fr);}
.shot-stat-grid{grid-template-columns:repeat(4,1fr);}
.fm-stat-cell{padding:12px 8px;text-align:center;border-right:1px solid var(--border-bright);border-bottom:1px solid var(--border-bright);}
.fotmob-stat-grid:not(.overall-stat-grid) .fm-stat-cell:nth-child(4n){border-right:none;}
.overall-stat-grid .fm-stat-cell:nth-child(5n){border-right:none;}
.fm-stat-val{font-family:var(--fd);font-size:20px;font-weight:700;color:var(--text);line-height:1;}
.fm-stat-lbl{font-size:9px;color:var(--text-secondary);margin-top:4px;letter-spacing:.5px;}
.overall-stat-grid .fm-stat-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;min-height:50px;}
.overall-stat-grid .fm-stat-val{font-size:12px;line-height:1.3;}
.overall-stat-grid .fm-stat-lbl{margin-top:3px;}
/* Radar */
.radar-wrap{padding:16px 20px;display:flex;justify-content:center;}
.pl-modal-header{display:flex;gap:16px;padding:20px 20px 16px;border-bottom:1px solid var(--border-bright);position:relative;}
.pl-modal-photo{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--border-bright);flex-shrink:0;}
.pl-modal-photo-ph{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:24px;flex-shrink:0;}
.pl-modal-name{font-family:var(--fd);font-size:26px;letter-spacing:2px;line-height:1.1;}
.pl-modal-sub{font-size:11px;color:var(--text-muted);margin-top:4px;}
.pl-modal-badge{display:inline-block;font-size:9px;padding:2px 8px;border-radius:20px;font-weight:700;margin-top:6px;}
/* ── 경기 상세 모달 ── */
.match-modal-x{position:absolute;top:12px;right:14px;z-index:10;background:rgba(0,0,0,.45);border:none;color:var(--white);font-size:16px;width:30px;height:30px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.match-modal-x:active{opacity:.7;}
.match-modal-sheet{position:relative;}
.match-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:500;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);}
.match-modal-overlay.open{display:flex;}
.match-modal-sheet{background:var(--modal-bg);border-radius:20px 20px 0 0;width:100%;max-width:540px;height:96vh;height:96dvh;overflow:hidden;animation:slideUp .35s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;}
/* 히스토리 계열 모달(매니저/레전드/온디스데이/타임라인)은 경기·선수 상세와
   달리 로딩 스피너 없이 한 번에 그려지므로 높이가 바뀌며 "튀는" 문제가 없다
   — 짧은 항목이 많아 고정 96vh를 쓰면 아래쪽이 텅 비어 보이므로 콘텐츠
   길이에 맞춰 줄어들 수 있게 한다. 타임라인은 선수 상세모달(.modal-sheet)을
   같이 쓰므로 두 시트 모두에 적용한다 */
.match-modal-sheet.hist-compact,.modal-sheet.hist-compact{height:auto;min-height:45vh;min-height:45dvh;max-height:96vh;max-height:96dvh;}
.match-modal-inner{overflow-y:auto;flex:1;padding-bottom:32px;scrollbar-width:none;-ms-overflow-style:none;}.match-modal-inner::-webkit-scrollbar{display:none;}
.mm-header{background:var(--modal-header-grad);padding:18px 16px 14px;position:relative;}
.mm-handle{width:36px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:0 auto 14px;}
.mm-header{display:flex;flex-direction:column;align-items:center;padding:16px 16px 14px;border-bottom:1px solid var(--border-bright);flex-shrink:0;}
/* 경기 상세모달 최상단 스코어보드 헤더에만 스와이프 트리거를 걸기 위해
   매니저/히스토리 등 다른 콘텐츠가 재사용하는 .mm-header와 구분되는
   클래스로 고정(sticky) 처리한다 */
.mm-header-top{position:sticky;top:0;z-index:10;touch-action:none;}
.mm-header-title{font-size:15px;font-weight:700;color:var(--on-dark-header);}
/* 히스토리 상세모달(매니저/레전드/OTD/트로피/타임라인/스타디움/모먼트) 공용 —
   사진 영역은 스와이프-닫기 트리거(핸들 바 포함), 그 아래 이름/제목 헤더는
   사진이 스크롤되어 올라가다 상단에 닿는 순간 고정(sticky)된다. */
.hist-modal-photo{position:relative;touch-action:none;}
/* 사진(img)이 기본적으로 드래그 가능한 요소라, PC 마우스로 스와이프-닫기를
   시도하면 브라우저 네이티브 이미지 드래그(고스트 이미지)가 먼저 발동해서
   pointermove 시퀀스를 가로채 버린다 — 그래서 마우스 드래그로는 안 닫히고
   터치/자동화 테스트에서는 재현이 안 됐다. 네이티브 이미지 드래그 자체를 꺼서
   pointermove가 온전히 스와이프-닫기 로직으로 넘어가게 한다. */
.hist-modal-photo img{-webkit-user-drag:none;user-drag:none;-webkit-user-select:none;user-select:none;}
.hist-modal-handle{width:36px;height:4px;background:rgba(255,255,255,.55);border-radius:2px;position:absolute;top:10px;left:50%;transform:translateX(-50%);box-shadow:0 1px 4px rgba(0,0,0,.5);z-index:2;}
.hist-modal-header{position:sticky;top:0;z-index:10;}
.mm-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.6);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:20;}
/* 히스토리 상세(트로피/감독/레전드 등)는 이 모달을 사진이 X 버튼 바로
   아래 깔리는 형태로 재사용한다 — 그때만 어두운 배경으로 바꿔서 사진
   밝기와 무관하게 항상 보이게 한다(경기 상세 등 사진 없는 경우는 그대로). */
.match-modal-sheet:has(.hist-modal-photo) .mm-close{background:var(--overlay-black-55);color:var(--white);}
/* 히스토리 중 타임라인/스타디움/모먼트는 감독/트로피/레전드와 달리
   #matchModal이 아니라 #playerModal(.modal-sheet/.modal-close)을 재사용한다
   — 이쪽도 똑같이 사진 위에 X가 얹히니 동일하게 어둡게 바꿔야 한다. */
.modal-sheet:has(.hist-modal-photo) .modal-close{background:var(--overlay-black-55);color:var(--white);}
/* Match modal 3-col header */
.mm-scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:10px 14px 8px;width:100%;box-sizing:border-box;}
.mm-team{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0;}
.mm-team.away{align-items:center;}
.mm-crest{width:44px;height:44px;object-fit:contain;}
.mm-team-name{font-size:11px;font-weight:800;text-align:center;color:var(--on-dark-header);line-height:1.25;max-width:90px;}
.mm-center-col{display:flex;flex-direction:column;align-items:center;gap:5px;padding:0 6px;}
.mm-score{font-family:var(--fd);font-size:30px;font-weight:900;color:var(--on-dark-header);letter-spacing:2px;line-height:1;}
/* 헤더 배경이 테마와 무관하게 짙은 빨강이라 고정 밝은 토큰을 쓴다 */
.mm-pen{font-size:11px;font-weight:700;letter-spacing:1px;line-height:1;margin-top:5px;color:var(--on-dark-header-secondary);}
.mm-center-meta{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%;}
.mm-meta-row{font-size:9px;color:var(--on-dark-header-secondary);text-align:center;white-space:nowrap;letter-spacing:.3px;}
.mm-meta-date{font-size:10px;font-weight:700;color:var(--on-dark-header-secondary);}
.mm-meta-comp{display:inline-block;font-size:8px;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.07);color:var(--on-dark-header-secondary);border:1px solid rgba(255,255,255,.15);margin-top:1px;}
.mm-section{padding:14px 6px 14px;}
.mm-section-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;font-weight:700;}
.mm-card{margin:14px 16px;background:rgba(255,255,255,.03);border:1px solid var(--border-bright);border-radius:16px;overflow:hidden;}
.mm-card-title{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--text);padding:14px 14px 0;}
/* 예상 선발 카드(renderPredictedXICard) — 가로 피치 한 장에 양 팀을 하프라인
   기준으로 마주 세운다. 피치 SVG는 viewBox 비율대로 폭에 맞춰 늘어난다. */
.xi-sub{font-weight:400;letter-spacing:0;color:var(--text-secondary);margin-left:6px;}
.xi-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 14px 9px;font-size:11px;}
.xi-t{display:flex;align-items:center;gap:6px;font-weight:700;min-width:0;}
.xi-t.xi-r{justify-content:flex-end;}
/* 아스날 쪽은 줄이지 않는다 — flex는 양쪽을 같이 줄여서, 320px 화면에서 상대가
   "Borussia Monchengladbach"처럼 길면 짧은 "Arsenal"까지 "Arse…"로 잘렸다(실측:
   42px 필요한데 28px만 배정). 말줄임은 긴 쪽이 다 받아내는 게 맞다. */
.xi-t.xi-keep{flex-shrink:0;}
/* 헤더의 팀 표시 점 — 유니폼 색을 그대로 쓴다. 흰색으로 오는 팀(리즈·릴)이 라이트 모드
   배경에서 사라지므로 1px 띠를 두른다. 엠블럼(.t-crest)이 쓰는 drop-shadow는 여기선
   안 먹혔다 — 엠블럼은 안쪽에 모양이 있어 은은한 후광으로 충분하지만, 9px짜리 단색 원은
   경계선이 있어야 읽힌다(실측 비교). --overlay-60은 다크에선 흰색, 라이트에선 검정이라
   어두운 유니폼이든 흰 유니폼이든 어느 테마에서도 윤곽이 남는다. */
.xi-hdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;
  box-shadow:0 0 0 1px var(--overlay-60),0 1px 2px rgba(0,0,0,.25);}
.xi-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.xi-f{font-size:10px;color:var(--text-secondary);font-weight:400;flex-shrink:0;}
/* position:relative — 안쪽 확대 버튼(.xi-zoom)의 기준점. 없으면 버튼이 모달 전체를
   기준으로 잡혀 상세모달 우측 하단에 붙는다. */
.xi-pitch{padding:0 10px 12px;position:relative;}
.xi-svg{width:100%;height:auto;display:block;border-radius:8px;}
/* 카드 전체에 붙는 주석 — 경기 예측 카드의 "포아송 모형 · 참고용" 주석과 같은 규격
   (오른쪽 정렬 + 점선으로 본문과 분리). 두 카드가 나란히 붙어 있어서 어긋나면 눈에 띈다. */
.xi-note{margin:2px 14px 12px;padding-top:8px;border-top:1px dashed var(--border-bright);
  text-align:right;font-size:10px;line-height:1.6;color:var(--text-secondary);opacity:.8;}
/* 피치 확대 — 우측 하단 버튼 → 오버레이. 모바일 폭에서는 90도 돌려 세로 화면을 꽉 채우고,
   PC에서는 회전 없이 가운데로 키운다. 피치가 가로로 길어서(340×214) 세로 화면에서 그냥
   키우면 1.16배밖에 안 커지는데, 돌리면 1.8배가 된다(실측). */
.xi-zoom{position:absolute;right:16px;bottom:18px;width:26px;height:26px;border-radius:7px;
  border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.42);color:var(--white);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  -webkit-tap-highlight-color:transparent;}
.xi-zoom:active{background:rgba(0,0,0,.62);}
/* 딤 배경과 피치를 따로 움직인다 — 한 덩어리로 scale하면 배경까지 같이 커졌다 작아진다. */
.xiz-overlay{position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.92);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .26s ease;}
.xiz-overlay.open{display:flex;}
.xiz-overlay.shown{opacity:1;}
/* 열고 닫을 때 카드 안 피치의 실제 위치·크기에서 자라고 줄어든다(FLIP). 회전 모드에서는
   그 과정에 90도 회전이 같이 들어가 "돌면서 커지는" 모양이 된다. */
.xiz-stage{display:flex;align-items:center;justify-content:center;}
/* will-change는 애니메이션 중에만 건다 — 상시로 두면 합성 레이어가 남아서 확대된 피치가
   낮은 해상도로 래스터된 채 그려지는 경우가 있다. */
.xiz-stage.anim{transition:transform .34s cubic-bezier(.32,.72,0,1);will-change:transform;}
.xiz-rot{transform:translate(-50%,-50%) rotate(90deg);transform-origin:center center;}
/* 팀 이름 줄은 HTML이라 피치(SVG)처럼 저절로 커지지 않는다 — 확대 비율에 맞춰 키우되
   상한을 둔다. 안 그러면 카드에선 팀 이름(11px)이 선수 라벨(6.2px)보다 컸는데 확대하면
   선수 라벨(20.5px)에 역전당한다(실측, 1024px 창). --xizf는 openPitchZoom이 계산해 넣는다. */
.xiz-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:0 4px 7px;color:var(--white);font-size:var(--xizf,11px);}
.xiz-head .xi-hdot{width:calc(var(--xizf,11px) * 0.82);height:calc(var(--xizf,11px) * 0.82);}
.xiz-head .xi-f{color:rgba(255,255,255,.7);font-size:calc(var(--xizf,11px) * 0.91);}
/* 닫기 버튼은 회전 래퍼 "안"에 둔다 — 딤 영역에 있으면 피치를 보다가 손이 안 가고,
   안에 있으면 회전을 같이 먹어서 사용자가 보는 기준으로 항상 우측 상단이다. */
.xiz-close{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);color:var(--white);z-index:3;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  -webkit-tap-highlight-color:transparent;}
.xiz-close:active{background:rgba(0,0,0,.7);}
/* 회전할지와 폭은 _xizMode()가 화면 비율을 보고 정한 뒤 인라인으로 심는다 — 미디어쿼리로
   가르면 가로로 돌린 폰에서도 회전해버린다. 회전을 안 할 때는 이 클래스를 안 붙인다. */
/* 승부차기 카드(renderShootoutCard) — 한 줄 = 한 라운드. 바깥쪽에 키커 이름,
   안쪽에 성공/실패 아이콘(원 테두리 안 골대 + 체크/X), 가운데 라운드 번호.
   가운데 결과 원 두 열이 세로로 나란히 서서 스코어보드 역할도 겸한다.
   긴 이름(Maxence Caqueret 등)은 모바일 한쪽 칸이 120px 남짓이라 말줄임하면
   누군지 못 알아보므로 두 줄로 줄바꿈시킨다. */
.so-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 14px 12px;border-bottom:1px solid var(--border-bright);}
.so-team{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text);min-width:0;line-height:1.25;}
.so-team.away{flex-direction:row-reverse;text-align:right;}
.so-team img{width:22px;height:22px;object-fit:contain;flex-shrink:0;}
.so-first{font-size:9px;font-weight:700;color:var(--gold);border:1px solid var(--border-accent);border-radius:4px;padding:1px 4px;flex-shrink:0;white-space:nowrap;}
.so-sum{text-align:center;}
.so-total{font-family:var(--fd);font-size:24px;letter-spacing:2px;color:var(--text);line-height:1;}
.so-winner{font-size:10px;color:var(--text-secondary);margin-top:3px;white-space:nowrap;}
.so-row{display:grid;grid-template-columns:1fr 28px 16px 28px 1fr;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--border);}
.so-row:last-child{border-bottom:none;}
.so-l{text-align:left;min-width:0;}
.so-r{text-align:right;min-width:0;}
.so-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.3;overflow-wrap:anywhere;}
