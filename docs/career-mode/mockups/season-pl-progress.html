.so-rno{font-size:11px;font-weight:700;color:var(--text-secondary);text-align:center;}
.so-icon{width:28px;height:28px;border-radius:50%;border:1px solid var(--border-bright);display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;}
.so-none{border-style:dashed;}
/* 팀 스탯 카드 안의 공격/수비/반칙 같은 하위 카테고리 제목 — 카드
   타이틀(.mm-card-title)과 같은 스타일을 쓰면 "팀 스탯"이라는 카드
   제목과 그 하위 그룹 제목이 구분이 안 갔다. 더 작고 옅게 눌러서
   하위 항목임을 시각적으로 드러낸다. */
.mm-stat-cat-title{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary);padding:14px 14px 4px;}
.mm-team-tabs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);margin-top:10px;}
.mm-team-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:14px 6px;border:none;background:var(--surface3);color:var(--text-muted);cursor:pointer;font-family:var(--fb);font-size:12px;font-weight:700;}
.mm-team-tab img{width:24px;height:24px;object-fit:contain;}
.mm-team-tab.active{background:var(--red-dark);color:var(--white);}
.mm-events{display:flex;flex-direction:column;gap:4px;}
.mm-event{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--surface2);}
.mm-event.home{flex-direction:row;}
.mm-event.away{flex-direction:row-reverse;}
.mm-event-min{font-family:var(--fm);font-size:11px;color:var(--gold);min-width:32px;font-weight:700;}
.mm-event.away .mm-event-min{text-align:right;}
.mm-event-icon{font-size:14px;flex-shrink:0;}
.mm-event-player{font-size:12px;font-weight:700;color:var(--text);flex:1;}
.mm-event.away .mm-event-player{text-align:right;}
.mm-comp-badge{display:none;}
.mm-venue{display:none;}
.mm-match-date{display:none;}
.mm-events-table{width:100%;border-collapse:collapse;table-layout:fixed;}
.mm-events-table td{padding:4px 0;vertical-align:middle;}
.mm-evt-home{width:calc(50% - 1px);text-align:right;}
.mm-evt-away{width:calc(50% - 1px);text-align:left;}
.mm-evt-div{width:2px;background:var(--border-bright);}
/* 이름(Noto Sans KR)과 시간(Fira Mono)은 폰트가 달라 박스 중앙을 맞춰도 글자
   기준선이 어긋난다(한글 폰트는 기준선 아래 여백이 커서 이름 글자가 더 아래에
   앉음 → 시간이 1.5px 떠 보였다). 두 텍스트는 기준선(baseline)으로 맞추고,
   글자가 아닌 아이콘만 가운데 정렬한다. 시간 글자 크기도 이름과 같게. */
.mm-evt-cell{display:inline-flex;align-items:baseline;gap:3px;padding:3px 6px;max-width:100%;min-width:0;overflow:hidden;}
.mm-evt-home .mm-evt-cell{flex-direction:row;}
.mm-evt-away .mm-evt-cell{flex-direction:row;}
.mm-event-icon{font-size:10px;flex-shrink:0;align-self:center;}
.mm-event-min{font-family:var(--fm);font-size:10px;color:var(--gold);font-weight:700;flex-shrink:0;min-width:3.2em;text-align:center;}
.mm-event-player{font-size:10px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1;}
.mm-stats-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px 8px;align-items:center;}
.mm-stat-val{font-size:13px;font-weight:800;color:var(--text);}
.mm-stat-val.home{text-align:right;}
.mm-stat-val.away{text-align:left;}
.mm-stat-val.lead{color:var(--green);}
.mm-stat-label{font-size:10px;color:var(--text-secondary);text-align:center;letter-spacing:.3px;}
.mm-poss-label{font-size:10px;color:var(--text-secondary);text-align:center;letter-spacing:.3px;margin-bottom:4px;}
/* 팀 컬러가 흰색이면 라이트 모드 카드와 구분이 안 되고, 두 팀 컬러가 비슷하면
   경계가 사라져서 — 공통 라인색 테두리 + 두 칸 사이 2px 틈을 둔다 */
.mm-poss-bar-wrap{grid-column:1/-1;display:flex;gap:2px;height:32px;border-radius:6px;overflow:hidden;margin:0 0 4px;border:1px solid var(--border-bright);box-sizing:border-box;}
/* 매치 도미넌스의 밝은 팀 컬러 막대 외곽선 (renderMomentumCard). SVG 프레젠테이션
   속성엔 var()가 안 먹을 수 있어 CSS 클래스로 준다 */
.mm-mo-light{stroke:var(--overlay-50);stroke-width:1px;}
.mm-poss-bar-home{background:var(--red);display:flex;align-items:center;padding-left:10px;color:var(--white);font-size:13px;font-weight:800;white-space:nowrap;transition:width .4s;}
.mm-poss-bar-away{background:rgba(96,165,250,.75);display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:var(--white);font-size:13px;font-weight:800;white-space:nowrap;transition:width .4s;}
.mm-pitch-wrap{overflow:hidden;border-radius:10px;}
.mm-grid-row{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;margin:14px 16px;align-items:start;}
.mm-grid-row .mm-card{margin:0;}
.mm-lineup-split{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start;margin:8px 14px 14px;}
.mm-lineup-split .mm-pitch-wrap{width:200px;}
.mm-lineup-split .mm-section{padding:0;}
.mm-pitch-svg{width:100%;display:block;}
.mm-pitch-player{cursor:default;}
.mm-pitch-player circle{fill:#C8102E;}
.mm-pitch-player.away circle{fill:#1a3a6c;}
.mm-pitch-player text.jersey{fill:var(--white);font-size:9px;font-weight:700;text-anchor:middle;dominant-baseline:central;}
.mm-pitch-player text.pname{fill:rgba(255,255,255,0.85);font-size:7px;text-anchor:middle;dominant-baseline:hanging;}
.mm-pitch-formation{font-size:10px;color:var(--text-muted);text-align:center;padding:2px 0 6px;}
.mm-pos-badge{display:inline-block;padding:1px 5px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:0.5px;margin-right:5px;vertical-align:middle;}
.mm-pos-gk{background:#B45309;color:#FEF3C7;}
.mm-pos-df{background:#1D4ED8;color:#DBEAFE;}
.mm-pos-mf{background:#15803D;color:#DCFCE7;}
.mm-pos-fw{background:#B91C1C;color:#FEE2E2;}
.mm-pos-sub{background:#374151;color:#D1D5DB;}
.mm-sub-title{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase;padding:8px 6px 4px;border-top:1px solid var(--border-bright);}
.mm-lineup-block+.mm-lineup-block{margin-top:14px;padding-top:14px;border-top:1px solid var(--border-bright);}
.mm-lineup-block-title{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-secondary);padding:0 0 8px;}
/* 선발 탭 피치 아래 교체 명단(benchCardHtml) — 투입 선수는 한 줄씩(등번호·이름·
   포지션·골/카드 | 누구 대신 | 투입 시간·평점), 미출전은 아래 2열로 흐리게.
   등번호 원은 피치와 같은 팀 색이라 흰 유니폼이면 밝은 배경에 묻히므로 피치
   선수 원처럼 안쪽 테두리 + 바깥 라인(공통)을 둘러 어느 테마에서도 윤곽이 선다. */
.bn-card{margin:12px 14px 4px;border:1px solid var(--border-bright);border-radius:14px;overflow:hidden;background:var(--surface2);}
.bn-head{display:flex;align-items:baseline;justify-content:space-between;padding:12px 14px 8px;}
.bn-title{font-size:13px;font-weight:700;color:var(--text);}
.bn-sum{font-size:11px;color:var(--text-secondary);}
.bn-row{display:grid;grid-template-columns:24px 1fr auto 34px;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--border);}
.bn-no{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 0 0 1px var(--border-bright);}
.bn-name{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:5px;min-width:0;}
.bn-name .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bn-name .mm-pos-badge{flex-shrink:0;}
.bn-for{font-size:11px;color:var(--text-secondary);margin-top:2px;display:flex;align-items:center;gap:4px;min-width:0;}
.bn-for .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bn-min{font-size:11px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:2px;font-family:var(--fm);white-space:nowrap;}
.bn-rt{text-align:right;color:var(--text-secondary);font-size:11px;}
.bn-sub{padding:10px 14px 4px;border-top:1px solid var(--border-bright);font-size:11px;font-weight:700;color:var(--text-secondary);}
.bn-unused{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:6px 14px 14px;}
.bn-u{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary);min-width:0;}
.bn-u .bn-no{width:20px;height:20px;font-size:9px;opacity:.6;}
.bn-u .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mm-player-table{width:100%;border-collapse:collapse;font-size:11px;}
.mm-player-table th{font-size:9px;letter-spacing:.2px;text-transform:uppercase;color:var(--text-muted);padding:5px 3px;text-align:center;border-bottom:1px solid var(--border-bright);white-space:nowrap;}
.mm-player-table th:first-child{text-align:left;padding-left:12px;}
.mm-player-table td{padding:5px 3px;text-align:center;border-bottom:1px solid var(--border-bright);color:var(--text);}
.mm-player-table td:first-child{text-align:left;font-weight:600;}
.mm-player-table th:not(:first-child),.mm-player-table td:not(:first-child){white-space:nowrap;}
.mm-player-table tr:last-child td{border-bottom:none;}
.mm-tab-row{display:flex;gap:6px;padding:12px 16px 0;}
.mm-tab{background:var(--surface2);border:1px solid var(--border-bright);color:var(--text-muted);font-family:var(--fb);font-size:10px;padding:5px 12px;border-radius:20px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
.mm-tab img{border-radius:50%;object-fit:cover;flex-shrink:0;}
.mm-tab.active{background:rgba(239,1,7,.15);border-color:rgba(239,1,7,.4);color:var(--red);}
/* 라이브 상세패널 상단 탭 — 선수단 탭(.f-btns)과 동일한 세그먼트 테마.
   리더보드(.lb-tabs)처럼 탭과 하단 컨텐츠를 하나의 .card로 묶으므로
   테두리/마진은 부모 .card가 담당하고 탭 자체는 배경만 준다. */
.live-tabs{display:flex;gap:1px;background:var(--border-bright);}
.live-tab-btn{flex:1;background:var(--surface2);border:none;color:var(--text-muted);font-family:var(--fb);font-size:11px;font-weight:700;padding:10px 4px;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent;}
/* --pm-tab-active: 타팀 선수 상세모달이 팀 색을 넣는다(없으면 아스날 레드) */
.live-tab-btn.active{background:var(--pm-tab-active,var(--red-dark));color:var(--white);}
/* ── SNS ── */
.sns-list{display:flex;flex-direction:column;gap:10px}
.sns-post{background:var(--surface);border:1px solid var(--border-bright);border-radius:12px;overflow:hidden;text-decoration:none;display:block;color:inherit;-webkit-tap-highlight-color:transparent;transition:border-color .2s}
.sns-post:active{opacity:.85}
.sns-post-head{display:flex;align-items:center;gap:10px;padding:12px 14px 8px}
.sns-avatar{width:36px;height:36px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:14px;color:var(--white);flex-shrink:0;border:1px solid rgba(239,1,7,.4);object-fit:cover;}
.sns-author{flex:1;min-width:0}
.sns-author-name{font-weight:700;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sns-author-label{font-size:10px;color:var(--text-muted)}
.sns-time{font-size:10px;color:var(--text-secondary);flex-shrink:0}
.sns-body{padding:0 14px 10px}
.sns-text{font-size:13px;line-height:1.5;color:var(--text);white-space:pre-wrap;word-break:break-word}
/* 예전엔 높이 200px + cover라 세로 사진은 위아래가 잘려 선수 머리가 날아갔다. 잘라내지 않고
   원본 비율로 보여주되, 9:16 같은 아주 긴 사진이 카드를 화면 너머까지 늘리지 않게만 막는다
   (그 경우만 contain으로 좌우에 여백). 영상(.sns-video)과 같은 원칙. */
.sns-image{width:100%;height:auto;max-height:560px;object-fit:contain;display:block;background:var(--surface2);border-top:1px solid var(--border-bright)}
/* 영상은 잘리면 안 돼서(자막·스코어 그래픽) 사진과 달리 contain + 검은 배경. 세로 영상이
   카드를 과하게 늘리지 않게 높이만 제한한다. */
.sns-video{position:relative;width:100%;max-height:420px;background:#000;border-top:1px solid var(--border-bright);cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center}
.sns-video-thumb,.sns-video-el{width:100%;height:100%;max-height:420px;object-fit:contain;display:block;background:#000}
.sns-video-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);color:#fff;display:flex;align-items:center;justify-content:center;padding-left:3px;pointer-events:none}
.sns-video-err{padding:28px 16px;font-size:12px;color:rgba(255,255,255,.75);text-align:center}
.sns-foot{display:flex;gap:14px;padding:8px 14px 12px;border-top:1px solid var(--border-bright)}
.sns-stat{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted)}
.sns-read{margin-left:auto;flex-shrink:0;font-size:10px;font-weight:700;color:var(--red);white-space:nowrap}
/* ── 삼성 인터넷 강제 다크모드 차단 — 이미 다크 테마이므로 고정 ── */
/* ── 태블릿/폴더블 등 중간 폭(600~899px, 아직 PC 사이드바 전환 전) ──
   .section의 max-width 캡을 없애 화면을 꽉 채우기로 하면서, 열 수는
   그대로 2열 유지하되(3열로 늘리면 사진이 작아져 정보 밀도가 떨어짐)
   카드 자체는 넓어지니 사진/숫자도 비례해서 커져야 한다 — 안 그러면
   카드만 옆으로 늘어나고 내용물은 작은 채로 남아 휑해 보인다. 데스크톱
   3열 스케일링(아래 900px 블록)과 동일한 aspect-ratio 방식을 재사용하되,
   그쪽은 카드가 좁아질수록 글자가 작아지는 하한 캡이라 여기(카드가
   넓어질수록 커지는 상한 캡)와는 clamp 값이 다르다. */
@media (min-width: 600px) {
  .sq-grid .pl-card{container-type:inline-size;}
  .sq-grid .pl-top{height:auto;grid-template-columns:minmax(60px,20%) 1fr;}
  .sq-grid .pl-photo-box{height:auto;aspect-ratio:17/9;}
  .sq-grid .pl-num-txt{font-size:clamp(32px,9cqw,44px);}
  .sq-grid .pl-pos-txt{font-size:clamp(10px,3cqw,13px);}
  .sq-grid .pl-card-name{font-size:clamp(11px,3cqw,14px);}
}
/* ── 모바일 스티키 탭(물방울 효과, gooFrame 참고) — JS가 .goo-tab을 붙이고
   top/모서리/좌우 여백/테두리 색은 스크롤마다 인라인으로 갱신한다. ── */
@media (max-width: 899px) {
  /* 버튼 사이 1px 틈으로 비치는 컨테이너 배경(--border-bright, 반투명)을 페이지
     배경 위에 미리 겹친 불투명 색으로 — 붙어 있는 동안 밑으로 지나가는
     콘텐츠가 틈으로 비치지 않게. 겉보기 색은 원래와 같다. */
  .goo-tab{position:sticky;z-index:80;transform-origin:50% 0;background:linear-gradient(var(--border-bright),var(--border-bright)),var(--navy);}
  /* 다 펴진 탭은 좌우 테두리가 화면 밖으로 살짝(테두리 두께) 나가고, 붙는 순간 젤리 흔들림도 옆으로 늘어난다 —
     가로로 삐져나온 만큼 화면이 옆으로 밀리지 않게 자른다. hidden은 sticky를 깨지만 clip은 스크롤 영역을
     만들지 않아 sticky가 그대로 동작한다. */
  .page{overflow-x:clip;}
  /* 리더보드 탭은 모바일에서 순위 카드 밖(#lbLayout 바로 아래)으로 옮겨진다
     (gooPlaceLbTabs) — 카드 안에 있으면 sticky가 카드 끝에서 풀려 아래 라운드
     카드까지 못 따라간다. 카드 윗부분의 테두리/둥근 모서리는 탭이 대신 맡는다. */
  #lbLayout>.lb-tabs{border:1px solid var(--border-bright);border-radius:12px 12px 0 0;overflow:hidden;}
  #lbLayout>.lb-tabs+#lbListCol>.card{border-top:none;border-top-left-radius:0;border-top-right-radius:0;}
}
/* ── PC 반응형: 하단 탭바 → 좌측 사이드바 (모바일 레이아웃은 그대로, 이 폭 이상에서만 전환) ── */
@media (min-width: 900px) {
  body{padding-bottom:0;}
  /* 사이드바 폭 — 본문처럼 화면 폭에 비례해 부드럽게 변한다(사용자 지정). 화면의 12.5%,
     최소 160px(더 좁으면 워드마크가 벽에 붙는다)·최대 200px(초와이드에서 과하게 두꺼워지지 않게).
     이 값을 쓰는 곳은 아래 세 줄뿐. */
  :root{--sidebar-w:clamp(160px, 12.5vw, 200px);}
  .top-header{margin-left:var(--sidebar-w);}
  .page{margin-left:var(--sidebar-w);}
  .bottom-nav{top:0;bottom:0;left:0;right:auto;width:var(--sidebar-w);flex-direction:column;border-top:none;border-right:1px solid var(--border-bright);padding-bottom:0;padding-top:16px;align-items:stretch;}
  .nav-btn{flex:0 0 auto;flex-direction:row;justify-content:flex-start;align-items:center;gap:12px;padding:12px 20px;border-right:none;border-bottom:1px solid var(--border-bright);font-size:13px;letter-spacing:normal;text-transform:none;}
  /* 사이드바 상단 브랜드 — 오른쪽 헤더와 높이(64px)·아래 구분선을 맞춰 선이 좌우로 한 줄로 이어지게 한다. */
  .bottom-nav{padding-top:0;}
  .top-header{height:64px;box-sizing:border-box;padding-top:0;padding-bottom:0;border-bottom-color:var(--border-bright);}
  /* 배경은 선택 메뉴(.nav-btn.active)와 같은 빨강 — 사용자 지정(통일성). 빨강 위라 글자는 테마와
     무관하게 흰색·금색 고정(라이트 모드에서 --text가 검정으로 바뀌면 안 보인다). */
  .nav-brand{display:flex;align-items:center;gap:10px;height:64px;box-sizing:border-box;padding:0 20px;border-bottom:1px solid var(--border-bright);flex-shrink:0;background:var(--red-dark);}
  /* 두 줄을 한 덩어리(로크업)로 — 아랫줄은 글자 사이를 벌려
     윗줄(워드마크)과 정확히 같은 폭으로 맞춘다(글자별 span + space-between). 두 줄 사이는 붙인다(사용자 지적: 간격이 벌어져 보인다). */
  .nav-brand-lockup{display:inline-flex;flex-direction:column;}
  /* 워드마크는 사용자가 준 SVG를 인라인으로 넣었다(2.8KB라 파일 요청을 따로 두지 않음. 흰색 고정 — 빨강 배경 위라 테마와 무관). 글자 크기는 키우지 않는다(사용자 지정). */
  .nav-brand-name{display:block;height:30px;width:auto;}
  .nav-brand-sub{display:flex;justify-content:space-between;font-size:9px;font-weight:700;color:var(--on-dark-header-gold);line-height:1;margin-top:3px;}
  .nav-icon{width:18px;height:18px;}
  .nav-live-dot{top:10px;right:auto;left:34px;}
  #squad.section{max-width:none;}
  .sq-grid{grid-template-columns:repeat(3,1fr);}
  /* 사진 박스 높이를 컨테이너 폭 기준 cqw로 주면, 카드 자체 폭(3열이라 계속
     좁아짐)과 무관하게 높이엔 하한(clamp min)이 걸려서 화면이 좁아질수록
     박스가 점점 더 세로로 길쭉해진다 — object-fit:contain이 가로폭 기준으로
     축소되면서 top 정렬 탓에 사진이 위로 붕 뜨고 아래가 비어 보이는 원인.
     박스 자신의 폭을 기준으로 한 aspect-ratio를 쓰면 카드 폭이 얼마든
     박스 비율(원래 4열일 때와 동일한 가로가 긴 비율)이 항상 유지된다. */
  .sq-grid .pl-top{height:auto;}
  .sq-grid .pl-photo-box{height:auto;aspect-ratio:17/9;}
  /* 등번호 칸(GK/CB 뱃지 쪽)이 70px 고정폭이라, 카드가 좁아질수록 사진
     쪽만 줄고 등번호 칸은 그대로라 카드에서 차지하는 비중이 계속 커지는
     문제 — 등번호 칸도 카드 폭 비례(%)로 같이 줄어들게 하고, 그 안의
     숫자/포지션 글씨도 카드 폭(cqw) 기준으로 같이 줄인다. */
  .sq-grid .pl-card{container-type:inline-size;}
  .sq-grid .pl-top{grid-template-columns:minmax(42px,34%) 1fr;}
  /* 640px 캡(#sqListCol) 기준 3열이면 카드 폭이 (640-20)/3≈206.7px로
     고정 상한을 가지므로, 배율도 그 상한에서 딱 최댓값에 닿게
     k=최댓값/206.7로 재계산했다(이전엔 리스트 칸이 무제한이라 실측
     ~247px 기준으로 잡혀 있었음). */
  .sq-grid .pl-num-txt{font-size:clamp(16px,15.48cqw,32px);}
  .sq-grid .pl-pos-txt{font-size:clamp(7px,4.84cqw,10px);}
  /* 우측 선수 상세패널(.pm-*)도 fix-detail-panel과 동일한 이유로 지금까지
     패널 폭이 340~480px 사이에서 바뀌어도 사진/이름/스탯 글자가 고정
     px였다 — .pm-*는 모바일 바텀시트(#modalSheet)와도 공유하는 클래스라
     .sq-detail-panel로 스코프를 좁혀 k=최댓값/480 기준으로 스케일링한다. */
  .sq-detail-panel .pm-photo,.sq-detail-panel .pm-photo-ph{width:clamp(60px,15cqw,72px);height:clamp(60px,15cqw,72px);}
  .sq-detail-panel .pm-name{font-size:clamp(20px,5cqw,24px);}
  .sq-detail-panel .detail-info-val{font-size:clamp(14px,3.33cqw,16px);}
  .sq-detail-panel .stat-box-val{font-size:clamp(18px,4.58cqw,22px);}
  .sq-detail-panel .fm-stat-val{font-size:clamp(18px,4.58cqw,22px);}
  /* 슈팅 상세(왼발/코너킥/블록 등 5칸 .overall-stat-grid)는 칸이 좁아서
     위 4칸 기준 스케일(18~22px)을 그대로 받으면 PC에서 글자가 칸보다
     커진다 — 원래 12px 캡(.overall-stat-grid .fm-stat-val, base CSS)에
     맞춰 훨씬 작은 별도 배율로 다시 캡을 건다. */
  .sq-detail-panel .overall-stat-grid .fm-stat-val{font-size:clamp(10px,2.5cqw,12px);}
  /* SNS 포스트 상세모달 — 미디어 탭은 뉴스/SNS/YouTube 3열 고정 그리드라
     선수단/히스토리처럼 옆에 붙일 상세패널 자리가 없다. 그래서 PC에서는
     리스트+패널 대신 화면 가운데 뜨는 다이얼로그로 바꾼다(모바일은 기본
     바텀시트 그대로 유지). */
  /* 센터 다이얼로그는 바텀시트가 아니라서 slideUp(translateY(100%))을
     그대로 쓰면 안 된다 — 그 100%는 요소 자신의 높이 기준이라, PC에서
     height:auto로 바뀐 이 모달은 글 길이에 따라 슬라이드 이동 거리가
     들쭉날쭉해 보이는 버그가 있었다(글 짧으면 조금만, 길면 많이 올라옴).
     높이와 무관한 페이드+스케일로 교체한다. */
  #transferModal,#gmProfileModal{align-items:center;}
  #gmProfileModal .modal-sheet{border-radius:16px;max-height:88vh;animation:dialogPop .25s cubic-bezier(.32,.72,0,1);}
  #transferModal .modal-sheet{border-radius:16px;height:auto;max-height:80vh;animation:dialogPop .25s cubic-bezier(.32,.72,0,1);}
  /* History도 선수단/경기일정/리더보드와 동일한 "리스트+우측 상세패널"
     구조로 맞춘다 — 섹션 자체는 max-width:none으로 채우고, 안에서
     리스트 칸(#histListCol)은 640px로 캡, 우측엔 상세 패널(.hist-detail-panel,
     fix-detail-panel과 동일한 340~480px)을 둔다. OTD는 모바일 전용 상단
     스트립 대신 PC에서는 우측 패널 기본 카드로 자동 노출된다(경기일정의
     "다음 경기 자동 노출"과 동일한 패턴, renderHistoryNew 참고). 카드형
     그리드(트로피/감독/레전드/모먼트/스타디움)는 스쿼드 그리드와 동일하게
     640px 캡 안에서 2열→3열로 넓힌다. */
  #history.section{max-width:none;}
  .hist-otd-wrap{display:none;}
  .hist-layout{display:flex;gap:20px;align-items:flex-start;}
  #histListCol{flex:0 1 640px;min-width:0;}
  /* 우측 칸엔 상세패널(.hist-detail-panel)과 "아스날 흥미로운 사실"
     (#histFactsCard)이 세로로 쌓인다 — 콘텐츠상으론 서로 완전히 독립된
     별개 섹션이라 트로피/감독 등 상세를 열어도 사실 카드 데이터 자체는
     그대로 유지된다. 다만 트로피/감독 등 실제 상세(OTD 기본 상태 제외)가
     열려있는 동안엔 사실 카드가 그 밑으로 밀려나 보이는 게 어색해서,
     그 사이엔 시각적으로만 숨긴다(.showing-detail은 openOtdModal에서만
     빠지고 나머지 상세 열기 함수들은 전부 붙인다). 폭 제약(340~480px)은
     이 둘을 감싸는 칸 자체에 건다. */
  .hist-right-col{display:flex;flex-direction:column;gap:20px;flex:1 1 0%;min-width:340px;max-width:480px;}
  .hist-detail-panel{display:block;position:relative;background:var(--surface);border:1px solid var(--border-bright);border-radius:16px;container-type:inline-size;overflow:hidden;}
  /* #histFactsCard는 .mm-card를 재사용하지만, .mm-card 본래 용도(모달 안
     내부 여백을 위한 margin:14px 16px)는 여기서 필요 없다 — 상세패널과
     가로폭을 나란히 맞춰야 하는 최상위 카드라서 margin을 지우고 상세패널과
     동일한 배경/테두리를 직접 준다. */
  #histFactsCard{display:block;margin:0;background:var(--surface);border:1px solid var(--border-bright);border-radius:16px;overflow:hidden;}
  #histDetailPanel.showing-detail ~ #histFactsCard{display:none;}
  .hist-detail-panel .hist-modal-handle{display:none;}
  /* OTD(기본 상태)에는 "닫기" 버튼이 필요 없다 — 애초에 아무것도 안
     열려있는 홈 화면이라 닫을 대상이 없다. 트로피/감독 등 실제 상세를
     열었을 때만(.showing-detail) X를 보여줘서 OTD로 되돌아가게 한다. */
  #histDetailPanel .modal-close{display:none;}
  #histDetailPanel.showing-detail .modal-close{display:flex;}
  /* 히스토리 상세는 사진 위에 X 버튼이 곧바로 얹히는 구조라, 다른 곳과
     같은 옅은 회색 배경(var(--overlay-10))이면 밝은 사진 위에서 거의
     안 보인다 — 어두운 배경으로 고정해서 어떤 사진이 오든 구분되게 한다. */
  #histDetailPanel .modal-close{background:var(--overlay-black-55);color:var(--white);}
  /* 선수단 우측 패널도 히스토리와 동일한 원칙 — 기본 상태(부상자 현황)엔
     닫을 대상이 없어 X 버튼이 필요 없고, 선수 상세를 열었을 때만 보여준다. */
  #sqDetailPanel .modal-close{display:none;}
  #sqDetailPanel.showing-detail .modal-close{display:flex;}
  .trophy-grid,.mgr-grid,.lgd-grid,.mom-grid,.stad-grid{grid-template-columns:repeat(3,1fr);}
  #fixtures.section{max-width:none;}
  /* 모바일(.section max-width:600px 중앙정렬)에서만 vw 풀블리드 계산이
     필요하다 — PC는 섹션 자체가 max-width:none이라 가장자리가 곧 콘텐츠
     영역 끝이니, 사이드바(--sidebar-w)를 침범하지 않게 원래의 단순 -16px로
     되돌린다. */
  .dday-card{width:auto;margin-left:-16px;margin-right:-16px;}
  .fix-layout{display:flex;gap:20px;align-items:flex-start;}
  /* 리더보드 카드와 동일한 640px 캡 + flex:0 1 640px 패턴(이유는 #lbListCol
     주석 참고) — 우측 상세패널과 동일한 640px 기준으로 리스트 폭을 통일한다. */
  #fixWrap{flex:0 1 640px;min-width:0;container-type:inline-size;}
  .fix-detail-panel{display:block;flex:1 1 0%;min-width:340px;max-width:480px;container-type:inline-size;position:relative;background:var(--surface);border:1px solid var(--border-bright);border-radius:16px;overflow:hidden;}
  .sq-layout{display:flex;gap:20px;align-items:flex-start;}
  /* fixWrap/lbListCol과 동일한 640px 캡 패턴 — 안 걸면 리스트 칸이 flex:2로
     계속 자라서 우측 패널(최대 480px)이 오히려 눌리는 문제가 있었다. */
  #sqListCol{flex:0 1 640px;min-width:0;}
  .sq-detail-panel{display:block;flex:1 1 0%;min-width:340px;max-width:480px;container-type:inline-size;position:relative;}
  #leaderboard.section{max-width:none;}
  .lb-layout{display:flex;gap:20px;align-items:flex-start;}
  /* #lbListCol을 flex:2(비율 성장)로 두면 카드(max-width로 캡 걸림)보다
     칸 자체가 더 넓어져서, 카드와 우측 패널 사이에 빈 칸이 생긴다 — 칸을
     카드 캡과 같은 640px을 기준값(flex-basis)으로 주고 성장은 안 하게
     하면(flex:0 1 640px) 카드가 패널에 바로 붙고, 남는 공간은 레이아웃
     오른쪽 끝 하나로만 몰린다. flex-basis를 auto로 두면(내용물 크기 기준)
     안의 grid가 1fr 트랙이라 내용 기준 크기가 사실상 0으로 잡혀서 칸
     자체가 찌그러지는 문제가 있었다 — 그래서 명시적 px 기준값을 쓴다. */
  #lbListCol{flex:0 1 640px;min-width:0;}
  #lbListCol .card{max-width:640px;container-type:inline-size;}
  /* fix-detail-panel(예정경기 상세)과 동일한 340~480px 범위로 통일 — 원래
     300~360px으로 좁게 잡혀 있어 우측 패널 크기가 탭마다 달라 보이는
     문제가 있었다. */
  .lb-round-panel{flex:1 1 0%;min-width:340px;max-width:480px;margin-top:0;container-type:inline-size;}
  /* 라운드 결과(.lb-round-row)/이주의팀(.totw-*)도 fix-detail-panel과 같은
     이유로 지금까지 패널 폭이 바뀌어도 안의 크레스트/사진/글자가 고정
     px였다 — 같은 340~480px 범위이므로 배율도 k=최댓값/480으로 동일하게
     맞춘다. */
  .lb-round-panel .lb-round-row{font-size:clamp(11px,2.71cqw,13px);}
  .lb-round-panel .lb-round-crest{width:clamp(16px,4.17cqw,20px);height:clamp(16px,4.17cqw,20px);}
  .lb-round-panel .totw-photo-wrap{width:clamp(34px,8.75cqw,42px);height:clamp(34px,8.75cqw,42px);}
  .lb-round-panel .totw-photo{width:clamp(34px,8.75cqw,42px);height:clamp(34px,8.75cqw,42px);}
  .lb-round-panel .totw-team-crest{width:clamp(13px,3.54cqw,17px);height:clamp(13px,3.54cqw,17px);}
  .lb-round-panel .totw-rating{font-size:clamp(8px,2.08cqw,10px);}
  .lb-round-panel .totw-name{font-size:clamp(8px,2.08cqw,10px);max-width:clamp(56px,15cqw,72px);}
  /* cqw 배율은 카드 캡(640px)을 기준으로 다시 계산한 값 — "640px일 때
     딱 최댓값에 닿는다"는 조건으로 역산했다(배율 = 최댓값/640). 캡을 걸기
     전(폭 1184px 기준) 배율을 그대로 뒀더니 640px에선 죄다 하한선에
     묶여서 사실상 안 커지는 문제가 있었다. */
  #lbListCol .std-hdr,#lbListCol .std-row{grid-template-columns:clamp(16px,3.44cqw,22px) 1fr clamp(18px,3.75cqw,24px) clamp(18px,3.75cqw,24px) clamp(18px,3.75cqw,24px) clamp(18px,3.75cqw,24px) clamp(30px,6.25cqw,40px) clamp(22px,4.69cqw,30px) clamp(28px,5.94cqw,38px);padding:clamp(8px,1.88cqw,12px) clamp(10px,2.19cqw,14px) clamp(8px,1.88cqw,12px) clamp(8px,1.88cqw,12px);}
  #lbListCol .std-hdr{font-size:clamp(9px,1.72cqw,11px);}
  #lbListCol .std-pos{font-size:clamp(10px,2.03cqw,13px);}
  #lbListCol .std-team{font-size:clamp(11px,2.19cqw,14px);gap:clamp(5px,1.41cqw,9px);}
  /* PC는 팀명 컬럼이 330px 이상 확보돼서 가장 긴 "Wolverhampton Wanderers"(183px)도
     여유롭게 들어간다. 900px 근처 좁은 구간에서만 기존 ellipsis로 잘린다. */
  .std-team-short{display:none}
  .std-team-full{display:inline}
  #lbListCol .std-crest{width:clamp(15px,3.44cqw,22px);height:clamp(15px,3.44cqw,22px);}
  #lbListCol .std-s{font-size:clamp(10px,2.03cqw,13px);}
  #lbListCol .std-fa{font-size:clamp(9px,1.88cqw,12px);}
  #lbListCol .std-pts{font-size:clamp(11px,2.19cqw,14px);}
  .fix-detail-panel .mm-header-top{position:static;}
  #fixWrap .fix-card{--fix-px:20px;padding:13px var(--fix-px);gap:12px;}
  /* PC에서는 라이브 경기도 종료/예정 경기와 동일하게 우측 상세패널로
     보여준다(카드 자체 onclick, buildFixCard 참고) — 모바일 전용 인라인
     펼치기 버튼은 필요 없으니 숨긴다. */
  #fixWrap .fix-expand-btn{display:none;}
  #fixWrap .fix-grid{grid-template-columns:1fr minmax(max-content,auto) 1fr;gap:3px 6px;}
  #fixWrap .fix-score,#fixWrap .fix-vs{white-space:nowrap;}
  /* fixWrap도 리더보드와 같은 640px 캡을 쓰므로 배율을 k=최댓값/640으로
     재계산(리더보드 std-* 캘리브레이션과 동일 원칙). */
  #fixWrap .t-crest,#fixWrap .t-crest-ph{width:clamp(30px,6.88cqw,44px);height:clamp(30px,6.88cqw,44px);}
  #fixWrap .t-crest-ph{font-size:clamp(9px,2.03cqw,13px);}
  #fixWrap .t-name-home,#fixWrap .t-name-away{font-size:clamp(12px,2.5cqw,16px);}
  #fixWrap .fix-score{font-size:clamp(24px,5.47cqw,35px);}
  #fixWrap .fix-vs{font-size:clamp(16px,3.59cqw,23px);}
  #fixWrap .comp-tag{font-size:clamp(9px,1.88cqw,12px);padding:3px 10px;}
  #fixWrap .fix-date{font-size:clamp(10px,2.03cqw,13px);}
  #fixWrap .fix-vs-label{font-size:clamp(8px,1.56cqw,10px);}
  #fixWrap .fix-pk{font-size:clamp(9px,1.76cqw,12px);}
  /* PC도 같은 원리 — PEN 글자 크기가 폭 따라 변하므로 같은 식으로 빼준다
     (카드와 PEN 모두 #fixWrap 컨테이너 기준 cqw라 값이 정확히 맞는다) */
  #fixWrap .fix-card.has-pk{padding-bottom:calc(18px - clamp(9px,1.76cqw,12px) - 2px);}
  #fixWrap .cal-day{padding:6px 3px 8px;}
  /* 우측 상세패널(경기 상세모달 .mm-*)은 지금까지 모바일 바텀시트 고정폭
     기준의 px 값을 그대로 썼다 — 패널 폭이 340~480px 사이에서 실제로
     바뀌는데도 안의 크레스트/스코어/스탯 글자가 전혀 안 커지는 문제가
     있었다. 패널 자신을 컨테이너로(container-type:inline-size, 위에서
     지정) 삼아 clamp(...cqw...)로 스케일링한다 — 배율은 k=최댓값/480
     (패널의 max-width) 기준으로, 나머지 히스토리 모달 등 .mm-* 재사용
     컨텍스트에는 영향 없게 .fix-detail-panel로 스코프를 좁혔다. */
  .fix-detail-panel .mm-crest{width:clamp(40px,10cqw,48px);height:clamp(40px,10cqw,48px);}
  .fix-detail-panel .mm-team-name{font-size:clamp(10px,2.5cqw,12px);max-width:clamp(80px,20.83cqw,100px);}
  .fix-detail-panel .mm-score{font-size:clamp(26px,7.08cqw,34px);}
  .fix-detail-panel .mm-stat-val{font-size:clamp(12px,2.92cqw,14px);}
  .fix-detail-panel .mm-event-player,.fix-detail-panel .mm-event-min{font-size:clamp(9px,2.29cqw,11px);}
  .fix-detail-panel .mm-team-tab img{width:clamp(24px,5.83cqw,28px);height:clamp(24px,5.83cqw,28px);}
  /* .live-tab-btn(경기정보/선발/선수 스탯 · 기본정보/기록/경력)와
     .rec-subnav-btn(대회 하위탭, 라인업 홈/원정 전환)는 두 패널 모두에서
     쓰는 공용 탭 컴포넌트인데 정작 스케일링 대상에서 빠져 있었다 —
     같은 k=최댓값/480 기준으로 마저 맞춘다. */
  .fix-detail-panel .live-tab-btn,.sq-detail-panel .live-tab-btn{font-size:clamp(11px,2.71cqw,13px);}
  .fix-detail-panel .rec-subnav-btn,.sq-detail-panel .rec-subnav-btn{font-size:clamp(10px,2.5cqw,12px);}
  #media.section{max-width:none;}
  #mediaSeg{display:none;}
  .media-col-title{display:block;}
  /* 다른 탭들(경기일정 640+상세패널 480, 리더보드 640+480, 선수단
     640+480)과 총 폭을 맞춰 탭을 오가도 콘텐츠 영역 폭이 들쭉날쭉하지
     않게 1140px(640+20+480)로 캡을 걸었다 — 안 걸면 3열이 뉴스/SNS/영상
     칸 폭 그대로 화면 끝까지 계속 자라서 카드 내부 이미지/글자가
     clamp 상한에 묶인 채 칸만 헐렁하게 넓어지는 문제가 있었다. */
  .media-cols{display:flex;gap:20px;align-items:flex-start;max-width:1140px;}
  .media-cols .media-col{display:block!important;flex:1;min-width:0;container-type:inline-size;}
  /* 캡(1140px, 20px 갭 2개) 기준 칸 폭 상한은 (1140-40)/3≈366.7px —
     배율을 k=최댓값/366.7로 재계산해 그 폭에서 딱 최댓값에 닿게 했다. */
  .media-cols .news-img{height:clamp(160px,60cqw,220px);}
  .media-cols .news-src-badge{font-size:clamp(8px,3cqw,11px);padding:3px 9px;}
  .media-cols .news-hl,.media-cols .video-title{font-size:clamp(13px,4.91cqw,18px);}
  .media-cols .news-ex{font-size:clamp(12px,4.36cqw,16px);}
  .media-cols .news-foot,.media-cols .video-time,.media-cols .sns-read{font-size:clamp(10px,3.82cqw,14px);}
  .media-cols .sns-avatar{width:clamp(36px,13.09cqw,48px);height:clamp(36px,13.09cqw,48px);font-size:clamp(14px,4.91cqw,18px);}
  .media-cols .sns-author-name{font-size:clamp(12px,4.36cqw,16px);}
  .media-cols .sns-author-label,.media-cols .sns-time{font-size:clamp(10px,3.55cqw,13px);}
  .media-cols .sns-text{font-size:clamp(13px,4.91cqw,18px);}
  .media-cols .sns-stat{font-size:clamp(11px,3.82cqw,14px);}
}
/* ── 미니게임(헤더 게임기 버튼 → #games) ─────────────────────────────────
   하단 탭에 없는 섹션이다. 헤더의 게임기 버튼으로 들어오고, 들어와 있는 동안 그 버튼이
   집 모양으로 바뀌어 직전 탭으로 돌아가는 버튼이 된다. 색은 전부 테마 변수만 쓴다. */
#games.section{max-width:600px}
.gm-wrap{display:flex;flex-direction:column;gap:14px}
.gm-hrow{display:flex;justify-content:space-between;align-items:center}
.gm-my{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:var(--text-secondary);font:inherit;font-size:13px;cursor:pointer;padding:4px 0}
.gm-my:hover{color:var(--text)}
#gmProfileModal .modal-sheet{height:auto;max-height:92vh;max-height:92dvh}
.gm-me-n{font-size:20px;font-weight:700;color:var(--on-dark-header);margin-top:6px}
.gm-me-s{font-size:12px;color:var(--on-dark-header-secondary);margin-top:2px}
.gm-me-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.gm-inrow{display:flex;gap:8px}
.gm-inrow input{flex:1;min-width:0}
.gm-inrow input{transition:border-color .2s,box-shadow .2s}
.gm-inrow input.ok{border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.22);animation:gmOkPulse .5s ease-out}
.gm-inrow input.bad{border-color:var(--loss);box-shadow:0 0 0 3px rgba(239,68,68,.22);animation:gmShake .4s ease-in-out}
@keyframes gmOkPulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}100%{box-shadow:0 0 0 3px rgba(34,197,94,.22)}}
@keyframes gmShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@media (prefers-reduced-motion: reduce){.gm-inrow input.ok,.gm-inrow input.bad{animation:none}}
.gm-inrow .gm-btn{width:auto;flex:none;padding:0 14px;font-size:14px}
.gm-h{font-size:13px;letter-spacing:1px;color:var(--text-secondary);margin:2px 0 0}
.gm-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border-bright);border-radius:14px;padding:16px;color:var(--text);font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gm-card:active{opacity:.85}
.gm-card-ic{width:48px;height:48px;border-radius:12px;background:var(--red-dark);color:#fff;display:grid;place-items:center;font-family:var(--fd);font-size:22px;flex-shrink:0}
.gm-card-t{font-weight:700;font-size:16px}
.gm-card-d{font-size:12px;color:var(--text-secondary)}
.gm-panel{background:var(--surface);border:1px solid var(--border-bright);border-radius:16px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.gm-logo{font-family:var(--fd);font-size:44px;letter-spacing:2px;line-height:1;text-align:center;margin:6px 0 0}
.gm-logo span{color:var(--red)}
.gm-rules{margin:0;padding-left:18px;color:var(--text-secondary);font-size:13px;line-height:1.7}
.gm-rules b{color:var(--text)}
.gm-best{font-size:12px;color:var(--text-secondary);text-align:center}
.gm-btn{font:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--red);border:0;border-radius:12px;padding:14px 16px;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.gm-btn.ghost{background:transparent;border:1px solid var(--border-bright);color:var(--text)}
.gm-btn:disabled{opacity:.5;cursor:default}
.gm-btn:focus-visible,.gm-choice:focus-visible,.gm-card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gm-back{align-self:flex-start;background:none;border:0;color:var(--text-secondary);font:inherit;font-size:13px;cursor:pointer;padding:2px 0}
.gm-back.confirm{color:var(--gold)}
.gm-hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.gm-hud>:last-child{justify-self:end}
.gm-lives{display:flex;gap:3px;color:var(--red)}
.gm-lives svg{width:18px;height:18px}
.gm-lives .off{color:var(--border-bright)}
.gm-qno{font-size:12px;color:var(--text-secondary);letter-spacing:1px}
.gm-score{font-family:var(--fd);font-size:24px;color:var(--gold);line-height:1}
.gm-timer{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden}
.gm-timer i{display:block;height:100%;width:100%;background:var(--green);transform-origin:left}
.gm-timer.warn i{background:var(--amber)}
.gm-timer.crit i{background:var(--loss)}
.gm-q{display:flex;flex-direction:column;align-items:center;gap:12px}
.gm-q-t{font-family:var(--fd);font-size:22px;letter-spacing:1px;line-height:1}
.gm-path{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:8px 2px;width:100%}
.gm-club{display:flex;flex-direction:column;align-items:center;gap:5px;width:66px}
.gm-crest{width:42px;height:42px;object-fit:contain}
.gm-crest-ph{width:42px;height:42px;border-radius:50%;background:var(--surface3);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--text-secondary)}
.gm-club.ars .gm-crest,.gm-club.ars .gm-crest-ph{filter:drop-shadow(0 0 4px rgba(239,1,7,.55))}
.gm-yrs{font-size:11px;line-height:1.25;text-align:center;font-variant-numeric:tabular-nums;color:var(--text)}
.gm-loan{font-size:10px;color:var(--gold)}
.gm-step{display:flex;align-items:flex-start;gap:2px}
.gm-arrow{color:var(--text-dim);font-size:10px;padding-top:15px}
.gm-status{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--border-bright);color:var(--text-secondary)}
.gm-status.active{color:var(--green);border-color:var(--green)}
.gm-status.free{color:var(--gold);border-color:var(--border-accent)}
.gm-choices{display:flex;flex-direction:column;gap:10px}
.gm-guest{display:block;margin:4px auto 0;font:inherit;font-size:14px;color:var(--text-secondary);background:none;border:0;padding:8px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.gm-guest:disabled{color:var(--text-dim);cursor:default}
.gm-choice{font:inherit;font-size:16px;font-weight:600;color:var(--text);background:var(--surface2);border:1px solid var(--border-bright);border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent}
.gm-choice:disabled{cursor:default}
.gm-choice.right{border-color:var(--green);background:rgba(34,197,94,.16)}
.gm-choice.wrong{border-color:var(--loss);background:rgba(239,68,68,.16)}
.gm-gain{font-family:var(--fd);font-size:18px;color:var(--green);animation:gmGainUp .7s ease-out both}
/* 정답: 살짝 커졌다 돌아오며 초록빛이 퍼진다 / 오답: 좌우로 흔들린다(사용자 요청). */
.gm-choice.right{animation:gmPop .45s cubic-bezier(.3,1.6,.5,1)}
.gm-choice.right::after{content:'';position:absolute;inset:-1px;border-radius:12px;box-shadow:0 0 0 0 rgba(34,197,94,.55);animation:gmRing .6s ease-out forwards;pointer-events:none}
.gm-choice.wrong{animation:gmShake .42s ease-in-out}

@keyframes gmPop{0%{transform:scale(1)}40%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes gmRing{to{box-shadow:0 0 0 12px rgba(34,197,94,0)}}
@keyframes gmShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
/* 상단 HUD: 정답이면 점수가 올라가며 톡 커지고, 오답이면 잃은 하트가 부풀었다 기울며 꺼진다. */

@keyframes gmScoreBump{0%{transform:scale(1)}30%{transform:scale(1.3);color:var(--green)}100%{transform:scale(1)}}
@keyframes gmHeartLose{0%{color:var(--red);transform:scale(1)}30%{color:var(--red);transform:scale(1.5)}65%{color:var(--red);transform:scale(.75) rotate(-15deg)}100%{transform:scale(1) rotate(0)}}
@keyframes gmGainUp{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
.gm-note{font-size:12px;color:var(--text-secondary);text-align:center;min-height:18px}

/* 고를 때 반응은 짧게만(사용자 지정): 누르는 순간 살짝 눌림, 선택 색은 부드럽게, 비율 막대는 저장 직후 한 번만 차오름. */

/* ── 커리어 모드(#games 안, api/career.js) — 목업 docs/career-mode/mockup.html을 옮긴 것.
   다른 화면과 클래스가 겹치지 않게 전부 cr- 접두어. 색은 테마 변수, 빨간 머리 카드·오버롤 타일만 고정색. */
.cr{display:flex;flex-direction:column;gap:14px}
/* 커리어 모드 화면·오버레이 글자는 선택되지 않게(사용자 지적 — 길게 누르면 선택돼 크롬 검색 창이 떴다). 입력칸은 그대로 */
.cr,.cr-dock,#crTov{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cr input,.cr textarea,.cr select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.cr-top{display:flex;align-items:center;justify-content:space-between}
.cr-top .gm-back{align-self:center}
.cr-steps{display:flex;gap:6px}
.cr-steps i{width:22px;height:4px;border-radius:2px;background:var(--surface3)}
.cr-steps i.on{background:var(--red)}
.cr-h1{font-family:var(--fd);font-size:34px;letter-spacing:1px;margin:0;line-height:1}
.cr-h1 span{color:var(--red)}
.cr-sub{font-size:13px;color:var(--text-secondary);margin:-6px 0 0}
.cr-panel{background:var(--surface);border:1px solid var(--border-bright);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.cr-lbl{font-size:12px;color:var(--text-secondary);display:flex;justify-content:space-between;align-items:center;gap:8px}
.cr-lbl b{color:var(--text);font-weight:700;font-size:14px}
.cr input[type=text],.cr select{font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--border-bright);border-radius:10px;padding:11px;width:100%}
.cr-row{display:flex;gap:8px}
.cr-row>input{flex:1;min-width:0}
.cr-chip{font:inherit;font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--border-bright);border-radius:999px;padding:8px 12px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.cr-chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.cr-seg{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:6px}
.cr-seg .cr-chip{border-radius:10px;padding:11px;text-align:center;white-space:normal;word-break:keep-all;line-height:1.35}
.cr-note{font-size:12px;color:var(--text-secondary);line-height:1.6;margin:0}
.cr-form{gap:0;padding:4px 16px}
.cr-fd{display:flex;flex-direction:column;gap:10px;padding:14px 0}
.cr-fd+.cr-fd{border-top:1px solid var(--border)}
.cr-fd.off{opacity:.5}
.cr-acad{font-size:12px;color:var(--text-secondary);margin-top:4px}.cr-acad b{color:var(--gold);letter-spacing:1px;font-weight:400}.cr-acad .cr-stars{font-size:12px;vertical-align:-2px}
.cr-why{font-size:12.5px;color:var(--text-secondary);line-height:1.4;margin-top:4px}
.cr-dream{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cr-rk-tabs{margin:2px 0 12px}.cr-rk-tabs .cr-chip{padding:9px 4px;font-size:14px}
.cr-body-up{color:var(--green);font-weight:600}.cr-body-dn{color:var(--loss);font-weight:600}
.cr-fit{display:inline-block;margin:2px 0 6px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.cr-fit.good{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}.cr-fit.bad{color:var(--loss);background:color-mix(in srgb,var(--loss) 12%,transparent)}
.cr-flag{width:20px;height:14px;object-fit:cover;border-radius:2px;vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 1px var(--overlay-18)}
.cr-rc-row.nat .a .cr-flag{margin:0}
.cr-dd{position:relative}
.cr-dd-btn{display:flex;align-items:center;width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--border-bright);border-radius:10px;padding:11px;cursor:pointer;text-align:left}
.cr-dd-btn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-dd-btn i{font-style:normal;font-size:15px;color:var(--text-secondary);margin-left:6px}
.cr-dd .ph{color:var(--text-secondary)}
.cr-dd-list{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);max-height:300px;overflow:auto;background:var(--surface2);border:1px solid var(--border-bright);border-radius:10px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.cr-dd.up .cr-dd-list{top:auto;bottom:calc(100% + 4px);box-shadow:0 -8px 24px rgba(0,0,0,.35)}
.cr-dd-list button{display:flex;align-items:center;width:100%;font:inherit;font-size:15px;color:var(--text);background:none;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;text-align:left}
.cr-dd-list button:hover,.cr-dd-list button[aria-selected="true"]{background:color-mix(in srgb,var(--red) 14%,transparent)}
.cr .cr-dream select:disabled,.cr-dd-btn:disabled{opacity:.5;cursor:default}
.cr-dd-btn .cr-crest,.cr-dd-list .cr-crest,.cr-dd-btn .cr-crest-img,.cr-dd-list .cr-crest-img{margin-right:8px;flex:none}
.cr-f2{display:grid;grid-template-columns:1fr 110px;gap:12px}
.cr-f2>div{display:flex;flex-direction:column;gap:10px;min-width:0}
.cr-sub-age{color:var(--gold);font-weight:700}
.cr-dock{position:sticky;bottom:calc(56px + var(--safe-bottom));z-index:5;margin:0 -16px -16px;background:var(--chrome-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border-bright);padding:12px 16px;display:flex;gap:10px;align-items:center}
.cr-dock .sum{flex:none;font-size:12px;color:var(--text-secondary);line-height:1.3}
.cr-dock .sum b{display:block;font-family:var(--fd);font-size:24px;color:var(--gold);font-weight:400;line-height:1}
.cr-dock .gm-btn{flex:1}
.cr-dock .gm-btn.ghost{flex:0 0 32%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:8px;padding-right:8px}
@media (min-width:900px){.cr-dock{bottom:0}}   /* 모바일 56px = 하단 탭 높이(실측). PC는 탭이 사이드바라 0 */
/* 게임 모드(모바일): 하단 탭을 아래로 내려 숨기고, 탭 자리만큼 띄워 둔 여백·하단 독도 같이 내린다. 나가면 거꾸로 스르륵 올라온다. */
@media (max-width:899px){
  .bottom-nav{transition:transform .3s ease}
  body{transition:padding-bottom .3s ease}
  .cr-dock{transition:bottom .3s ease}
  body.game-mode{padding-bottom:var(--safe-bottom)}
  body.game-mode .bottom-nav{transform:translateY(100%);pointer-events:none}
  body.game-mode .cr-dock{bottom:var(--safe-bottom)}
  /* 내용이 화면보다 짧으면 하단 독이 내용 끝에 떠 있고 그 아래가 비어 보인다(예전엔 하단 탭이 그 자리를 가렸다) —
     커리어 화면(하단 독 있음)일 때만 세로로 채워 독을 화면 맨 아래에 붙인다. */
  body.game-mode:has(#gameRoot > .cr-dock){display:flex;flex-direction:column}
  body.game-mode:has(#gameRoot > .cr-dock) .page{flex:1;display:flex;flex-direction:column;width:100%}
  body.game-mode #games.active:has(#gameRoot > .cr-dock){flex:1;display:flex;flex-direction:column;width:100%;box-sizing:border-box}
  body.game-mode #gameRoot:has(> .cr-dock){flex:1;display:flex;flex-direction:column}
  body.game-mode #gameRoot > .cr{flex:1}
}

.cr-type-st i.g{background:linear-gradient(90deg,var(--gold) var(--v),var(--surface3) var(--v))}
.cr-type-st b{text-align:right;font-variant-numeric:tabular-nums}

/* 3페이지 구단 · 이적시장 */
.cr-me{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:var(--surface);border:1px solid var(--border-bright);border-radius:14px;padding:12px}

/* 능력치 5칸 타일 */
.cr-hc-st{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cr-hc-st>div{background:rgba(0,0,0,.18);border-radius:8px;padding:6px 4px 6px;text-align:center;min-width:0}

.cr-hc-st u.up{background:#4ADE80;border-radius:0 2px 2px 0;transform-origin:left center;min-width:4px;box-shadow:0 0 6px rgba(74,222,128,.8)}

@media (prefers-reduced-motion: reduce){.cr-hc-st u.up.grow,.cr-hc-st u.dn.fade{animation:none}}

.cr-stars{display:inline-flex;align-items:center;gap:1px;color:#E9C766;letter-spacing:0;vertical-align:-.5px}.cr-stars .cr-icon{width:1em;height:1em;min-width:1em;vertical-align:0}.cr-stars .off{opacity:.38}

.cr-hof{--fg2:rgba(255,255,255,.66);--ln:rgba(255,255,255,.12);--gd:#E9C766;--bx:rgba(255,255,255,.035);--bd:rgba(150,180,255,.22);border-radius:20px;padding:12px;color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}

.cr-hof-big>div{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}.cr-hof-big>div+div{border-left:1px solid var(--ln)}

.cr-hof-big .cup{color:var(--gd);display:flex}.cr-hof-big .cup svg{width:22px;height:22px}
