<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>대표팀 경기 중계</title><style>
:root{--gold:#C8A84B;--text:#F0F2F7;--on-dark-header:#F0F2F7;--on-dark-header-secondary:#b5bbc4;--border-bright:#31404b}[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#070a10;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}main{width:min(100%,540px);margin:auto;min-height:100svh;padding:26px 18px;position:relative;isolation:isolate;background:none}main::before{content:'';position:absolute;inset:0;z-index:-2;background:url(overlay-worldcup.webp) center/cover no-repeat;image-rendering:pixelated}main::after{content:'';position:absolute;inset:0;z-index:-1;background:#0008}header{text-align:center}.eyebrow{color:var(--gold);letter-spacing:2px;font-size:11px;font-weight:800}h1{font-size:26px;margin:8px 0}header p{color:var(--on-dark-header-secondary);font-size:12px;margin:0}.stages{display:flex;gap:5px;margin:22px 0 16px}.stages div{flex:1;text-align:center;border:1px solid var(--border-bright);border-radius:9px;padding:9px 0;font-size:11px;color:var(--on-dark-header-secondary)}.stages b{display:block;margin-bottom:5px}.stages .active{color:var(--gold);border-color:var(--gold)}.stages .done{color:#22c55e;border-color:#22c55e66}.controls{display:flex;gap:8px;margin-top:18px}button,select{font:inherit}.controls button{border:0;border-radius:12px;background:#EF0107;color:var(--text);padding:14px;flex:1;font-weight:800}.controls select{background:#121a24;border:1px solid var(--border-bright);border-radius:12px;color:var(--text);padding:10px}.note{font-size:12px;color:var(--on-dark-header-secondary);line-height:1.7;text-align:center;margin-top:16px}button:disabled{opacity:.5}@media(min-width:700px){body{padding:24px}main{min-height:0;border:1px solid var(--border-bright);border-radius:26px}}
</style></head><body><main><header><div class="eyebrow">FIFA WORLD CUP 2030</div><h1>월드컵 본선</h1><p>🇰🇷 대한민국 · 김도윤 #10</p></header><div class="stages"><div class="done"><b>조별</b>통과</div><div class="done"><b>32강</b>2–0</div><div class="active"><b>16강</b>진행 중</div><div><b>8강</b>—</div><div><b>4강</b>—</div><div><b>결승</b>—</div></div><div id="match"></div><div class="controls"><select id="role" aria-label="선수 역할"><option value="FW:0">윙어</option><option value="FW:1">인사이드 포워드</option><option value="FW:2" selected>포처</option><option value="MF:4">수비형 미드필더</option><option value="MF:1">공격형 미드필더</option><option value="DF:3">풀백</option><option value="DF:4">윙백</option><option value="DF:5">인버티드 풀백</option><option value="DF:0">센터백</option></select><select id="foot" aria-label="주발"><option>오른발</option><option>왼발</option></select></div><p class="note">포지션에 맞는 득점 패턴만 선택할 수 있습니다.</p><div class="controls"><select id="pattern" aria-label="골 패턴 비교"><option value="">여러 패턴 자동</option><option value="combine">원투패스</option><option value="through">스루패스 · 일대일</option><option value="counter">빠른 역습</option><option value="wing">측면 크로스</option><option value="cutback">골라인 컷백</option><option value="longshot">중거리 슛</option><option value="switch">반대편 전환 · 크로스</option><option value="lowcross">낮은 크로스</option><option value="corner">코너킥 헤더</option><option value="rebound">세트피스 세컨볼 마무리</option><option value="farcut">긴 크로스 수신 · 안쪽 돌파</option><option value="halfspace">연계 · 하프스페이스 침투</option><option value="dribble">드리블 돌파</option><option value="chip">골키퍼 넘기는 칩슛</option><option value="freekick">프리킥 감아차기</option><option value="shortcorner">짧은 코너킥 · 헤더</option></select></div><div class="controls" hidden><select id="recovery" aria-label="세컨볼 마무리 방식"><option value="">세컨볼 방식 자동</option><option value="edge-first">박스 밖 바로 슈팅</option><option value="edge-control">컨트롤 · 옆으로 터치 후 슛</option><option value="tap">골문 앞 원터치</option><option value="layoff">압박받으면 빈 동료에게 연결</option></select></div><div class="controls"><select id="sample" aria-label="확인할 경기"><option value="win">2 : 1 승리</option><option value="loss">0 : 2 패배</option><option value="draw">0 : 0 승부차기</option></select><button id="again">다른 장면 재생</button></div><p class="note" id="note">내 선수는 금색으로 표시됩니다.<br>득점·실점 장면만 재생합니다.<br>패턴 선택으로 원투·침투·역습·크로스·컷백을 비교할 수 있습니다.</p></main>
<script>globalThis.CareerMatchAssetRoot='../../../arsenal-dashboard/public/img/career-match/';</script><script src="../../../arsenal-dashboard/public/career/match-playback.js"></script><script>
let replay,replayVariation=0;const samples={win:{stage:'16강',opp:'NED',played:true,our:2,their:1,g:1,a:1},loss:{stage:'16강',opp:'NED',played:true,our:0,their:2,g:0,a:0},draw:{stage:'16강',opp:'NED',played:true,our:0,their:0,g:0,a:0,pk:{pending:true}}};
async function start(){replay?.destroy();const [pos,card]=document.getElementById('role').value.split(':'),role=CareerMatchReplay.playerRole({pos,card:Number(card),foot:document.getElementById('foot').value}),allowed=CareerMatchReplay.finishOptions(role),select=document.getElementById('pattern');Array.from(select.options).forEach(o=>o.disabled=!!o.value&&(allowed?!allowed.some(p=>p.pattern===o.value):o.value==='farcut'));if(select.selectedOptions[0].disabled)select.value=allowed?allowed[0].pattern:'';const recovery=document.getElementById('recovery'),deep=['풀백','윙백','인버티드 풀백','센터백','볼플레잉 센터백','스위퍼','수비형 미드필더','딥라잉 플레이메이커'].includes(role.name);recovery.parentElement.hidden=select.value!=='rebound';Array.from(recovery.options).forEach(o=>o.disabled=!!o.value&&!(deep?['edge-first','edge-control']:['tap','layoff']).includes(o.value));if(recovery.selectedOptions[0].disabled)recovery.value='';replay=CareerMatchReplay.create(document.getElementById('match'),{nation:'KOR',opp:'NED',pos,card:Number(card),foot:document.getElementById('foot').value,number:10,previewPattern:document.getElementById('pattern').value,previewReboundStyle:document.getElementById('recovery').value,player:'김도윤',ourName:'대한민국',theirName:'네덜란드',ourFlag:'🇰🇷',theirFlag:'🇳🇱'});const chip=document.querySelector('.stages .active')||document.querySelector('.stages div:nth-child(3)');chip.className='active';chip.innerHTML='<b>16강</b>진행 중';document.getElementById('again').disabled=false;document.getElementById('sample').disabled=!!document.getElementById('pattern').value;document.getElementById('note').textContent='골 하이라이트 재생 중';const result=await replay.play(document.getElementById('pattern').value?{stage:'16강',opp:'NED',played:true,our:1,their:0,g:1,a:0}:samples[document.getElementById('sample').value],{year:2030,replayVariation:replayVariation++});if(!result.cancelled){document.getElementById('again').disabled=false;chip.className=result.plan.our>result.plan.their?'done':'active';chip.innerHTML='<b>16강</b>'+result.plan.our+'–'+result.plan.their;document.getElementById('note').textContent=result.plan.end===120?'연장 종료 · 승부차기':'경기 종료 · '+result.plan.our+' : '+result.plan.their;}}
document.getElementById('again').onclick=start;document.getElementById('sample').onchange=start;document.getElementById('pattern').onchange=start;document.getElementById('role').onchange=start;document.getElementById('foot').onchange=start;document.getElementById('recovery').onchange=start;start();
</script></body></html>
