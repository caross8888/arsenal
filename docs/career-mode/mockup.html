<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>커리어 모드 목업</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--red:#EF0107;--red-dark:#b50004;--gold:#C8A84B;--navy:#0B0D12;--surface:#111318;--surface2:#181B22;--surface3:#1F2330;
--border-bright:rgba(255,255,255,.15);--border-accent:rgba(200,168,75,.3);--text:#F0F2F7;--text-secondary:rgba(255,255,255,.75);--text-dim:#4A5070;
--green:#22C55E;--amber:#F59E0B;--loss:#EF4444;--fd:'Bebas Neue',sans-serif;--fb:'Noto Sans KR',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--navy);color:var(--text);font-family:var(--fb);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.wrap{max-width:600px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between}
.back{background:none;border:0;color:var(--text-secondary);font:inherit;font-size:13px;cursor:pointer;padding:2px 0}
.steps{display:flex;gap:6px}
.steps i{width:22px;height:4px;border-radius:2px;background:var(--surface3)}
.steps i.on{background:var(--red)}
h1{font-family:var(--fd);font-size:34px;letter-spacing:1px;margin:0;line-height:1}
h1 span{color:var(--red)}
.sub{font-size:13px;color:var(--text-secondary);margin:-6px 0 0}
.panel{background:var(--surface);border:1px solid var(--border-bright);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:12px;color:var(--text-secondary);display:flex;justify-content:space-between;align-items:center}
.lbl b{color:var(--text);font-weight:700;font-size:14px}
input[type=text],input[type=number],select{font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--border-bright);border-radius:10px;padding:11px;width:100%}
.row{display:flex;gap:8px}
.row>input{flex:1;min-width:0}
.chip{font:inherit;font-size:13px;color:var(--text);background:var(--surface2);border:1px solid var(--border-bright);border-radius:999px;padding:8px 12px;cursor:pointer;white-space:nowrap;user-select:none}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:6px}
.seg .chip{border-radius:10px;padding:11px;text-align:center}
.age{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-secondary)}
.age b{font-family:var(--fd);font-size:26px;color:var(--gold);font-weight:400;line-height:1}
.nums{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.nums button{font-family:var(--fd);font-size:17px;color:var(--text);background:var(--surface2);border:1px solid transparent;border-radius:7px;padding:6px 0;cursor:pointer}
.nums button[aria-pressed=true]{background:var(--red);color:#fff}
.btn{font:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--red);border:0;border-radius:12px;padding:15px;width:100%;cursor:pointer}
.btn:disabled{background:var(--surface3);color:var(--text-dim);cursor:default}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(11,13,18,.96);border-top:1px solid var(--border-bright);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center}
.dock .sum{flex:none;font-size:12px;color:var(--text-secondary);line-height:1.3}
.dock .sum b{display:block;font-family:var(--fd);font-size:24px;color:var(--gold);font-weight:400;line-height:1}
.note{font-size:11.5px;color:var(--text-secondary);line-height:1.6;margin:0}
.mock{font-size:11px;color:var(--amber);border:1px dashed rgba(245,158,11,.5);border-radius:8px;padding:6px 10px;line-height:1.5}

/* 2페이지 카드 */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{font:inherit;text-align:left;color:var(--text);background:var(--surface2);border:1.5px solid var(--border-bright);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.card:active{transform:scale(.98)}
.card[aria-pressed=true]{border-color:var(--gold);background:rgba(200,168,75,.1)}
.card .t{font-weight:700;font-size:15px}
.card .d{font-size:11.5px;color:var(--text-secondary);line-height:1.45;min-height:33px}
.wbar{display:grid;grid-template-columns:42px 1fr 30px;align-items:center;gap:6px;font-size:10.5px;color:var(--text-secondary)}
.wbar i{height:5px;border-radius:3px;background:var(--surface3);position:relative;overflow:hidden}
.wbar i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--c,var(--gold));border-radius:3px}
.wbar span{text-align:right;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:76px 1fr 40px;align-items:center;gap:8px}
.stat .n{font-size:13px;font-weight:700}
.stat .n small{display:block;font-weight:400;font-size:10.5px;color:var(--gold)}
.stat .bar{height:8px;border-radius:4px;background:var(--surface3);position:relative;overflow:hidden}
.stat .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--text-secondary);border-radius:4px}
.stat .bar i.add{background:var(--gold)}
.stat button{font:inherit;font-size:18px;line-height:1;color:var(--text);background:var(--surface2);border:1px solid var(--border-bright);border-radius:8px;height:32px;cursor:pointer}
.stat button:disabled{color:var(--text-dim);cursor:default}
.stat .v{font-family:var(--fd);font-size:22px;text-align:right}
.ovr{display:flex;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:12px;padding:10px 14px}
.ovr .big{font-family:var(--fd);font-size:44px;color:var(--gold);line-height:1}
.pts{font-size:13px;color:var(--text-secondary)}
.pts b{color:var(--text);font-size:16px}

/* 3페이지 구단 */
.me{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;background:var(--surface);border:1px solid var(--border-bright);border-radius:14px;padding:12px}
.me .v{font-family:var(--fd);font-size:28px;color:var(--gold);line-height:1.1}
.me .l{font-size:11px;color:var(--text-secondary)}
.club{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;font:inherit;color:var(--text);background:var(--surface);border:1.5px solid var(--border-bright);border-radius:14px;padding:12px;cursor:pointer;width:100%}
.club[aria-pressed=true]{border-color:var(--gold);background:rgba(200,168,75,.08)}
.crest{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:18px;color:#fff}
.club .nm{font-weight:700;font-size:15px}
.club .meta{font-size:11.5px;color:var(--text-secondary);margin-top:2px}
.club .tag{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:.5px}
.rep{text-align:right}
.rep .r{font-family:var(--fd);font-size:24px;line-height:1}
.chance{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;display:inline-block;margin-top:3px}
.chance.low{color:var(--loss);background:rgba(239,68,68,.14)}
.chance.mid{color:var(--amber);background:rgba(245,158,11,.14)}
.chance.high{color:var(--green);background:rgba(34,197,94,.14)}
.grow{display:flex;gap:4px;margin-top:6px;align-items:center;font-size:10.5px;color:var(--text-secondary)}
.grow i{width:10px;height:5px;border-radius:2px;background:var(--surface3)}
.grow i.on{background:var(--green)}
.list{display:flex;flex-direction:column;gap:8px}
.season-no{font-family:var(--fd);font-size:20px;letter-spacing:1px;color:var(--text-secondary)}
.hc{background:linear-gradient(135deg,#c40004 0%,#3a0102 100%);border-radius:16px;padding:14px;color:#fff;display:flex;flex-direction:column;gap:12px}
.hc-top{display:flex;align-items:center;gap:12px}
.hc-n{font-size:19px;font-weight:700;line-height:1.2}
.hc-n span{font-family:var(--fd);font-weight:400;color:var(--gold);font-size:20px}
.hc-s{font-size:12px;color:rgba(255,255,255,.75);margin-top:2px}
.hc-o{text-align:center;line-height:1}
.hc-o b{display:block;font-family:var(--fd);font-size:44px;font-weight:400;color:var(--gold)}
.hc-o span{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.75)}
.hc-st{display:grid;gap:5px}
.hc-st>div{display:grid;grid-template-columns:62px 1fr 26px;align-items:center;gap:8px;font-size:11.5px}
.hc-st span{color:rgba(255,255,255,.8)}
.hc-st i{height:5px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden}
.hc-st em{display:block;height:100%;background:#fff;border-radius:3px;transition:width .5s}
.hc-st b{text-align:right;font-variant-numeric:tabular-nums}
.loanc{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;margin-top:10px;background:var(--surface2);border-radius:10px;padding:10px}
.rs{display:grid;grid-template-columns:repeat(5,1fr);text-align:center}
.rs b{display:block;font-family:var(--fd);font-size:26px;font-weight:400;line-height:1.1}
.rs span{font-size:11px;color:var(--text-secondary)}
.dovr{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-secondary)}
.dovr b{font-family:var(--fd);font-size:24px;font-weight:400;color:var(--text);flex:1}
.dovr em{font-style:normal;font-family:var(--fd);font-size:26px}
.dovr.up em{color:var(--green)} .dovr.down em{color:var(--loss)}
.dst{display:flex;flex-wrap:wrap;gap:6px}
.dst span{font-size:12px;border-radius:999px;padding:4px 10px;background:var(--surface2);color:var(--text-secondary)}
.dst span.up{color:var(--green);background:rgba(34,197,94,.12)} .dst span.down{color:var(--loss);background:rgba(239,68,68,.12)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.badges span{font-size:12.5px;font-weight:700;border-radius:999px;padding:5px 11px;background:rgba(200,168,75,.15);color:var(--gold)}
.badges span.nt{background:rgba(34,197,94,.13);color:var(--green)}
.badges span.s{outline:1.5px solid var(--gold)}
.badges span.aw{background:rgba(96,165,250,.15);color:#60A5FA}
.notes{margin:0;padding-left:18px;font-size:13px;line-height:1.7;color:var(--text-secondary)}
.hist summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;font-size:14px}
.hist summary span{font-size:12px;color:var(--text-secondary)}
.hist summary::-webkit-details-marker{display:none}
.hrow{display:grid;grid-template-columns:34px 1fr 36px 30px 34px 34px;gap:6px;font-size:12.5px;padding:6px 2px;border-top:1px solid rgba(255,255,255,.06);font-variant-numeric:tabular-nums}
.hrow span:not(:nth-child(2)){text-align:right} .hrow span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow.h{color:var(--text-secondary);font-size:11px;border-top:0}
.mockbtn{align-self:center;border-style:dashed;color:var(--amber);border-color:rgba(245,158,11,.5);background:none}
.btn.ghost2{background:var(--surface2);border:1px solid var(--border-bright);color:var(--text);flex:0 0 32%}
.done2{text-align:center}
.score{margin-top:6px;background:rgba(0,0,0,.25);border-radius:12px;padding:10px;display:flex;justify-content:space-between;align-items:center}
.score span{font-size:12px;color:rgba(255,255,255,.8)} .score b{font-family:var(--fd);font-size:34px;font-weight:400;color:var(--gold)}
.lg{display:grid;grid-template-columns:100px 1fr 46px;gap:8px;align-items:center;font-size:12.5px}
.lg i{height:6px;border-radius:3px;background:var(--surface3);overflow:hidden} .lg em{display:block;height:100%;background:var(--red)}
.lg b{text-align:right;color:var(--text-secondary);font-weight:400}
.rc-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:stretch}
.rc-ovr{background:linear-gradient(160deg,#E9C766,#B8892E);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3a2a06;min-width:78px}
.rc-ovr.elite{background:linear-gradient(160deg,#FFE7A0,#D9A93E 60%,#B8892E);box-shadow:0 0 18px rgba(233,199,102,.35)}
.rc-ovr span{font-size:10px;font-weight:700;letter-spacing:.5px;opacity:.75}
.rc-ovr b{font-family:var(--fd);font-size:52px;font-weight:400;line-height:.95}
.rc-id{background:var(--surface);border:1px solid var(--border-bright);border-radius:16px;padding:10px 12px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.rc-chips{display:flex;gap:5px;flex-wrap:wrap}
.rc-chip{font-size:11px;font-weight:700;background:var(--surface3);border-radius:999px;padding:3px 8px}
.rc-chip.gold{background:rgba(200,168,75,.2);color:var(--gold)}
.rc-name{font-size:20px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-sub{font-size:11.5px;color:var(--text-secondary)}
.rc-meta{display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:right}
.rc-meta span{display:block;font-size:10px;color:var(--text-secondary);letter-spacing:.3px}
.rc-meta b{font-family:var(--fd);font-size:24px;font-weight:400;line-height:1}
.rc-table{display:flex;flex-direction:column;gap:4px}
.rc-row{display:grid;grid-template-columns:34px minmax(0,1fr) 38px 34px 30px 30px;gap:6px;align-items:center;background:var(--surface);border-radius:10px;padding:6px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.rc-row>span:nth-child(n+4){text-align:right}
.rc-row.hd{background:none;padding:0 8px;font-size:10.5px;color:var(--text-secondary);letter-spacing:.3px}
.rc-row.youth{opacity:.6}
.rc-row.ars{background:linear-gradient(90deg,rgba(239,1,7,.18),var(--surface) 70%)}
.rc-row .age{display:inline-flex;justify-content:center;align-items:center;height:22px;border-radius:999px;background:var(--text);color:var(--navy);font-weight:700;font-size:12.5px}
.rc-row.ars .age{background:var(--red);color:#fff}
.rc-row.nat .age{background:none;font-size:18px}
.rc-row .rcc{display:flex;align-items:center;gap:7px;min-width:0}
.rc-row .rcc .crest{flex:none;font-size:11px}
.rc-row .rcc em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rc-row .rcc small{font-size:10px;color:var(--amber)}
.rc-row .ic{display:flex;gap:1px;flex:none;font-size:12px}
.rc-row .ic i{font-style:normal}
.rc-row .ic b{font-size:10px;color:var(--text-secondary);margin-left:2px;align-self:center}
.rc-row .ic i.ucl,.rc-tro .i.ucl{filter:drop-shadow(0 0 3px rgba(96,165,250,.9))}
.rc-row .ovr{display:inline-flex;justify-content:center;height:22px;align-items:center;border-radius:6px;font-family:var(--fd);font-size:17px;color:#3a2a06;background:#D9B24C}
.rc-row .ovr.e{background:linear-gradient(160deg,#C9E6FF,#7DB7F2);color:#0b2440}
.rc-row .ovr.n{background:var(--surface3);color:var(--text)}
.rc-row .ovr.y{background:none;color:var(--text-secondary)}
.rc-end{background:var(--surface);border:1px solid var(--border-bright);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.rc-end-t{text-align:center;font-size:20px;font-weight:700}
.rc-tot{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface2);border-radius:12px;padding:10px 0;text-align:center}
.rc-tot>div+div{border-left:1px solid rgba(255,255,255,.08)}
.rc-tot span{display:block;font-size:10.5px;color:var(--text-secondary)}
.rc-tot b{font-family:var(--fd);font-size:28px;font-weight:400}
.rc-score{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.rc-score span{font-size:12px;color:var(--text-secondary)} .rc-score b{font-family:var(--fd);font-size:30px;font-weight:400;color:var(--gold)}
.rc-shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rc-tro{text-align:center;background:var(--surface2);border-radius:12px;padding:10px 4px 8px}
.rc-tro.tS{background:radial-gradient(circle at 50% 30%,rgba(233,199,102,.28),var(--surface2) 70%);outline:1px solid rgba(200,168,75,.5)}
.rc-tro .i{position:relative;display:inline-block;height:58px}
.rc-tro .i svg{display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.rc-row .ic svg{display:block}
.badges span.mi{display:inline-flex;align-items:center;gap:4px}
.rc-tro .i em{position:absolute;right:-12px;bottom:6px;font-style:normal;font-size:11px;font-weight:700;background:var(--gold);color:#3a2a06;border-radius:999px;padding:0 5px}
.rc-tro .l{font-size:10.5px;color:var(--text-secondary);line-height:1.3;margin-top:5px;word-break:keep-all}
.rc-minor summary{cursor:pointer;font-size:12.5px;color:var(--text-secondary);text-align:center;list-style:none}
.rc-minor summary::-webkit-details-marker{display:none}
.rc-minor .badges{margin-top:8px}
.lg2{display:grid;grid-template-columns:1fr auto 70px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.lg2 b{font-weight:400;color:var(--text-secondary)} .lg2 em{font-style:normal;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.lg2 em.up{color:var(--green)} .lg2 em.down{color:var(--loss)}
.hidden{display:none!important}
.done{text-align:center}
.done .big{font-family:var(--fd);font-size:40px;color:var(--gold)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="dock"><div class="in" id="dock"></div></div>

<script>
// ── 목업 데이터 ─────────────────────────────────────────────────────────
var NATIONS=[
 {id:'ENG',n:'잉글랜드',f:'🏴'},{id:'ESP',n:'스페인',f:'🇪🇸'},{id:'GER',n:'독일',f:'🇩🇪'},{id:'ITA',n:'이탈리아',f:'🇮🇹'},
 {id:'FRA',n:'프랑스',f:'🇫🇷'},{id:'POR',n:'포르투갈',f:'🇵🇹'},{id:'NED',n:'네덜란드',f:'🇳🇱'},{id:'BEL',n:'벨기에',f:'🇧🇪'},
 {id:'BRA',n:'브라질',f:'🇧🇷'},{id:'ARG',n:'아르헨티나',f:'🇦🇷'},{id:'NOR',n:'노르웨이',f:'🇳🇴'},{id:'KOR',n:'대한민국',f:'🇰🇷'},
 {id:'JPN',n:'일본',f:'🇯🇵'},{id:'USA',n:'미국',f:'🇺🇸'},{id:'NGA',n:'나이지리아',f:'🇳🇬'}];
// 구단 명성(1~100) — 실제 구현 때는 국가별 6~10개로 늘린다. c: 엠블럼 대신 쓰는 색
var CLUBS={

  // 카드의 성장 가중치에 비례해 보너스 50을 나눈다(강점과 약점이 확실히 갈리도록 가중치에서 0.7을 뺀 값 기준).
  var w=CARDS[S.pos][S.card].w, adj=w.map(function(x){ return Math.max(0.05,x-0.7); }), tot=adj.reduce(function(a,b){return a+b;},0);
  S.add=adj.map(function(x){ return Math.min(MAXADD,Math.floor(POOL*x/tot)); });
  var order=w.map(function(x,j){return j;}).sort(function(a,b){return w[b]-w[a];}), i=0;

// ── 3페이지: 첫 구단(유스) 선택 ───────────────────────────────────────
// 내 명성 = 오버롤 기반(+활약 보너스는 시즌이 지나며 붙는다). 15세는 유스 기준이라 구단 명성에서 30을 빼고 비교한다.
var YOUTH_GAP=30;
function myRep(){ return ovr()+5; }
function chanceOf(clubRep){
  var gap=(clubRep-YOUTH_GAP)-myRep();
  var p=1/(1+Math.exp(gap/7));   // 0 차이 ≈ 50%, +20 ≈ 5%, -20 ≈ 95%
  return {p:p, k:p<0.3?'low':p<0.65?'mid':'high', t:p<0.3?'출전 기회 낮음':p<0.65?'출전 기회 보통':'출전 기회 높음'};
}
// 첫 구단은 자국 구단 3곳: 도전(명성 높음) / 적정(내 명성과 비슷) / 안정(명성 낮음)
function offers(){
  if(S._offers) return S._offers;
  var me=myRep()+YOUTH_GAP;
  var home=(CLUBS[S.nation]||[]).slice().sort(function(a,b){ return b[1]-a[1]; });   // 명성 높은 순
  var mid=0; home.forEach(function(c,i){ if(Math.abs(c[1]-me)<Math.abs(home[mid][1]-me)) mid=i; });
  // 가운데를 기준으로 위·아래 한 칸씩. 끝에 걸리면 반대쪽으로 밀어서 늘 세 곳을 채운다.
  mid=Math.max(1,Math.min(home.length-2,mid));
  var out=[{c:home[mid-1],kind:'도전'},{c:home[mid],kind:'적정'},{c:home[mid+1],kind:'안정'}].filter(function(o){ return o.c; });
  out.forEach(function(o){ o.nation=S.nation; });
  return (S._offers=out);
}

function hashStr(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }

  if(ev.id==='coach' && pick===0){ growMul*=1.08; notes.push('개인 트레이너와 훈련한 효과가 있었어요.'); }
  if(ev.id==='extra' && pick===0){ growMul*=1.08; }
  if(ev.id==='weak'){
    if(pick===0){ growMul*=0.92; if(rng()<0.75){ C.wf++; notes.push('약발 훈련 성과! 약발이 '+stars(C.wf,true)+'이 됐어요.'); } else notes.push('약발 훈련을 했지만 아직 몸에 익지 않았어요.'); }
    else growMul*=1.03;
  }
  if(ev.id==='tour'){ if(pick===0){ startAdj+=0.06; injRisk+=0.07; } else injRisk-=0.05; }
  if(ev.id==='media'){ if(pick===0){ C.fame+=1; } }

  var row0Youth=youth()&&!onLoan;

  var p=pStart(club,startAdj);

  if(injured) notes.push('부상으로 '+injured+'경기를 결장했어요.');
  var avail=games-injured;
  var starts=Math.max(0,Math.min(avail,Math.round(avail*p*(0.8+rng()*0.4))));

  var apps=starts+subs;
  var o=cOvr();
  // 골·도움은 오버롤이 아니라 관련 스탯으로 계산한다(스탯 순서는 STATS와 같음).
  //  공격수 [결정력,드리블,스피드,오프더볼,패스] / 미드 [패스,시야,볼키핑,체력,태클] / 수비 [태클,대인마크,공중볼,스피드,빌드업]
  var FX={FW:{g:[.5,.2,0,.3,0], a:[0,.3,.2,0,.5]},
          MF:{g:[0,.3,.4,.3,0],  a:[.5,.5,0,0,0]},

  var effG=FX.g.reduce(function(t,w,i){return t+w*C.st[i];},0), effA=FX.a.reduce(function(t,w,i){return t+w*C.st[i];},0);
  // 팀 계수: 강팀일수록 찬스가 많다(구단 명성 50 → ×0.8, 95 → ×1.2)
  var teamF=Math.max(0.8,Math.min(1.2,0.8+0.4*(club.r-50)/45));
  // 카드 보정은 스탯 차이와 겹치지 않게 제곱근으로 줄여서 쓴다
  var cardG=Math.sqrt({'포처':1.35,'타깃맨':1.15,'윙어':0.8,'펄스나인':0.85,'공격형 미드필더':1.4,'메짤라':1.2,'수비형 미드필더':0.5,'윙백':1.3,'인버티드 풀백':1.2}[card.n]||1);
  var cardA=Math.sqrt({'윙어':1.5,'펄스나인':1.5,'공격형 미드필더':1.4,'딥라잉 플레이메이커':1.2,'윙백':1.6,'풀백':1.3,'포처':0.6}[card.n]||1);
  // 약발: ★2가 기준, 한 칸마다 골·도움 +4%(★5면 +12%). 공격수·미드필더만.

  var aRate=wfF*{FW:0.18,MF:0.17,DF:0.06}[C.pos]*Math.pow(effA/75,2)*cardA*teamF;
  var minsEq=starts+subs*0.3;
  // 커리어 하이 시즌: 1군 시즌에 2% 확률로 골·도움 ×1.6
  var hot=!row0Youth && starts>=15 && rng()<0.02;
  var goals=Math.round(minsEq*gRate*(0.7+rng()*0.6)*(hot?1.6:1)), ast=Math.round(minsEq*aRate*(0.7+rng()*0.6)*(hot?1.6:1));
  // 클린시트: 선발 경기 중 무실점. 팀이 강할수록, 내가 구단보다 잘할수록 늘어난다(수비수 커리어 점수에 쓴다).
  var pCS=Math.max(0.05,Math.min(0.6,0.12+0.35*(club.r-50)/45+(o-75)/150));
  var cs=row0Youth?Math.round(starts*pCS*0.8):Math.round(starts*pCS*(0.85+rng()*0.3));
  if(hot) notes.unshift('🔥 커리어 하이 시즌! 뭘 차도 들어갔어요.');
  // 평점: 내 실력(오버롤) 기준 + 팀 안에서의 위치(구단보다 잘하면 +) + 골·도움 + 운
  var clubLv=club.r-(youth()&&!onLoan?YOUTH_GAP:0);
  // 평점의 활약 보너스는 포지션마다 다른 지표로 — 공격수 골·도움 / 미드필더 도움 비중 ↑ / 수비수 클린시트
  var ap=Math.max(apps,1), perfBonus={FW:(goals+ast*0.6)/ap*0.5, MF:(goals*1.5+ast*1.2)/ap*0.6,
      DF:cs/Math.max(starts,1)*0.6+(goals*2+ast*1.5)/ap*0.6}[C.pos];
  var rating=apps?Math.max(5.6,Math.min(8.9,6.45+(o-70)/17+(o-clubLv)/40+perfBonus+(rng()-0.5)*0.5)):0;

  // 성장 / 하락
  var base=(window.__AB||AGE_BASE)[Math.min(37,C.age)], ratio=starts/Math.max(1,games), luck=0.8+rng()*0.4;
  if(row0Youth){ if(ev.id==='extra'&&pick===0) C.youthPts++; if(ratio>=0.6) C.youthPts++; }
  if(C.age>=18 && !C.awoken){
    var tr=mulberry(C.seed ^ hashStr('talent'))(), b=Math.min(6,C.youthPts);
    var pG=0.02+b*0.0017, pW=pG+0.08+b*0.005, pP=pW+0.20;   // 세대급 2~3% / 원더키드 8~11% / 유망주 20%
    var TM=window.__TM||[1.6,1.3,1.12]; C.talent = tr<pG?TM[0] : tr<pW?TM[1] : tr<pP?TM[2] : 1.0;
    C.awoken=true;
  }
  // 성장 포인트(스탯 합계 기준) = 나이 기본값×5 × 출전 × 구단 × 운 × 이벤트 × 0.75
  // 스탯마다 따로 감쇠(99에 가까울수록 덜 오르지만 최소 50%는 오름 — 그래서 99에 닿을 수 있다).
  // 99에 막힌 스탯 몫은 나머지 스탯으로 넘겨서 성장분이 버려지지 않게 한다.
  var st=STATS[C.pos], w=card.w, before=C.st.slice();
  if(base>0){
    // 오버롤 성장: 나이 기본값 × 출전 × 구단 × 운 × 이벤트 × 숨은 재능 × K × 감쇠(99에 가까울수록 느려지지만 최소 절반 속도)
    var DP=window.__D||[0.6,30]; var dmp=Math.min(1,Math.max(DP[0],(99-C.ovr)/DP[1]));
    C.ovr=Math.min(99,C.ovr+C.boost*base*(0.4+0.9*ratio)*clubCoef(club.r)*luck*growMul*C.talent*(window.__K||0.74)*dmp);
  } else {
    // 하락기: 지난 시즌 수상 보너스가 하락폭을 줄인다(×1.10 → 하락 ×0.8)
    C.ovr=Math.max(30,C.ovr+base*Math.max(0.5,1-(C.boost-1)*2));
    // 하락기: 스피드·체력은 더 빨리, 패스·시야·빌드업은 더 천천히
    C.off=C.off.map(function(o,i){ var m=DECLINE[st[i]]||1; return o+base*(m-1); });
  }
  // 훈련 방향은 오버롤이 아니라 "모양"을 바꾼다
  if(C.train==='강점 강화') C.off=C.off.map(function(o,i){ return Math.min(15,o+(w[i]>=1.2?1:w[i]<=0.9?-0.5:0)); });
  if(C.train==='약점 보완') C.off=C.off.map(function(o,i){ return Math.max(-25,o+(w[i]>=1.2?-0.5:w[i]<=0.9?1.5:0.5)); });
  syncSt();
  var deltas=C.st.map(function(v,i){ return Math.round(v)-Math.round(before[i]); });

  // 팀 성적·우승·개인 수상 — 등급(S/A/B/C)마다 명성·다음 시즌 성장·커리어 점수가 붙는다(HONOR_TIER)
  var top=Math.max.apply(null,ALL.filter(function(c){return c.nat===club.nat;}).map(function(c){return c.r;}));
  // 리그 우승: 같은 리그 구단들 명성으로 나눈 확률(강팀이 여럿이면 나눠 먹는다). 못 하면 순위는 명성 차이로
  // 표에 없는 나머지 리그 구단(약 12곳)도 분모에 넣는다 — 안 그러면 상위 구단 몇 개가 우승을 나눠 갖는다
  var lg=ALL.filter(function(c){return c.nat===club.nat;}), lo=Math.min.apply(null,lg.map(function(c){return c.r;}))-4;
  var z=lg.reduce(function(t,c){ return t+Math.exp(c.r/3.5); },0)+Math.max(0,20-lg.length)*Math.exp(lo/3.5);
  var champ=rng()<Math.exp(club.r/3.5)/z;
  var rank=champ?1:Math.max(2,Math.min(20,Math.round(1.5+(top-club.r)/2.2+(rng()-0.3)*4)));
  var hon=[], senior=!row0Youth, natN=natInfo(club.nat).n, ov=cOvr();
  var add=function(n,tier,kind){ hon.push({n:n,tier:tier,kind:kind||'ind'}); };
  // 챔스: 이번 시즌 출전 여부(최상위 구단은 늘, 상위 구단은 지난 시즌 4위 안이었으면)
  var inUCL=senior && (club.r>=86 || (club.r>=78 && C.uclNext===club.n));
  var uG=inUCL?Math.round(goals*0.24*(0.8+rng()*0.4)):0, uA=inUCL?Math.round(ast*0.24*(0.8+rng()*0.4)):0;
  if(senior){
    if(rank===1 && apps>=8) add(natN+' 리그 우승','B','team');
    if(apps>=8 && rng()<0.12*Math.pow(club.r/90,3)) add('컵 대회 우승','C','team');

      if(gk) add(natN+' 리그 득점왕','B'); if(ak) add(natN+' 리그 도움왕','B');

      if(uG>=9) add('챔스 득점왕','B'); if(uA>=6) add('챔스 도움왕','B');

      if(rating>=7.6 && rng()<0.2) add('챔스 올해의 '+{FW:'공격수',MF:'미드필더',DF:'수비수'}[C.pos],'B');

    if(C.age<=21 && ov>=80 && rating>=7.1 && rng()<0.5) add('골든보이','B');
    if(rng()<(C.pos==='FW'?0.008:0.004)) add('올해의 골','C');
  } else if(rng()<0.25) add('유스 리그 우승','-','team');
  // 다음 시즌 챔스: 상위 구단이 리그 4위 안이면
  C.uclNext = rank<=4 && club.r>=78 ? club.n : null;

  // 대표팀·국제 대회(시즌이 끝난 여름: 2030년부터 4년마다 월드컵, 그 사이 2년마다 대륙컵)
  var caps=0, cg=0, year=2026+(C.age-15)+1;
  if(C.age>=18 && ov>=NAT_BAR[C.nation]-2){
    caps=Math.round(4+rng()*6); cg=C.pos==='FW'?Math.round(caps*0.3*rng()):0;
    notes.push(natInfo(C.nation).n+' 대표팀에 뽑혔어요.');
    if(ov>=NAT_BAR[C.nation]+6 && rating>=7.0 && rng()<0.35) add(natInfo(C.nation).n+' 올해의 선수','C','nat');

    if(wc||cont){

      caps+=Math.round(3+rng()*4);

  }
  else if(C.age>=16 && C.age<18 && ov>=NAT_BAR[C.nation]-22) notes.push(natInfo(C.nation).n+' 연령별 대표팀에 뽑혔어요.');

  // 발롱도르·FIFA 올해의 선수: 그 시즌 활약을 점수로 매겨 "세계 경쟁자"와 비교한다(대표 대회까지 끝난 뒤에 계산).
  // 점수 = 개인 기록(포지션별) + 평점 + 팀 트로피 + 개인상 + 명성(오버롤), × 포지션 배율(투표가 공격수에게 쏠리는 현실 반영).
  if(senior && apps>=20){

    }

  var boost=1, fameAdd=0;

  C.boost=Math.min(1.15,boost);
  var counted=hon.filter(function(h){ return h.kind!=='ind'; }).map(function(h){ return h.n; });
  var awards=hon.filter(function(h){ return h.kind==='ind'; }).map(function(h){ return h.n; });
  if(C.boost>1) notes.push('수상 효과로 다음 시즌 성장 ×'+C.boost.toFixed(2)+(C.age>=28?'(하락 완화)':''));
  if(inUCL) notes.push('챔스 '+uG+'골 '+uA+'도움');

  // 명성: 1군 활약 보너스(−5~+8). 유스 경기 평점으로는 쌓이지 않고, 매 시즌 0 쪽으로 1씩 줄어든다(활약을 이어가야 유지).
  var fg=row0Youth ? 0 : (rating>=7.3?2:rating>=6.9?1:rating<6.3&&apps>5?-1:0)+fameAdd;
  C.fame=Math.max(-5,Math.min(12,C.fame-Math.sign(C.fame)+fg));

  // 1군 승격 때 등번호
  if(!C.num && C.age>=17 && (!youth()||onLoan||apps>0&&C.age===17&&cOvr()>=club.r-22)){
    if(rng()<0.6){ C.num=C.want; notes.push('원하던 '+C.want+'번을 받았어요.'); }
    else { C.num=[28,31,35,41,44,47][Math.floor(rng()*6)]; notes.push(C.want+'번은 주인이 있어서 '+C.num+'번을 받았어요.'); }
  }

  // 숨은 재능 힌트: 19·20세 시즌이 끝날 때(이미 성장 속도로 티가 나는 시점) 코치·스카우트 한마디
  if(C.age===19||C.age===20){
    var hint={1.5:['감독: "이런 재능은 10년에 한 번 나와요."','유럽 빅클럽 스카우트들이 훈련장을 찾아오기 시작했어요.'],
              1.25:['감독: "또래 중에선 단연 눈에 띄어요."','스카우트 리포트에 이름이 올랐어요.'],
              1.12:['감독: "성장 속도가 좋아요. 꾸준히만 하면 돼요."','코치진이 성장세를 좋게 보고 있어요.']}[C.talent];
    if(hint) notes.push(hint[C.age===19?0:1]);
  }
  var row={age:C.age, club:club.n, loan:onLoan, team:teamName(club), games:games, starts:starts, apps:apps, goals:goals, ast:ast, rating:rating, rank:rank, youth:youth()&&!onLoan,
           ovrBefore:o, ovr:cOvr(), dOvr:cOvr()-o, deltas:deltas, trophies:counted, awards:awards, hon:hon, caps:caps, cs:cs, notes:notes, injured:injured};
  C.hist.push(row); C.last=row;
  C.tot.apps+=apps; C.tot.goals+=goals; C.tot.ast+=ast; C.tot.cs=(C.tot.cs||0)+cs; C.tot.caps+=caps; C.tot.cg+=cg;
  C.trophies=C.trophies.concat(counted); C.awards=C.awards.concat(awards); C.honors=C.honors.concat(hon);
  if(/아스날/.test(club.n) && !row.youth){ C.arsenal.apps+=apps; C.arsenal.goals+=goals; }

function makeOffers(rng,row){
  if(C.age<17) return [];
  var n=row.rating>=7.2?3:row.rating>=6.8?2:row.apps>5?1:0;
  if(rng()<0.25) n=Math.max(0,n-1);
  // 제안은 내 명성과 비슷한 구단(±8)에서만 온다. 유스 보정(YOUTH_GAP)은 출전 확률 계산에만 쓰고 여기엔 넣지 않는다.
  var me=cRep(), out=[];
  var pool=ALL.filter(function(c){ return c.n!==C.club.n && c.r>=me-8 && c.r<=me+8; });
  var kinds=[['도전',function(c){return c.r>me+3;}],['적정',function(c){return Math.abs(c.r-me)<=3;}],['안정',function(c){return c.r<me-3;}]];
  kinds.forEach(function(k){ if(out.length>=n) return; var c=pool.filter(k[1]).filter(function(c){return out.every(function(o){return o.c.n!==c.n;});}); if(c.length){ out.push({c:c[Math.floor(rng()*c.length)], kind:k[0]}); } });
  // 꿈의 구단은 명성이 닿을 만하면 따로 한 번 더 노크
  var dream=ALL.filter(function(c){return c.n===C.dream;})[0];
  if(dream && dream.n!==C.club.n && dream.r<=me+10 && out.every(function(o){return o.c.n!==dream.n;}) && rng()<0.5) out.push({c:dream, kind:dream.r>me+3?'도전':'적정', dream:true});
  return out;
}

// 은퇴 카드: 시즌별 표(나이·구단·오버롤·경기·골·도움 + 그 시즌 트로피 아이콘) → 대표팀 줄 → 통산 → 트로피 진열장
var HON_ICON=[[/발롱도르/,'👑'],[/FIFA 올해의 선수/,'💎'],[/월드컵 우승/,'🌍'],[/(유로|코파 아메리카|아시안컵|골드컵|아프리카 네이션스컵) 우승/,'🌎'],
  [/챔피언스리그 우승/,'🏆','ucl'],[/리그 우승/,'🏆'],[/컵 대회 우승/,'🏅'],[/득점왕|골든슈/,'⚽'],[/도움왕/,'🎯'],[/골든볼/,'🥇'],[/.*/,'⭐']];
function honIcon(n){ for(var i=0;i<HON_ICON.length;i++) if(HON_ICON[i][0].test(n)) return HON_ICON[i]; }
// 시장가치(€M): 오버롤과 나이로 계산한 재미용 숫자
function marketValue(ovr,age){
  var af=age<=23?1.15:age<=28?1:({29:.8,30:.6,31:.45,32:.32,33:.22}[age]||.12);
  return 2.2*Math.exp((ovr-60)/7.5)*af;
}
function fmtVal(v){ return v>=100?'€'+Math.round(v)+'M':v>=1?'€'+v.toFixed(v>=10?0:1)+'M':'€'+Math.round(v*1000)+'K'; }
function pRetired(){
  var t=C.tot, last=C.hist[C.hist.length-1], lastClub=ALL.filter(function(c){return c.n===last.club;})[0]||C.club;
  var grade=C.peak>=90?'월드 클래스':C.peak>=84?'스타':C.peak>=76?'주전급':C.peak>=68?'프로':'저니맨';
  var peakVal=0; C.hist.forEach(function(r){ peakVal=Math.max(peakVal,marketValue(r.ovr,r.age)); });
  var posKo={FW:'FW',MF:'MF',DF:'DF'}[C.pos];
  // 머리: 오버롤 타일 + 국적·포지션·번호 + 마지막 구단 + 은퇴 나이·최고 가치
  var h='<div class="rc-head">'
   +'<div class="rc-ovr'+(C.peak>=90?' elite':'')+'"><span>최고 OVR</span><b>'+C.peak+'</b></div>'
   +'<div class="rc-id"><div class="rc-chips"><span class="rc-chip">'+natInfo(C.nation).f+' '+natInfo(C.nation).n+'</span><span class="rc-chip gold">'+(C.num?'#'+C.num+' ':'')+posKo+'</span></div>'
   +'<div class="rc-name">'+esc(C.name)+'</div>'
   +'<div class="rc-sub">'+CARDS[C.pos][C.card].n+' · '+grade+'</div></div>'
   +'<div class="rc-meta"><div><span>은퇴</span><b>'+C.age+'세</b></div><div><span>최고 가치</span><b>'+fmtVal(peakVal)+'</b></div></div></div>';
  // 시즌 표
  h+='<div class="rc-table"><div class="rc-row hd"><span>나이</span><span>구단</span><span>OVR</span><span>경기</span><span>골</span><span>'+(C.pos==='DF'?'CS':'도움')+'</span></div>';
  C.hist.forEach(function(r){
    var club=ALL.filter(function(c){return c.n===r.club;})[0]||{n:r.club,col:'#444'};
    var ars=/아스날/.test(r.club)&&!r.youth;
    var hs=(r.hon||[]).filter(function(x){return x.tier&&x.tier!=='C'&&x.tier!=='-'&&x.kind!=='nat';}).sort(function(a,b){ return 'SAB'.indexOf(a.tier)-'SAB'.indexOf(b.tier); });
    var icons=hs.slice(0,3).map(function(x){ return trophySvg(x.n,20); }).join('')+(hs.length>3?'<b>+'+(hs.length-3)+'</b>':'');
    var oc=r.youth?'y':r.ovr>=90?'e':r.ovr>=80?'g':'n';
    h+='<div class="rc-row'+(r.youth?' youth':'')+(ars?' ars':'')+'">'
     +'<span class="age">'+r.age+'</span>'
     +'<span class="rcc">'+crest(club,24)+'<em>'+esc(r.team)+(r.loan?' <small>임대</small>':'')+'</em>'+(icons?'<span class="ic">'+icons+'</span>':'')+'</span>'
     +'<span class="ovr '+oc+'">'+r.ovr+'</span><span>'+r.apps+'</span><span>'+r.goals+'</span><span>'+(C.pos==='DF'?(r.cs||0):r.ast)+'</span></div>';
  });
  // 대표팀 줄
  var natHon=C.honors.filter(function(x){return x.kind==='nat'&&/우승/.test(x.n);});
  if(t.caps) h+='<div class="rc-row nat"><span class="age">'+natInfo(C.nation).f+'</span><span class="rcc"><em>'+natInfo(C.nation).n+' 대표팀</em>'
     +(natHon.length?'<span class="ic">'+natHon.map(function(x){ return trophySvg(x.n,20); }).join('')+'</span>':'')+'</span>'
     +'<span></span><span>'+t.caps+'</span><span>'+t.cg+'</span><span>—</span></div>';
  h+='</div>';
  // 통산
  var grp={}, order=[];
  C.honors.filter(function(x){return x.tier&&x.tier!=='-';}).forEach(function(x){ var nm=String(x.n).split(' ×')[0], n=+(String(x.n).split('×')[1])||1;
    if(!grp[nm]){ grp[nm]={n:nm,tier:x.tier,c:0}; order.push(nm); } grp[nm].c+=n; });
  order.sort(function(a,b){ return 'SABC'.indexOf(grp[a].tier)-'SABC'.indexOf(grp[b].tier) || grp[b].c-grp[a].c; });
  var nTro=C.honors.filter(function(x){return x.kind!=='ind'&&x.tier!=='-'&&/우승/.test(x.n);}).length;
  h+='<div class="rc-end"><div class="rc-end-t">커리어가 끝났어요</div>'
   +'<div class="rc-tot">'+[[t.apps,'경기'],[t.goals,'골'],C.pos==='DF'?[t.cs||0,'클린시트']:[t.ast,'도움'],[nTro,'우승']].map(function(x){ return '<div><span>'+x[1]+'</span><b>'+x[0]+'</b></div>'; }).join('')+'</div>'
   +'<div class="rc-score"><span>커리어 점수</span><b>'+careerScore().toLocaleString()+'</b></div>';
  // 트로피 진열장: S·A·B는 아이콘 타일, C는 접기
  var main=order.filter(function(k){return grp[k].tier!=='C';}), minor=order.filter(function(k){return grp[k].tier==='C';});
  if(main.length) h+='<div class="rc-shelf">'+main.map(function(k){ var g=grp[k], ic=honIcon(k);
      return '<div class="rc-tro t'+g.tier+'"><div class="i">'+trophySvg(k,58)+(g.c>1?'<em>×'+g.c+'</em>':'')+'</div><div class="l">'+esc(k)+'</div></div>'; }).join('')+'</div>';
  if(minor.length) h+='<details class="rc-minor"><summary>기타 수상 '+minor.reduce(function(s,k){return s+grp[k].c;},0)+'개</summary><div class="badges">'
      +minor.map(function(k){ return '<span class="mi">'+trophySvg(k,16)+esc(k)+(grp[k].c>1?' ×'+grp[k].c:'')+'</span>'; }).join('')+'</div></details>';
  if(!order.length) h+='<div class="note" style="text-align:center">트로피 없이 끝난 커리어예요.</div>';
  h+='</div>';
  document.getElementById('app').innerHTML=h;
  document.getElementById('dock').innerHTML='<button class="btn ghost2" onclick="C=null;S={step:1,name:\'\',nation:null,foot:null,pos:null,num:null,dream:null,card:null,add:[0,0,0,0,0],club:null};go(1)">새 커리어</button><button class="btn" onclick="alert(\'목업이라 실제 등록은 안 돼요\')">랭킹 등록</button>';
}

// 목업 확인용: 이벤트는 첫 번째 선택, 잔류로 n시즌 자동 진행
function autoRun(n){
  for(var i=0;i<n && C.age<37;i++){
    if(C.phase==='prep'){ C.evPick=0; playSeason(); }
    if(C.phase==='result' && i<n-1){ C.pick=null; nextSeason(); }
  }
}

document.body.insertAdjacentHTML('afterbegin', TROPHY_DEFS);
render();
</script>
</body>
</html>
